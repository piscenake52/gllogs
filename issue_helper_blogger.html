<!-- Blogger の固定ページ(HTMLビュー)に、このままコピー&貼り付けして公開する。<html>/<head>/<body> は含めない。
     CSSは #glih の中だけに効くようにしてあり、ブログのテーマには影響しない -->
<style>
/*<![CDATA[*/
/* ページ全体の背景も黒にする: helper (#glih) を含む親要素すべて(body / 記事の枠など。テーマが違ってもクラス名に依存しない)の背景を黒にする */
html:has(#glih), body:has(#glih), :has(> #glih), :has(#glih):not(#glih) { background:#121212 !important; background-image:none !important; color-scheme:dark; }
/*]]>*/
</style>
<div id="glih">
<style>
/*<![CDATA[*/
#glih { --bg:#121212; --card:#1b1b1d; --text:#f4f4f5; --sub:#a1a1aa; --line:#3f3f46; --btn:#27272a; --accent:#3b82f6; --accent-text:#fff; color-scheme:dark;
  box-sizing:border-box; max-width:520px; margin:0 auto; padding:14px; background:var(--bg); color:var(--text);
