<!-- Blogger の固定ページ(HTMLビュー)に、このままコピー&貼り付けして公開する。<html>/<head>/<body> は含めない。
     CSSは #glih の中だけに効くようにしてあり、ブログのテーマには影響しない -->
<div id="glih">
<style>
/*<![CDATA[*/
#glih { --bg:#fff; --card:#fafafa; --text:#222; --sub:#666; --line:#d4d4d8; --btn:#f4f4f5; --accent:#2563eb; --accent-text:#fff;
  box-sizing:border-box; max-width:440px; margin:0 auto; padding:14px; background:var(--bg); color:var(--text);
  font:14px/1.5 -apple-system,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif; border-radius:12px; text-align:left; }
@media (prefers-color-scheme: dark) { #glih { --bg:#121212; --card:#1b1b1d; --text:#f4f4f5; --sub:#a1a1aa; --line:#3f3f46; --btn:#27272a; --accent:#3b82f6; } }
#glih *, #glih *::before, #glih *::after { box-sizing:border-box; }
#glih h1 { font-size:16px; margin:0 0 4px; padding:0; color:var(--text); border:0; }
#glih .lead { font-size:12px; color:var(--sub); margin:0 0 14px; line-height:1.6; }
#glih .tabs { display:flex; gap:6px; margin-bottom:12px; }
#glih .tabs button { flex:1; padding:8px; border-radius:8px; border:1px solid var(--line); background:var(--btn); color:var(--text); font:inherit; font-size:13px; cursor:pointer; box-shadow:none; }
#glih .tabs button.on { background:var(--accent); border-color:var(--accent); color:var(--accent-text); }
#glih section { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin:0; }
#glih section[hidden] { display:none; }
#glih .field { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
#glih .field > label { flex:0 0 4.5em; font-size:12px; font-weight:600; color:var(--sub); margin:0; }
#glih .field input[type=date], #glih .field input[type=time] { flex:1; min-width:0; width:auto; height:auto; margin:0; padding:8px; font:inherit; font-size:16px; color:var(--text); background:var(--bg); border:1px solid var(--line); border-radius:8px; box-shadow:none; }
#glih .field input:disabled { opacity:.4; }
#glih .small { font:inherit; font-size:12px; padding:7px 10px; margin:0; border-radius:8px; border:1px solid var(--line); background:var(--btn); color:var(--text); cursor:pointer; white-space:nowrap; box-shadow:none; }
#glih .chk { font-size:12px; color:var(--sub); display:flex; align-items:center; gap:6px; margin:-2px 0 10px 4.5em; }
#glih .chk input { margin:0; }
#glih .out { font-size:12px; color:var(--sub); margin:12px 0; display:flex; flex-wrap:wrap; align-items:center; gap:6px 8px; }
#glih .out code { font-size:14px; color:var(--text); background:var(--btn); border:0; border-radius:6px; padding:3px 8px; min-width:6em; text-align:center; }
#glih a.go { display:block; text-align:center; padding:11px; border-radius:10px; background:var(--accent); color:var(--accent-text) !important; text-decoration:none !important; font-size:14px; font-weight:600; }
#glih a.go[aria-disabled="true"] { opacity:.4; pointer-events:none; }
#glih .note { font-size:11px; color:var(--sub); margin:10px 0 0; line-height:1.6; }
/*]]>*/
</style>

<h1>日付・時間を選んで New Issue を開く</h1>
<p class="lead">カレンダー/時刻ピッカーで選ぶと、その値が入力済みの Issue フォームが開きます。フォーム側では、これまでどおり自由入力で書き換えられます。</p>

<div class="tabs"><button type="button" data-tab="logs" class="on">logs</button><button type="button" data-tab="setlist">setlist</button></div>

<section id="glih-p-logs">
  <div class="field"><label for="glih-d1">date</label><input type="date" id="glih-d1"><button type="button" class="small" data-today="glih-d1">今日</button></div>
  <div class="field"><label for="glih-t1">time</label><input type="time" id="glih-t1" step="60"></div>
  <label class="chk"><input type="checkbox" id="glih-n1" checked> 時間なし（time は入力しない）</label>
  <div class="out"><span>date</span><code id="glih-o-date">&#8212;</code><button type="button" class="small" data-copy="glih-o-date">コピー</button><span>time</span><code id="glih-o-time">&#8212;</code><button type="button" class="small" data-copy="glih-o-time">コピー</button></div>
  <a class="go" id="glih-go-logs" target="_blank" rel="noopener" aria-disabled="true">logs の New Issue を開く</a>
  <p class="note">date は8桁（例 20261105）、time は4桁（例 1800）の形でフォームに入ります。</p>
</section>

<section id="glih-p-setlist" hidden>
  <div class="field"><label for="glih-d2">date</label><input type="date" id="glih-d2"><button type="button" class="small" data-today="glih-d2">今日</button></div>
  <div class="field"><label for="glih-t2">開演時刻</label><input type="time" id="glih-t2" step="60"></div>
  <div class="out"><span>setlistid</span><code id="glih-o-sid">&#8212;</code><button type="button" class="small" data-copy="glih-o-sid">コピー</button></div>
  <a class="go" id="glih-go-setlist" target="_blank" rel="noopener" aria-disabled="true">setlist の New Issue を開く</a>
  <p class="note">setlistid は date + 開演時刻の12桁（例 202609221830）です。date と時刻の両方を選ぶと開けます。</p>
</section>

<script>
//<![CDATA[
(function () {
  // Settings: repository and issue template file names (in .github/ISSUE_TEMPLATE/)
  var REPO = 'piscenake52/gllogs', TPL_LOGS = 'add_logs.yml', TPL_SETLIST = 'add_setlist.yml';
  var root = document.getElementById('glih');
  // NOTE: keep this script ASCII-only. Blogger converts non-ASCII characters into &#NNNN; entities, which are NOT decoded inside <script>.
  var DASH = '\u2014'; // em dash as an ASCII escape: Blogger turns a literal dash inside <script> into &#8212;, which JS does not decode
  function $(id) { return document.getElementById('glih-' + id); }
  function digits(v) { return (v || '').replace(/[-:]/g, ''); }
  function issueUrl(tpl, params) {
    var q = new URLSearchParams(Object.assign({ template: tpl }, params));
    return 'https://github.com/' + REPO + '/issues/new?' + q.toString(); // the form field ids (date / time / setlistid) are used as the parameter names
  }
  function setLink(a, url) { if (url) { a.href = url; a.setAttribute('aria-disabled', 'false'); } else { a.removeAttribute('href'); a.setAttribute('aria-disabled', 'true'); } }
  function updateLogs() {
    var date = digits($('d1').value), noTime = $('n1').checked, time = noTime ? '' : digits($('t1').value);
    $('t1').disabled = noTime;
    $('o-date').textContent = date || DASH; $('o-time').textContent = time || DASH;
    var p = {}; if (date) p.date = date; if (time) p.time = time;
    setLink($('go-logs'), date && (noTime || time) ? issueUrl(TPL_LOGS, p) : '');
  }
  function updateSetlist() {
    var sid = digits($('d2').value) + digits($('t2').value), ok = /^\d{12}$/.test(sid);
    $('o-sid').textContent = ok ? sid : DASH;
    setLink($('go-setlist'), ok ? issueUrl(TPL_SETLIST, { setlistid: sid }) : '');
  }
  function tab(name) {
    $('p-logs').hidden = name !== 'logs'; $('p-setlist').hidden = name !== 'setlist';
    [].forEach.call(root.querySelectorAll('.tabs button'), function (b) { b.classList.toggle('on', b.getAttribute('data-tab') === name); });
  }
  function today() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }

  [].forEach.call(root.querySelectorAll('.tabs button'), function (b) { b.onclick = function () { var n = b.getAttribute('data-tab'); tab(n); try { history.replaceState(null, '', '#' + n); } catch (e) {} }; });
  [].forEach.call(root.querySelectorAll('[data-today]'), function (b) { b.onclick = function () { document.getElementById(b.getAttribute('data-today')).value = today(); updateLogs(); updateSetlist(); }; });
  [].forEach.call(root.querySelectorAll('[data-copy]'), function (b) {
    b.onclick = function () {
      var t = document.getElementById(b.getAttribute('data-copy')).textContent; if (t === DASH) return;
      var done = function () { var o = b.textContent; b.textContent = 'OK'; setTimeout(function () { b.textContent = o; }, 900); };
      if (navigator.clipboard) navigator.clipboard.writeText(t).then(done, function () {});
      else { var x = document.createElement('textarea'); x.value = t; document.body.appendChild(x); x.select(); try { document.execCommand('copy'); done(); } catch (e) {} document.body.removeChild(x); }
    };
  });
  ['d1', 't1', 'n1'].forEach(function (id) { $(id).addEventListener('input', updateLogs); $(id).addEventListener('change', updateLogs); });
  ['d2', 't2'].forEach(function (id) { $(id).addEventListener('input', updateSetlist); $(id).addEventListener('change', updateSetlist); });
  $('d1').value = today(); $('d2').value = today();
  tab(location.hash === '#setlist' ? 'setlist' : 'logs');
  updateLogs(); updateSetlist();
})();
//]]>
</script>
</div>
