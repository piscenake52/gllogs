<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>New Issue 日時ヘルパー</title>
<link rel="icon" href="data:,">
<style>
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #fff; --card: #fafafa; --text: #222; --sub: #666; --line: #e4e4e7; --btn: #f4f4f5; --accent: #2563eb; --accent-text: #fff; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #121212; --card: #1b1b1d; --text: #f4f4f5; --sub: #a1a1aa; --line: #3f3f46; --btn: #27272a; --accent: #3b82f6; } }
:root[data-theme="dark"] { --bg: #121212; --card: #1b1b1d; --text: #f4f4f5; --sub: #a1a1aa; --line: #3f3f46; --btn: #27272a; --accent: #3b82f6; }
body { margin: 0; padding: 18px 14px 32px; background: var(--bg); color: var(--text); font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; }
main { max-width: 440px; margin: 0 auto; }
h1 { font-size: 16px; margin: 0 0 4px; } .lead { font-size: 12px; color: var(--sub); margin: 0 0 14px; line-height: 1.6; }
.tabs { display: flex; gap: 6px; margin-bottom: 12px; }
.tabs button { flex: 1; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--btn); color: var(--text); font: inherit; font-size: 13px; cursor: pointer; }
.tabs button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.field { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.field > label { flex: 0 0 4.5em; font-size: 12px; font-weight: 600; color: var(--sub); }
.field input[type=date], .field input[type=time] { flex: 1; min-width: 0; padding: 8px; font: inherit; font-size: 16px; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
.field input:disabled { opacity: .4; }
.small { font: inherit; font-size: 12px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--btn); color: var(--text); cursor: pointer; white-space: nowrap; }
.chk { font-size: 12px; color: var(--sub); display: flex; align-items: center; gap: 6px; margin: -2px 0 10px 4.5em; }
.out { font-size: 12px; color: var(--sub); margin: 12px 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.out code { font-size: 14px; color: var(--text); background: var(--btn); border-radius: 6px; padding: 3px 8px; min-width: 6em; text-align: center; }
.go { display: block; text-align: center; padding: 11px; border-radius: 10px; background: var(--accent); color: var(--accent-text); text-decoration: none; font-size: 14px; font-weight: 600; }
.go[aria-disabled="true"] { opacity: .4; pointer-events: none; }
.note { font-size: 11px; color: var(--sub); margin: 10px 0 0; line-height: 1.6; }
</style>
</head>
<body>
<main>
  <h1>日付・時間を選んで New Issue を開く</h1>
  <p class="lead">カレンダー/時刻ピッカーで選ぶと、その値が入力済みの Issue フォームが開きます。フォーム側では、これまでどおり自由入力で書き換えられます。</p>

  <div class="tabs"><button type="button" data-tab="logs" class="on">logs</button><button type="button" data-tab="setlist">setlist</button></div>

  <section id="p-logs">
    <div class="field"><label for="d1">date</label><input type="date" id="d1"><button type="button" class="small" data-today="d1">今日</button></div>
    <div class="field"><label for="t1">time</label><input type="time" id="t1" step="60"></div>
    <label class="chk"><input type="checkbox" id="n1" checked> 時間なし（time は入力しない）</label>
    <div class="out"><span>date</span><code id="o-date">—</code><button type="button" class="small" data-copy="o-date">コピー</button><span>time</span><code id="o-time">—</code><button type="button" class="small" data-copy="o-time">コピー</button></div>
    <a class="go" id="go-logs" target="_blank" rel="noopener" aria-disabled="true">logs の New Issue を開く</a>
    <p class="note">date は8桁（例 20261105）、time は4桁（例 1800）の形でフォームに入ります。</p>
  </section>

  <section id="p-setlist" hidden>
    <div class="field"><label for="d2">date</label><input type="date" id="d2"><button type="button" class="small" data-today="d2">今日</button></div>
    <div class="field"><label for="t2">開演時刻</label><input type="time" id="t2" step="60"></div>
    <div class="out"><span>setlistid</span><code id="o-sid">—</code><button type="button" class="small" data-copy="o-sid">コピー</button></div>
    <a class="go" id="go-setlist" target="_blank" rel="noopener" aria-disabled="true">setlist の New Issue を開く</a>
    <p class="note">setlistid は date + 開演時刻の12桁（例 202609221830）です。date と時刻の両方を選ぶと開けます。</p>
  </section>
</main>
<script>
// 設定: リポジトリとIssueテンプレートのファイル名(.github/ISSUE_TEMPLATE/ 内)
var REPO = 'piscenake52/gllogs', TPL_LOGS = 'add_logs.yml', TPL_SETLIST = 'add_setlist_songs.yml';

function $(id) { return document.getElementById(id); }
function digits(v) { return (v || '').replace(/[-:]/g, ''); }
function issueUrl(tpl, params) {
  var q = new URLSearchParams(Object.assign({ template: tpl }, params));
  return 'https://github.com/' + REPO + '/issues/new?' + q.toString(); // フォームの項目id(date / time / setlistid)をそのままパラメータ名にする
}
function setLink(a, url) { if (url) { a.href = url; a.setAttribute('aria-disabled', 'false'); } else { a.removeAttribute('href'); a.setAttribute('aria-disabled', 'true'); } }

function updateLogs() {
  var date = digits($('d1').value), noTime = $('n1').checked, time = noTime ? '' : digits($('t1').value);
  $('t1').disabled = noTime;
  $('o-date').textContent = date || '—'; $('o-time').textContent = time || '—';
  var p = {}; if (date) p.date = date; if (time) p.time = time;
  setLink($('go-logs'), date && (noTime || time) ? issueUrl(TPL_LOGS, p) : '');
}
function updateSetlist() {
  var sid = digits($('d2').value) + digits($('t2').value);
  var ok = /^\d{12}$/.test(sid);
  $('o-sid').textContent = ok ? sid : '—';
  setLink($('go-setlist'), ok ? issueUrl(TPL_SETLIST, { setlistid: sid }) : '');
}
function tab(name) {
  $('p-logs').hidden = name !== 'logs'; $('p-setlist').hidden = name !== 'setlist';
  [].forEach.call(document.querySelectorAll('.tabs button'), function (b) { b.classList.toggle('on', b.dataset.tab === name); });
}
function today() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }

[].forEach.call(document.querySelectorAll('.tabs button'), function (b) { b.onclick = function () { tab(b.dataset.tab); history.replaceState(null, '', '#' + b.dataset.tab); }; });
[].forEach.call(document.querySelectorAll('[data-today]'), function (b) { b.onclick = function () { $(b.dataset.today).value = today(); updateLogs(); updateSetlist(); }; });
[].forEach.call(document.querySelectorAll('[data-copy]'), function (b) {
  b.onclick = function () {
    var t = $(b.dataset.copy).textContent; if (t === '—') return;
    var done = function () { var o = b.textContent; b.textContent = 'OK'; setTimeout(function () { b.textContent = o; }, 900); };
    if (navigator.clipboard) navigator.clipboard.writeText(t).then(done, function () {}); else { var x = document.createElement('textarea'); x.value = t; document.body.appendChild(x); x.select(); try { document.execCommand('copy'); done(); } catch (e) {} document.body.removeChild(x); }
  };
});
['d1', 't1', 'n1'].forEach(function (id) { $(id).addEventListener('input', updateLogs); $(id).addEventListener('change', updateLogs); });
['d2', 't2'].forEach(function (id) { $(id).addEventListener('input', updateSetlist); $(id).addEventListener('change', updateSetlist); });
$('d1').value = today(); $('d2').value = today();
tab(location.hash === '#setlist' ? 'setlist' : 'logs');
updateLogs(); updateSetlist();
</script>
</body>
</html>
