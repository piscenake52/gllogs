name: "songs"
description: "insert / update / delete"
title: "[DATA] songs"
body:
  - type: checkboxes
    id: artist_check
    attributes:
      label: "artist / 選択"
      options:
        - label: "Girls²"
        - label: "Laki"


  - type: input
    id: artist_free
    attributes:
      label: "artist / 自由入力"


  - type: input
    id: item_title
    attributes:
      label: "title"


  - type: input
    id: link
    attributes:
      label: "link"

  - type: input
    id: lyrics
    attributes:
      label: "lyrics"
      description: "https://www.uta-net.com/ から始まるURL"

  - type: textarea
    id: videos
    attributes:
      label: "videos"
      description: |
        YouTubeの動画。1行1件で `type | URL | tags`（typeを省略するとOther。tagsは省略可・カンマ区切り）。入力すると動画リンク全体が**置き換わります**（空欄なら既存を維持）。
        typeの例: MV / Dance Practice / Call Lecture / Lyric / Live / Reaction（自由入力も可）
      placeholder: |
        MV | https://youtu.be/xxxxxxxxxxx
        Dance Practice | https://www.youtube.com/watch?v=xxxxxxxxxxx
        Live | https://youtu.be/xxxxxxxxxxx | Fancam, Studio


  - type: checkboxes
    id: clear
    attributes:
      label: "値の削除（更新時）"
      options:
        - label: "link"
        - label: "lyrics"
        - label: "videos"

  - type: checkboxes
    id: delete
    attributes:
      label: "DELETE"
      options:
        - label: "削除する"
