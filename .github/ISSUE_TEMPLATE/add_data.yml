name: "データ追加・更新フォーム (詳細版)"
description: "gllogsの構造化データ（logs, setlist, songs）を追加・更新します"
title: "[DATA]"
body:
  - type: markdown
    attributes:
      value: |
        - **更新のとき**: 識別キー（logs=logid / setlist=セットリストID / songs=アーティスト+タイトル）を入力し、**変更したい項目だけ**入力してください。空欄の項目は既存の値がそのまま残ります。
        - **項目を消したいとき**: その項目に `!clear` と入力してください。
        - 使わない種類の項目は空欄のままで構いません。

  - type: dropdown
    id: target_type
    attributes:
      label: "データの種類 (Type / logs, setlist, songs)"
      options:
        - logs
        - setlist
        - songs
    validations:
      required: true

  - type: markdown
    attributes:
      value: "## logs 用"

  - type: input
    id: logid
    attributes:
      label: "ログID (logid)"
      description: "更新する場合は既存のlogidを入力。新規追加時は空欄（日付_時間_種別 で自動発行）。"
      placeholder: "20260924_1200_DIARY"

  - type: input
    id: date
    attributes:
      label: "日付 (date)"
      description: "logsの新規追加で必須。8桁の数字 (例: 20260924)"
      placeholder: "20260924"

  - type: input
    id: time
    attributes:
      label: "時間 (time)"
      description: "4桁の数字 (例: 1200)。新規で空欄なら 0000"
      placeholder: "1200"

  - type: dropdown
    id: contents
    attributes:
      label: "コンテンツ種別 (contents)"
      description: "未選択の場合、新規追加は ETC になります。更新時は既存値を維持します（変えたいときだけ選択）。"
      options:
        - DIARY
        - GTUBE
        - GLRADIO
        - COLUMN
        - CL
        - CLOSE
        - YOUTUBE
        - ANNIVERSARY
        - FANCLUB
        - SNS
        - TICKET
        - EVENT
        - CD
        - WEB
        - RESULT
        - LIVE
        - RADIO
        - BIRTHDAY
        - RELEASEEVENT
        - TV
        - COOKING
        - STREAMING
        - DIGITAL
        - STAGE
        - GOODS
        - MOVIE
        - CAMPAIGN
        - MODEL
        - ETC
        - MAGAZINE
        - DEBUT
        - FORMATION
        - MESSAGE
        - PLAYING
        - MUSICCARD

  - type: input
    id: title
    attributes:
      label: "タイトル (title)"
      description: "logs / setlist / songs 共通のタイトル"
      placeholder: "イベント名や記事タイトル、曲名"

  - type: input
    id: display_pc
    attributes:
      label: "display_pc"
      placeholder: "なし"

  - type: input
    id: display_sp
    attributes:
      label: "display_sp"
      placeholder: "なし"

  - type: input
    id: url
    attributes:
      label: "URL (url)"
      description: "logsではURL、songsでは楽曲リンク"
      placeholder: "https://..."

  - type: input
    id: map
    attributes:
      label: "マップ情報 (map)"
      placeholder: "なし"

  - type: input
    id: setlistid
    attributes:
      label: "セットリストID (setlistid)"
      description: "logsでは関連するセットリストのID、setlistでは登録するセットリスト自身のID（12桁: 日付+開演時刻）"
      placeholder: "202609221830"

  - type: checkboxes
    id: groups_g2
    attributes:
      label: "グループ/メンバー Girls² (groups)"
      description: "logsの新規追加で、Girls²・Lakiどちらも未選択なら全員を自動設定します。更新時に未選択なら既存値を維持します。"
      options:
        - label: "G2"
        - label: "YZH"
        - label: "MMK"
        - label: "MSK"
        - label: "YOK"
        - label: "KUR"
        - label: "MNM"
        - label: "KIR"

  - type: checkboxes
    id: groups_l2
    attributes:
      label: "グループ/メンバー Laki (groups)"
      options:
        - label: "L2"
        - label: "RIN"
        - label: "TBK"
        - label: "HIR"
        - label: "YUW"
        - label: "KAN"
        - label: "RRK"
        - label: "AKR"
        - label: "KIK"

  - type: textarea
    id: relations
    attributes:
      label: "関連情報 (relations - JSON配列またはカンマ区切り)"
      placeholder: "TOA, KUR"

  - type: textarea
    id: tags
    attributes:
      label: "タグ (tags - カンマ区切り)"
      placeholder: "tag1, tag2, tag3"

  - type: markdown
    attributes:
      value: "## setlist / songs 用"

  - type: input
    id: artist
    attributes:
      label: "アーティスト (artist / setlist・songs用)"
      description: "setlistの新規追加ではtitleとともに必須。songsは artist+title が識別キー。"
      placeholder: "Girls² / Laki"

  - type: input
    id: member
    attributes:
      label: "出演メンバー (member / setlist用 - カンマ区切り)"
      description: "新規で空欄なら artist が Girls² / Laki のとき全員を自動設定します。"
      placeholder: "YZH, MMK, MSK, YOK, KUR, MNM, KIR"

  - type: input
    id: venue
    attributes:
      label: "会場 (venue / setlist用)"
      placeholder: "Kアリーナ横浜"

  - type: textarea
    id: songs
    attributes:
      label: "曲目 (songs / setlist用 - 1行1曲)"
      description: |
        書式: `[順番:] 曲名 | type | original | notes`
        順番を省略すると前の曲+1。typeを省略すると song（allow / encore / medley も可、空にしたいときは - ）。
        入力すると曲目全体が**置き換わります**（空欄なら既存の曲目を維持）。
      placeholder: |
        1: OPENING | -
        2: Fun!Fun!Fun! ～夢∞～
        3: キミすき
        4: ichigo 〜一期一会〜 | medley
        5: Gimme 143 | encore
