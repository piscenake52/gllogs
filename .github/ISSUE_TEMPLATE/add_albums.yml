name: "albums"
description: "free text, e.g. album / ep / single / musiccard / digital / dvd / bd (tracklist and editions): insert / update / delete"
title: "[DATA] albums"
body:
  - type: markdown
    attributes:
      value: |
        helper の albums タブから開いてください。入力済みの内容をそのまま送信します。

  - type: input
    id: album_title
    attributes:
      label: "album title"

  - type: input
    id: album_type
    attributes:
      label: "album type"
      description: "free text, e.g. album / ep / single / musiccard / digital / dvd / bd"

  - type: input
    id: album_id
    attributes:
      label: "album id"
      description: "12桁のid(helperが作ります。空なら title + type で判定し、新規はサーバー側で採番)"

  - type: textarea
    id: logids
    attributes:
      label: "logids"
      description: "この盤に紐づけるlogsのlogid(1行に1つ)。ここにないlogs行のalbumidは外れます。helperが入力します"

  - type: textarea
    id: album_json
    attributes:
      label: "album json"
      description: "date / tracks / editions (JSON). helper が作ります"

  - type: checkboxes
    id: delete
    attributes:
      label: "DELETE"
      options:
        - label: "削除する"
