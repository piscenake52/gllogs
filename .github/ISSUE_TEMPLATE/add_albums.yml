name: "albums"
description: "free text, e.g. album / mini album / ep / single / musiccard / digital / dvd / blu-ray (tracklist and editions): insert / update / delete"
title: "[DATA] albums"
body:
  - type: markdown
    attributes:
      value: |
        helper の albums タブから開いてください（入力済みの内容を送信します）。

  - type: input
    id: album_title
    attributes:
      label: "album title"

  - type: input
    id: album_type
    attributes:
      label: "album type"
      description: "free text, e.g. album / mini album / ep / single / musiccard / digital / dvd / blu-ray"

  - type: input
    id: album_id
    attributes:
      label: "album id"
      description: "12桁の id（helper が作成。空なら title + type で判定し、新規は自動採番）"

  - type: textarea
    id: logids
    attributes:
      label: "logids"
      description: "この盤に紐づける logid（1行に1つ。ここにない行の albumid は外れます。helper が入力）"

  - type: textarea
    id: album_json
    attributes:
      label: "album json"
      description: "date / tracks / editions（JSON。helper が作成）"

  - type: checkboxes
    id: delete
    attributes:
      label: "DELETE"
      options:
        - label: "削除する"
