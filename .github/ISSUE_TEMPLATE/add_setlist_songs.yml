name: "setlist / songs"
description: "insert / update / delete"
title: "[DATA] setlist / songs"
body:
  - type: markdown
    attributes:
      value: |
        📅 [カレンダーで日付・開演時刻を選ぶ](https://gl-log.blogspot.com/p/issuehelper.html#setlist) — 選んだ値が入力済みで開きます。直接入力もできます。

  - type: input
    id: setlistid
    attributes:
      label: "setlistid"

  - type: checkboxes
    id: artist_check
    attributes:
      label: "artist / 選択"
      options:
        - label: "Girls²"
        - label: "Laki"

  - type: input
    id: artist_free
    attributes:
      label: "artist / 自由入力"

  - type: input
    id: title
    attributes:
      label: "title"

  - type: input
    id: link
    attributes:
      label: "link"

  - type: input
    id: lyrics
    attributes:
      label: "lyrics"
      description: "https://www.uta-net.com/ から始まるURL"

  - type: textarea
    id: videos
    attributes:
      label: "videos"
      description: |
        YouTube動画。1行1件で `type | URL`（type 省略は Other）。入力すると動画リンク全体が**置き換わります**（空欄なら維持）。
        type の例: MV / Dance Practice / Call Lecture / Lyric / Live / Reaction（自由入力も可）
      placeholder: |
        MV | https://youtu.be/xxxxxxxxxxx
        Dance Practice | https://www.youtube.com/watch?v=xxxxxxxxxxx

  - type: dropdown
    id: member_g2
    attributes:
      label: "member / Girls²"
      multiple: true
      options:
        - G2
        - YZH
        - MMK
        - MSK
        - YOK
        - KUR
        - MNM
        - KIR
        - TOA
        - RAN

  - type: dropdown
    id: member_l2
    attributes:
      label: "member / Laki"
      multiple: true
      options:
        - L2
        - RIN
        - TBK
        - HIR
        - YUW
        - KAN
        - RRK
        - AKR
        - KIK
        - YUR

  - type: input
    id: member_free
    attributes:
      label: "member / 自由入力"
      description: "G2,YZH,MMK,MSK,YOK,KUR,MNM,KIR,TOA,RAN / L2,RIN,TBK,HIR,YUW,KAN,RRK,AKR,KIK,YUR"

  - type: input
    id: venue
    attributes:
      label: "venue"


  - type: input
    id: source
    attributes:
      label: "source"
      description: "OFFICIAL（公式）/ FAN MADE（ファンメイド）。不明なら空のまま（変更なし）。消すときは !clear か「値の削除」"

  - type: textarea
    id: songs
    attributes:
      label: "曲目 (songs / setlist用 - 1行1曲)"
      description: |
        書式: `[順番:] 曲名 | type | original | notes`
        順番を省略すると前の曲+1、type を省略すると song（空にするときは `-`）。
        入力すると曲目全体が**置き換わります**（空欄なら維持）。
      placeholder: |
        1: OPENING | -
        2: Fun!Fun!Fun! ～夢∞～
        3: キミすき
        4: ichigo 〜一期一会〜 | medley
        5: Gimme 143 | encore

  - type: checkboxes
    id: clear
    attributes:
      label: "値の削除（更新時）"
      options:
        - label: "artist"
        - label: "title"
        - label: "link"
        - label: "lyrics"
        - label: "videos"
        - label: "member"
        - label: "venue"
        - label: "source"
        - label: "songs"

  - type: checkboxes
    id: delete
    attributes:
      label: "DELETE"
      options:
        - label: "削除する"
