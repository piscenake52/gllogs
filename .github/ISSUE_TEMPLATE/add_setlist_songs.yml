name: "setlist / songs 追加・更新"
description: "セットリストと楽曲リストを追加・更新します"
title: "[DATA] setlist / songs"
body:
  - type: input
    id: setlistid
    attributes:
      label: "setlistid"

  - type: checkboxes
    id: artist_check
    attributes:
      label: "artist / 選択"
      options:
        - label: "Girls²"
        - label: "Laki"

  - type: input
    id: artist_free
    attributes:
      label: "artist / 自由入力"

  - type: input
    id: title
    attributes:
      label: "title"

  - type: input
    id: link
    attributes:
      label: "link"

  - type: dropdown
    id: member_g2
    attributes:
      label: "member / Girls²"
      multiple: true
      options:
        - YZH
        - MMK
        - MSK
        - YOK
        - KUR
        - MNM
        - KIR
        - TOA
        - RAN

  - type: dropdown
    id: member_l2
    attributes:
      label: "member / Laki"
      multiple: true
      options:
        - RIN
        - TBK
        - HIR
        - YUW
        - KAN
        - RRK
        - AKR
        - KIK
        - YUR

  - type: input
    id: venue
    attributes:
      label: "venue"

  - type: textarea
    id: songs
    attributes:
      label: "曲目 (songs / setlist用 - 1行1曲)"
      description: |
        書式: `[順番:] 曲名 | type | original | notes`
        順番を省略すると前の曲+1。typeを省略すると song（allow / encore / medley も可、空にしたいときは - ）。
        入力すると曲目全体が**置き換わります**（空欄なら既存の曲目を維持）。
      placeholder: |
        1: OPENING | -
        2: Fun!Fun!Fun! ～夢∞～
        3: キミすき
        4: ichigo 〜一期一会〜 | medley
        5: Gimme 143 | encore

  - type: markdown
    attributes:
      value: |
        **種別**: setlistid を入力 → setlist として登録します。空欄 → songs（楽曲リスト）として登録します。
        **更新のとき**: 識別キー（setlist=setlistid / songs=artist+title）を入力し、変更したい項目だけ入力します。空欄・未選択の項目は既存の値のままです。消したい項目は `!clear` と入力します（artist の選択・member の選択は消せません）。
        **setlistid**: 12桁（日付+開演時刻。例: 202609221830）。
        **artist**: Girls² / Laki は選択で入力します（両方選ぶと「Girls² × Laki」）。それ以外は自由入力に入力します（自由入力があればそちらを優先）。setlist の新規追加では artist と title が必須、songs は artist+title が識別キーです。
        **member**: setlist 用です。新規追加で Girls² / Laki を選び、member が未選択なら、そのグループの全メンバー（TOA・RAN・YURを除く）を自動設定します（両方選択なら両グループ分）。更新時に未選択なら既存値を維持します。
        **link**: songs 用です。 **venue / 曲目**: setlist 用です。
