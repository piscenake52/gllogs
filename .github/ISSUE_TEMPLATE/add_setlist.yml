name: "setlist"
description: "insert / update / delete"
title: "[DATA] setlist"
body:
  - type: markdown
    attributes:
      value: |
        📅 [日付・開演時刻をカレンダーで選ぶ（setlistid）](https://gl-log.blogspot.com/p/issuehelper.html#setlist) — 選んだ値が入力済みのフォームが開きます。このフォームの入力欄は、そのまま自由入力もできます。

  - type: input
    id: setlistid
    attributes:
      label: "setlistid"
      description: "コピーして新規登録するときは、ここに新しい setlistid（日付+開演時刻 12桁）を入力"

  - type: input
    id: copy_from
    attributes:
      label: "COPY / コピー元 setlistid"
      description: "コピーして新規登録するときだけ、コピー元の setlistid を入力。入力した項目だけ上書きし、空の項目（曲目・member など）はコピー元を引き継ぎます。上の setlistid がすでに存在するときはコピーしません"


  - type: checkboxes
    id: artist_check
    attributes:
      label: "artist / 選択"
      options:
        - label: "Girls²"
        - label: "Laki"


  - type: input
    id: artist_free
    attributes:
      label: "artist / 自由入力"


  - type: textarea
    id: item_title
    attributes:
      label: "title"
      description: "改行を入れると、サイト側でもそのまま改行表示されます"


  - type: dropdown
    id: member_g2
    attributes:
      label: "member / Girls²"
      multiple: true
      options:
        - G2
        - YZH
        - MMK
        - MSK
        - YOK
        - KUR
        - MNM
        - KIR
        - TOA
        - RAN


  - type: dropdown
    id: member_l2
    attributes:
      label: "member / Laki"
      multiple: true
      options:
        - L2
        - RIN
        - TBK
        - HIR
        - YUW
        - KAN
        - RRK
        - AKR
        - KIK
        - YUR


  - type: input
    id: member_free
    attributes:
      label: "member / 自由入力"
      description: "G2,YZH,MMK,MSK,YOK,KUR,MNM,KIR,TOA,RAN / L2,RIN,TBK,HIR,YUW,KAN,RRK,AKR,KIK,YUR"


  - type: input
    id: venue
    attributes:
      label: "venue"


  - type: input
    id: source
    attributes:
      label: "source"
      description: "OFFICIAL（公式の情報）/ UNOFFICIAL（ファンメイド）。分からない場合は空のまま（空は変更なし・不明）。消すときは !clear か、下の「値の削除」で source"


  - type: textarea
    id: songs
    attributes:
      label: "曲目 (1行1曲)"
      description: |
        書式: `[順番:] 曲名 | type | original | notes`
        順番を省略すると前の曲+1。typeを省略すると song（arrange / medley / mc / dt / dj / towel / encore / allow / cover も可、複数はカンマ区切り 例: allow,medley、空にしたいときは - ）。
        その曲を歌うメンバーは曲名の直後に `{YZH,MMK}` と書きます（指定した曲だけ、曲名の下にハートが出ます。省略すると全員扱い）。
        入力すると曲目全体が**置き換わります**（空欄なら既存の曲目を維持）。
      placeholder: |
        1: OPENING | -
        2: Fun!Fun!Fun! ～夢∞～
        3: キミすき
        4: ichigo 〜一期一会〜 | medley
        5: Gimme 143 | encore


  - type: textarea
    id: songs_patch
    attributes:
      label: "曲目の個別変更 (1行1操作)"
      description: |
        既存の曲目を一部だけ変更します（上の「曲目」は空のままにしてください）。書いた順に適用されます。
        `N: 曲名 {YZH,MMK} | type | original | notes` … N番の曲を更新（空欄・省略した項目は今のまま、`-` は空にする。メンバーは `{YZH,MMK}`、指定を消すときは `{-}`）
        `+N: 曲名 | type` … N番に曲を挿入（N番以降は1つ後ろへ。typeを省略すると song）
        `-N: 曲名` … N番の曲を削除（N番以降は1つ前へ。曲名を書くと一致したときだけ削除）
        `N>M: 曲名` … N番の曲をM番へ移動（間の曲は1つずつずれる。曲名を書くと一致したときだけ移動）
      placeholder: |
        3: キミすき | allow
        +5: 新しい曲
        -8: 消す曲


  - type: checkboxes
    id: clear
    attributes:
      label: "値の削除（更新時）"
      options:
        - label: "artist"
        - label: "title"
        - label: "member"
        - label: "venue"
        - label: "source"
        - label: "songs"


  - type: checkboxes
    id: delete
    attributes:
      label: "DELETE"
      options:
        - label: "削除する"
