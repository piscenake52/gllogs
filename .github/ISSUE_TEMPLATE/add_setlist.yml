name: "setlist"
description: "insert / update / delete"
title: "[DATA] setlist"
body:
  - type: markdown
    attributes:
      value: |
        📅 [カレンダーで日付・開演時刻を選ぶ](https://gl-log.blogspot.com/p/issuehelper.html#setlist) — 選んだ値が入力済みで開きます。直接入力もできます。

  - type: input
    id: setlistid
    attributes:
      label: "setlistid"
      description: "コピーして新規登録するとき: 新しい setlistid（12桁）"

  - type: input
    id: copy_from
    attributes:
      label: "COPY / コピー元 setlistid"
      description: "コピー元の setlistid（コピー新規登録のみ）。入力した項目だけ上書きし、空の項目はコピー元を引き継ぎます。上の setlistid が既存ならコピーしません"


  - type: checkboxes
    id: artist_check
    attributes:
      label: "artist / 選択"
      options:
        - label: "Girls²"
        - label: "Laki"


  - type: input
    id: artist_free
    attributes:
      label: "artist / 自由入力"


  - type: textarea
    id: item_title
    attributes:
      label: "title"
      description: "改行はそのまま表示されます"


  - type: dropdown
    id: member_g2
    attributes:
      label: "member / Girls²"
      multiple: true
      options:
        - G2
        - YZH
        - MMK
        - MSK
        - YOK
        - KUR
        - MNM
        - KIR
        - TOA
        - RAN


  - type: dropdown
    id: member_l2
    attributes:
      label: "member / Laki"
      multiple: true
      options:
        - L2
        - RIN
        - TBK
        - HIR
        - YUW
        - KAN
        - RRK
        - AKR
        - KIK
        - YUR


  - type: input
    id: member_free
    attributes:
      label: "member / 自由入力"
      description: "G2,YZH,MMK,MSK,YOK,KUR,MNM,KIR,TOA,RAN / L2,RIN,TBK,HIR,YUW,KAN,RRK,AKR,KIK,YUR"


  - type: input
    id: venue
    attributes:
      label: "venue"


  - type: input
    id: weather
    attributes:
      label: "weather"
      description: "sunny / cloudy / rain / snow / thunder / partly（カンマ区切り、選んだ順。例: sunny,rain）。消すときは !clear か「値の削除」"


  - type: input
    id: source
    attributes:
      label: "source"
      description: "OFFICIAL（公式）/ UNOFFICIAL（ファンメイド）。不明なら空のまま（変更なし）。消すときは !clear か「値の削除」"


  - type: textarea
    id: songs
    attributes:
      label: "曲目 (1行1曲)"
      description: |
        書式: `[順番:] 曲名 {メンバー} | type | original | notes`
        ・順番を省略すると前の曲+1。順番が不明な曲は `-:`
        ・type は省略すると song。複数はカンマ区切り（例: allow,medley）、空にするときは `-`
        ・type: arrange / medley / short / mc / dt / dj / towel / encore / allow / cover
        ・歌唱メンバーは `{YZH,MMK}`（省略は全員）
        入力すると曲目全体が**置き換わります**（空欄なら維持）。
      placeholder: |
        1: OPENING | -
        2: Fun!Fun!Fun! ～夢∞～
        3: キミすき
        4: ichigo 〜一期一会〜 | medley
        5: Gimme 143 | encore


  - type: textarea
    id: songs_patch
    attributes:
      label: "曲目の個別変更 (1行1操作)"
      description: |
        曲目の一部だけ変更します（上の「曲目」は空のまま）。書いた順に適用。
        `N: 曲名 {YZH,MMK} | type | original | notes` … N番を更新（空欄は今のまま、`-` は空にする、`{-}` はメンバー指定を消す）
        `+N: 曲名 | type` … N番に挿入（以降は1つ後ろへ）
        `-N: 曲名` … N番を削除（以降は1つ前へ。曲名があれば一致時のみ）
        `N>M: 曲名` … N番をM番へ移動（曲名があれば一致時のみ）
        `+?: 曲名` / `-?: 曲名` … 順番なしの曲を追加 / 削除
      placeholder: |
        3: キミすき | allow
        +5: 新しい曲
        -8: 消す曲


  - type: checkboxes
    id: clear
    attributes:
      label: "値の削除（更新時）"
      options:
        - label: "artist"
        - label: "title"
        - label: "member"
        - label: "venue"
        - label: "weather"
        - label: "source"
        - label: "songs"


  - type: checkboxes
    id: delete
    attributes:
      label: "DELETE"
      options:
        - label: "削除する"
