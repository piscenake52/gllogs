name: "logs bulk"
description: "tag / contents / title bulk change (logs only, up to 100 rows)"
title: "[DATA] logs bulk"
body:
  - type: markdown
    attributes:
      value: |
        helper の bulk タブから開いてください。入力済みの内容をそのまま送信します。

  - type: textarea
    id: bulk_ids
    attributes:
      label: "bulk ids"
      description: "logid (12 characters), one per line. Up to 100."

  - type: input
    id: bulk_op
    attributes:
      label: "bulk op"
      description: "replace / add / remove / contents / title"

  - type: input
    id: bulk_from
    attributes:
      label: "bulk from"
      description: "replace: the old tag / remove: the tag to remove / title: the text to replace"

  - type: input
    id: bulk_to
    attributes:
      label: "bulk to"
      description: "replace: the new tag / add: the tag to add / contents: the new contents / title: the new text (empty = delete the text)"

  - type: input
    id: bulk_target
    attributes:
      label: "bulk target"
      description: "tags / sns / both (where the tag is: the tags of the row, the tags of each sns link, or both). Empty = tags"
