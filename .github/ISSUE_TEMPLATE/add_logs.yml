name: "logs"
description: "insert / update / delete"
title: "[DATA] logs"
body:
  - type: input
    id: logid
    attributes:
      label: "logid"

  - type: input
    id: date
    attributes:
      label: "date"
      
  - type: input
    id: time
    attributes:
      label: "time"

  - type: dropdown
    id: contents
    attributes:
      label: "contents"
      options:
        - ANNIVERSARY
        - BIRTHDAY
        - DEBUT
        - FORMATION
        - CL
        - COLUMN
        - COOKING
        - DIARY
        - ETC
        - CAMPAIGN
        - CLOSE
        - MESSAGE
        - PLAYING
        - RESULT
        - EVENT
        - FANMEETING
        - RELEASEEVENT
        - FANCLUB
        - GLRADIO
        - GTUBE
        - LIVE
        - MAGAZINE
        - MEDIA
        - BOOK
        - NEWSPAPER
        - MODEL
        - MOVIE
        - RADIO
        - RELEASE
        - BD
        - CD
        - DIGITAL
        - DVD
        - MUSICCARD
        - SALES
        - GOODS
        - SNS
        - STAGE
        - STREAMING
        - TICKET
        - TV
        - WEB
        - PODCAST
        - YOUTUBE

  - type: dropdown
    id: groups_g2
    attributes:
      label: "groups / Girls²"
      multiple: true
      options:
        - G2
        - YZH
        - MMK
        - MSK
        - YOK
        - KUR
        - MNM
        - KIR
        - TOA
        - RAN

  - type: dropdown
    id: groups_l2
    attributes:
      label: "groups / Laki"
      multiple: true
      options:
        - L2
        - RIN
        - TBK
        - HIR
        - YUW
        - KAN
        - RRK
        - AKR
        - KIK
        - YUR

  - type: input
    id: groups_free
    attributes:
      label: "groups / 自由入力"
      description: "カンマ区切り（例: G2, YZH）。上のプルダウンが未選択のときだけ使われ、入力した値がそのまま登録されます。"

  - type: checkboxes
    id: stf
    attributes:
      label: "STF"
      options:
        - label: "STF"

  - type: input
    id: title
    attributes:
      label: "title"

  - type: input
    id: display_pc
    attributes:
      label: "display_pc"

  - type: input
    id: display_sp
    attributes:
      label: "display_sp"

  - type: input
    id: url
    attributes:
      label: "url"

  - type: input
    id: map
    attributes:
      label: "map"

  - type: input
    id: setlistid
    attributes:
      label: "setlistid"

  - type: dropdown
    id: relations_g2
    attributes:
      label: "relations / Girls²"
      multiple: true
      options:
        - YZH
        - MMK
        - MSK
        - YOK
        - KUR
        - MNM
        - KIR
        - TOA
        - RAN

  - type: dropdown
    id: relations_l2
    attributes:
      label: "relations / Laki"
      multiple: true
      options:
        - RIN
        - TBK
        - HIR
        - YUW
        - KAN
        - RRK
        - AKR
        - KIK
        - YUR

  - type: input
    id: tags
    attributes:
      label: "tags"

  - type: checkboxes
    id: clear
    attributes:
      label: "値の削除（更新時）"
      description: "チェックした項目の既存の値を消します（入力欄に値があってもチェックが優先されます）。"
      options:
        - label: "time"
        - label: "contents"
        - label: "title"
        - label: "display_pc"
        - label: "display_sp"
        - label: "url"
        - label: "map"
        - label: "groups"
        - label: "relations"
        - label: "setlistid"
        - label: "tags"

  - type: checkboxes
    id: delete
    attributes:
      label: "削除"
      options:
        - label: "削除する"

  - type: markdown
    attributes:
      value: |
        **削除のとき**: 一番上の logid を入力し、一番下の「削除」にチェックします（他の項目は無視されます。logid が見つからなければIssueにコメントが付きます）。
        **更新のとき**: 一番上の logid を入力し、変更したい項目だけ入力します。空欄・未選択の項目は既存の値のままです。消したい項目は「値の削除（更新時）」にチェックします（グループ・関連もここで消せます。入力欄に `!clear` と入力しても消せます）。
        **新規のとき**: 日付だけ必須です。種別が未選択なら ETC、時間は空欄ならそのまま空欄で登録されます、グループが未選択（自由入力も空）ならG2とL2になります。
        **数字**: 全角で入力しても半角に直します。日付は8桁、時間は4桁、セットリストIDは12桁です（違うと処理されず、Issueにコメントが付きます）。
        **グループ**: G2だけ、またはL2だけを選ぶと、メンバー（G2: YZH〜KIR、L2: RIN〜KIK）を自動で追加します（G2とL2をそれぞれ単独で選べば両方追加されます）。メンバーも個別に選んだときは、選んだものだけになります。
        **groups の自由入力**: プルダウンが優先です。プルダウンが両方とも未選択のときだけ自由入力を使い、G2/L2のメンバー自動展開はせず、入力した値をそのまま登録します（`!clear` で消せます）。
        **STF**: チェックすると、グループ選択（G2/L2）があってもメンバーへの自動展開は行われず、選んだ内容（通常はG2またはL2のみ）に "STF" を加えた状態で登録されます。
        **relations**: 関連するメンバーを選択します（グループ全体を表すG2/L2という選択肢はありません）。
