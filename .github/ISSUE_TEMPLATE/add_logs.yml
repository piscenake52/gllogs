name: "logs 追加・更新"
description: "ログ（DIARY, LIVE, EVENT など）を追加・更新します"
title: "[DATA] logs"
body:
  - type: input
    id: logid
    attributes:
      label: "ログID (logid)"
      placeholder: "a1b2c3d4e5f6（更新のときだけ入力。新規は空欄）"

  - type: input
    id: date
    attributes:
      label: "日付 (date)"
      placeholder: "20260928（8桁・半角。新規追加では必須）"

  - type: input
    id: time
    attributes:
      label: "時間 (time)"
      placeholder: "1200（4桁・半角。新規で空欄なら 0000）"

  - type: dropdown
    id: contents
    attributes:
      label: "コンテンツ種別 (contents)"
      options:
        - DIARY
        - GTUBE
        - GLRADIO
        - COLUMN
        - CL
        - CLOSE
        - YOUTUBE
        - ANNIVERSARY
        - FANCLUB
        - SNS
        - TICKET
        - EVENT
        - CD
        - WEB
        - RESULT
        - LIVE
        - RADIO
        - BIRTHDAY
        - RELEASEEVENT
        - TV
        - COOKING
        - STREAMING
        - DIGITAL
        - STAGE
        - GOODS
        - MOVIE
        - CAMPAIGN
        - MODEL
        - ETC
        - MAGAZINE
        - DEBUT
        - FORMATION
        - MESSAGE
        - PLAYING
        - MUSICCARD

  - type: input
    id: title
    attributes:
      label: "タイトル (title)"
      placeholder: "イベント名や記事タイトル"

  - type: input
    id: display_pc
    attributes:
      label: "display_pc"
      placeholder: "なし"

  - type: input
    id: display_sp
    attributes:
      label: "display_sp"
      placeholder: "なし"

  - type: input
    id: url
    attributes:
      label: "URL (url)"
      placeholder: "https://..."

  - type: input
    id: map
    attributes:
      label: "マップ情報 (map)"
      placeholder: "なし"

  - type: input
    id: setlistid
    attributes:
      label: "セットリストID (setlistid)"
      placeholder: "202609221830（12桁・半角。関連するセットリストがあれば）"

  - type: dropdown
    id: groups_g2
    attributes:
      label: "グループ/メンバー Girls² (groups)"
      description: "G2だけ／L2だけを選ぶと、メンバーを自動で追加します。Girls²・Lakiとも未選択なら、新規は全員になります。"
      multiple: true
      options:
        - G2
        - YZH
        - MMK
        - MSK
        - YOK
        - KUR
        - MNM
        - KIR
        - TOA
        - RAN

  - type: dropdown
    id: groups_l2
    attributes:
      label: "グループ/メンバー Laki (groups)"
      multiple: true
      options:
        - L2
        - RIN
        - TBK
        - HIR
        - YUW
        - KAN
        - RRK
        - AKR
        - KIK
        - YUR

  - type: input
    id: relations
    attributes:
      label: "関連情報 (relations - JSON配列またはカンマ区切り)"
      placeholder: "TOA, KUR"

  - type: input
    id: tags
    attributes:
      label: "タグ (tags - カンマ区切り)"
      placeholder: "tag1, tag2, tag3"

  - type: markdown
    attributes:
      value: |
        **更新のとき**: 一番上の logid を入力し、変更したい項目だけ入力します。空欄・未選択の項目は既存の値のままです。消したい項目は `!clear` と入力します（グループ/メンバーの選択は消せません）。
        **新規のとき**: 日付だけ必須です。種別が未選択なら ETC、時間が空欄なら 0000、グループが未選択なら全員になります。
        **数字**: 全角で入力しても半角に直します。日付は8桁、時間は4桁、セットリストIDは12桁です（違うと処理されず、Issueにコメントが付きます）。
        **グループ**: G2だけ、またはL2だけを選ぶと、メンバー（G2: YZH〜KIR、L2: RIN〜KIK）を自動で追加します。メンバーも個別に選んだときは、選んだものだけになります。
