name: "logs 追加・更新"
description: "ログ（DIARY, LIVE, EVENT など）を追加・更新します"
title: "[DATA] logs"
body:
  - type: input
    id: logid
    attributes:
      label: "logid"

  - type: input
    id: date
    attributes:
      label: "date"
      
  - type: input
    id: time
    attributes:
      label: "time"

  - type: dropdown
    id: contents
    attributes:
      label: "contents"
      options:
        - DIARY
        - GTUBE
        - GLRADIO
        - COLUMN
        - CL
        - CLOSE
        - YOUTUBE
        - ANNIVERSARY
        - FANCLUB
        - SNS
        - TICKET
        - EVENT
        - CD
        - WEB
        - RESULT
        - LIVE
        - RADIO
        - BIRTHDAY
        - RELEASEEVENT
        - TV
        - COOKING
        - STREAMING
        - DIGITAL
        - STAGE
        - GOODS
        - MOVIE
        - CAMPAIGN
        - MODEL
        - ETC
        - MAGAZINE
        - DEBUT
        - FORMATION
        - MESSAGE
        - PLAYING
        - MUSICCARD

  - type: input
    id: title
    attributes:
      label: "title"

  - type: input
    id: display_pc
    attributes:
      label: "display_pc"

  - type: input
    id: display_sp
    attributes:
      label: "display_sp"

  - type: input
    id: url
    attributes:
      label: "url"

  - type: input
    id: map
    attributes:
      label: "map"

  - type: input
    id: setlistid
    attributes:
      label: "setlistid"

  - type: dropdown
    id: groups_g2
    attributes:
      label: "groups / Girls²"
      multiple: true
      options:
        - G2
        - YZH
        - MMK
        - MSK
        - YOK
        - KUR
        - MNM
        - KIR
        - TOA
        - RAN

  - type: dropdown
    id: groups_l2
    attributes:
      label: "groups / Laki"
      multiple: true
      options:
        - L2
        - RIN
        - TBK
        - HIR
        - YUW
        - KAN
        - RRK
        - AKR
        - KIK
        - YUR

  - type: checkboxes
    id: stf
    attributes:
      label: "STF"
      options:
        - label: "STF"

  - type: input
    id: relations
    attributes:
      label: "relations"

  - type: input
    id: tags
    attributes:
      label: "tags"

  - type: markdown
    attributes:
      value: |
        **更新のとき**: 一番上の logid を入力し、変更したい項目だけ入力します。空欄・未選択の項目は既存の値のままです。消したい項目は `!clear` と入力します（グループ/メンバーの選択は消せません）。
        **新規のとき**: 日付だけ必須です。種別が未選択なら ETC、時間が空欄なら 0000、グループが未選択なら全員になります。
        **数字**: 全角で入力しても半角に直します。日付は8桁、時間は4桁、セットリストIDは12桁です（違うと処理されず、Issueにコメントが付きます）。
        **グループ**: G2だけ、またはL2だけを選ぶと、メンバー（G2: YZH〜KIR、L2: RIN〜KIK）を自動で追加します（G2とL2をそれぞれ単独で選べば両方追加されます）。メンバーも個別に選んだときは、選んだものだけになります。
        **STF**: チェックすると、グループ選択（G2/L2）があってもメンバーへの自動展開は行われず、選んだ内容（通常はG2またはL2のみ）に "STF" を加えた状態で登録されます。
