name: "logs"
description: "insert / update / delete"
title: "[DATA] logs"
body:
  - type: input
    id: logid
    attributes:
      label: "logid"

  - type: input
    id: date
    attributes:
      label: "date"
      
  - type: input
    id: time
    attributes:
      label: "time"

  - type: dropdown
    id: contents
    attributes:
      label: "contents"
      options:
        - ANNIVERSARY
        - BIRTHDAY
        - DEBUT
        - FORMATION
        - CL
        - COLUMN
        - COOKING
        - DIARY
        - ETC
        - CAMPAIGN
        - CLOSE
        - MESSAGE
        - PLAYING
        - RESULT
        - EVENT
        - FANMEETING
        - RELEASEEVENT
        - FANCLUB
        - GLRADIO
        - GTUBE
        - LIVE
        - MAGAZINE
        - MEDIA
        - BOOK
        - NEWSPAPER
        - MODEL
        - MOVIE
        - RADIO
        - RELEASE
        - BD
        - CD
        - DIGITAL
        - DVD
        - MUSICCARD
        - SALES
        - GOODS
        - SNS
        - STAGE
        - STREAMING
        - TICKET
        - TV
        - WEB
        - PODCAST
        - YOUTUBE

  - type: dropdown
    id: groups_g2
    attributes:
      label: "groups / Girls²"
      multiple: true
      options:
        - G2
        - YZH
        - MMK
        - MSK
        - YOK
        - KUR
        - MNM
        - KIR
        - TOA
        - RAN

  - type: dropdown
    id: groups_l2
    attributes:
      label: "groups / Laki"
      multiple: true
      options:
        - L2
        - RIN
        - TBK
        - HIR
        - YUW
        - KAN
        - RRK
        - AKR
        - KIK
        - YUR

  - type: input
    id: groups_free
    attributes:
      label: "groups / 自由入力"
      description: "G2,YZH,MMK,MSK,YOK,KUR,MNM,KIR,TOA,RAN / L2,RIN,TBK,HIR,YUW,KAN,RRK,AKR,KIK,YUR"

  - type: checkboxes
    id: stf
    attributes:
      label: "STF"
      options:
        - label: "STF"

  - type: input
    id: title
    attributes:
      label: "title"

  - type: input
    id: display_pc
    attributes:
      label: "display_pc"

  - type: input
    id: display_sp
    attributes:
      label: "display_sp"

  - type: input
    id: url
    attributes:
      label: "url"

  - type: input
    id: map
    attributes:
      label: "map"

  - type: input
    id: setlistid
    attributes:
      label: "setlistid"
      description: "LIVEで未入力の場合は date+time を自動登録"

  - type: dropdown
    id: relations_g2
    attributes:
      label: "relations / Girls²"
      multiple: true
      options:
        - YZH
        - MMK
        - MSK
        - YOK
        - KUR
        - MNM
        - KIR
        - TOA
        - RAN

  - type: dropdown
    id: relations_l2
    attributes:
      label: "relations / Laki"
      multiple: true
      options:
        - RIN
        - TBK
        - HIR
        - YUW
        - KAN
        - RRK
        - AKR
        - KIK
        - YUR

  - type: input
    id: tags
    attributes:
      label: "tags"
      description: "更新時は既存の値に追記"

  - type: checkboxes
    id: clear
    attributes:
      label: "値の削除（更新時）"
      description: "チェックした項目の既存の値を削除"
      options:
        - label: "time"
        - label: "contents"
        - label: "title"
        - label: "display_pc"
        - label: "display_sp"
        - label: "url"
        - label: "map"
        - label: "groups"
        - label: "relations"
        - label: "setlistid"
        - label: "tags"

  - type: checkboxes
    id: delete
    attributes:
      label: "削除"
      options:
        - label: "削除する"
