name: Update manifest

# データファイル(data/ 以下)を手で直接編集して push したときに、viewer用のマニフェスト(data/manifest.json)を作り直す。
# Issue経由の更新・インデックスの作り直しは merge_json.py が自分でマニフェストを更新するので、このワークフローは動かない
# (Actionsのbotが push したコミットでは、このワークフローは起動しない)。
on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - '!data/manifest.json'
      - '!data/*/queue/**'
      - '!data/inbox/**'

# データ更新のワークフローと同時に動いてコミットが衝突しないよう、同じグループで直列に実行する
concurrency:
  group: gllogs-data-merge
  cancel-in-progress: false

jobs:
  manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Rebuild manifest
        run: python scripts/merge_json.py --rebuild-manifest

      - name: Commit and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/manifest.json
          git diff --staged --quiet || (git commit -m "Update manifest" && git pull --rebase && git push)
