name: Issue to JSON & Auto Merge

on:
  issues:
    types: [opened, edited]

jobs:
  process-issue:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run convert script (Issue to Queue)
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python scripts/issue_to_json.py

      - name: Run merge script (Queue to Main & Processed)
        run: python scripts/merge_json.py

      - name: Commit and push all changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Process issue, merge JSON, and update processed" && git push)
