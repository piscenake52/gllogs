name: Issue to JSON Queue (Detailed)

on:
  issues:
    types: [opened, edited]

jobs:
  convert-issue:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run convert script
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python scripts/issue_to_json.py

      - name: Commit and push generated JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Add detailed JSON fragment from Issue form" && git push)
