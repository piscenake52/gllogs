name: process queue
on:
  push:
    branches: [main]
    paths: ['data/*/queue/*.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-queue
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: apply queue
        run: |
          python3 - <<'PY'
          import json, glob, os, re, shutil, hashlib, unicodedata
          KINDS = ['logs', 'songs', 'setlist', 'videos']
          REQ = {'logs': ['date', 'cat', 'title'], 'songs': ['title'], 'setlist': ['id', 'title'], 'videos': ['title', 'url']}
          PFX = {'songs': 's', 'videos': 'v'}   # songs / videos の id は s00001 / v00001 の連番(取り込み側で付ける)
          def nt(s): return unicodedata.normalize('NFKC', str(s or '')).strip()
          def load(kind):
              p = f'data/{kind}/{kind}.json'
              return json.load(open(p, encoding='utf-8')) if os.path.exists(p) else []
          D = {k: load(k) for k in KINDS}
          def seq(kind):
              top = 0
              for o in D[kind]:
                  m = re.fullmatch(PFX[kind] + r'(\d+)', str(o.get('id') or ''))
                  if m: top = max(top, int(m.group(1)))
              return f'{PFX[kind]}{top + 1:05d}'
          def find(kind, item):   # 同じレコードの位置(なければ None)
              arr = D[kind]
              if item.get('id'): return next((i for i, o in enumerate(arr) if o.get('id') == item['id']), None)
              if kind == 'songs': return next((i for i, o in enumerate(arr) if nt(o.get('title')) == nt(item['title'])), None)
              if kind == 'videos': return next((i for i, o in enumerate(arr) if nt(o.get('url')) == nt(item['url'])), None)
              return None
          def song_rec(title):   # 曲名から songs の1件(なければ作る)
              k = nt(title)
              r = next((s for s in D['songs'] if nt(s.get('title')) == k), None)
              if r is None:
                  r = {'id': seq('songs'), 'title': k}; D['songs'].append(r)
              return r
          def add_release(rec, rel):   # 作品名が同じなら足さない。1件ならオブジェクト、2件以上は配列
              cur = rec.get('release'); lst = [] if not cur else (cur if isinstance(cur, list) else [cur])
              if not any(nt(x.get('name')) == nt(rel['name']) for x in lst): lst.append(rel)
              rec['release'] = lst[0] if len(lst) == 1 else lst
          def fan_out(item):   # logs の入力から、setlist / songs / videos も登録する
              live, rel, vid = item.pop('_live', None), item.pop('_release', None), item.pop('_video', None)
              if live:
                  sid = item.get('live') or ((item['date'] + item['time']) if re.fullmatch(r'\d{8}', item['date']) and re.fullmatch(r'\d{4}', item.get('time') or '') else '')
                  assert re.fullmatch(r'\d{12}', sid)
                  new = {'id': sid, 'title': item['title']}
                  if item.get('members'): new['members'] = item['members']
                  new.update({k: v for k, v in live.items() if v not in (None, '', [])})
                  if item.get('cat') in ('live', 'tour', 'event'): new['cat'] = item['cat']   # 大分類は logs の cat が決める。kind(区分)は入力された値を使う
                  cur = next((e for e in D['setlist'] if e.get('id') == sid), None)
                  if cur is not None: cur.update(new)
                  else: D['setlist'].append(new)
                  item['live'] = sid
              if rel:
                  assert rel.get('name') and rel.get('type') in ('album', 'single')
                  for ti in rel.get('songs') or []:
                      r = song_rec(ti)
                      if item['date'] and not r.get('date'): r['date'] = item['date']
                      add_release(r, {'name': rel['name'], 'type': rel['type']})
              if vid:
                  assert item.get('url')
                  rec = {'title': item['title'], 'url': item['url']}
                  if vid.get('label'): rec['label'] = vid['label']
                  if vid.get('song'): rec['song'] = vid['song']
                  i = find('videos', rec)
                  if i is not None: D['videos'][i].update(rec)
                  else: D['videos'].append({'id': seq('videos'), **rec})
          changed = False
          for kind in KINDS:
              for f in sorted(glob.glob(f'data/{kind}/queue/*.json')):
                  try:
                      item = json.load(open(f, encoding='utf-8'))['item']
                      assert isinstance(item, dict) and all(item.get(r) for r in REQ[kind] if r != 'id' or kind == 'setlist')
                      if kind == 'logs':
                          if not item.get('id'):
                              item['id'] = 'L' + hashlib.sha1('|'.join(str(item.get(k) or '') for k in ('date', 'time', 'cat', 'title', 'url')).encode('utf-8')).hexdigest()[:10]
                          fan_out(item)
                      arr = D[kind]; i = find(kind, item)
                      if i is not None:
                          if kind in PFX: item = {'id': arr[i]['id'], **{k: v for k, v in item.items() if k != 'id'}}
                          arr[i] = item                            # 同じレコードは上書き(更新)
                      else:
                          if kind in PFX and not item.get('id'): item = {'id': seq(kind), **item}
                          arr.append(item)
                      dst = 'processed'; changed = True
                  except Exception:
                      dst = 'failed'                               # 構造不正は failed へ退避(再送しても同じなので止める)
                  os.makedirs(f'data/{kind}/{dst}', exist_ok=True)
                  shutil.move(f, f'data/{kind}/{dst}/' + os.path.basename(f))
          if changed:   # setlist の曲名・videos の曲名を songs の id にそろえる(songs に無い曲名は、曲名だけの songs を作る)
              for e in D['setlist']:
                  for x in (e.get('songs') or []):
                      if isinstance(x, dict) and not x.get('song') and x.get('title'):
                          x['song'] = song_rec(x['title'])['id']; x.pop('title', None)
              ids = {s.get('id') for s in D['songs']}
              for v in D['videos']:
                  s = v.get('song')
                  if s and s not in ids and not re.fullmatch(r's\d{5}', str(s)): v['song'] = song_rec(s)['id']
              for k in KINDS:
                  os.makedirs(f'data/{k}', exist_ok=True)
                  json.dump(D[k], open(f'data/{k}/{k}.json', 'w', encoding='utf-8'), ensure_ascii=False, separators=(',', ':'))
          PY
      - name: commit data, then version.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet || git commit -m "data: apply queue [skip ci]"
          h() { if [ -f "$1" ]; then sha1sum "$1" | cut -d' ' -f1; fi; }
          printf '{"commit":"%s","files":{"logs":"%s","songs":"%s","setlist":"%s","videos":"%s"}}\n' \
            "$(git rev-parse HEAD)" "$(h data/logs/logs.json)" "$(h data/songs/songs.json)" "$(h data/setlist/setlist.json)" "$(h data/videos/videos.json)" > /tmp/version.json
          if [ ! -f version.json ] || [ "$(jq -S .files version.json)" != "$(jq -S .files /tmp/version.json)" ] || ! jq -e '.commit | test("^[0-9a-f]{40}$")' version.json >/dev/null; then
            cp /tmp/version.json version.json; git add version.json; git commit -m "chore: update version.json [skip ci]"
          fi
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push && exit 0; sleep $((i*3)); done
          exit 1
