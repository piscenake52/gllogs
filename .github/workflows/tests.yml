name: Tests

# スクリプト・フォーム・テスト・helper を変えたときに、自動テストと事前チェックを動かす。
# データ(data/)の更新では動かさない(キュー処理のコミットで毎回走らないように)
on:
  push:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/**'
      - 'helper.html'
      - 'index.html'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install pyyaml
      - name: Pre-check (JSON / forms / schema / workflows)
        run: python scripts/check_repo.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  viewer:
    # ビューア(index.html)をブラウザで実際に開いて確認する。通信はモック、日付は固定
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: pip install playwright
      - run: playwright install --with-deps chromium
      - run: npm install axe-core@4
      - name: Viewer tests
        run: python -m unittest tests.test_viewer -v

  helper:
    # helper(helper.html)をブラウザで実際に開いて確認する。通信はモック、日付は固定
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install playwright pyyaml
      - run: playwright install --with-deps chromium
      - name: Helper tests
        run: python -m unittest tests.test_helper -v
