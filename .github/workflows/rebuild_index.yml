name: Rebuild search index

# GitHubの Actions タブから手動で実行する（Run workflow ボタン）。
# data/logs/logs.json などから、helper用の軽量インデックス(logs_index.json / setlist_index.json)を作り直す。
on:
  workflow_dispatch:

# データ更新のワークフローと同時に動いてコミットが衝突しないよう、同じグループで直列に実行する
concurrency:
  group: gllogs-data-merge
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Rebuild index files
        run: python scripts/merge_json.py --rebuild-index

      - name: Commit and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Rebuild search index" && git push)
