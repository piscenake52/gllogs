name: Publish helper (GitHub Pages)

# helper を GitHub Pages で公開する(Blogger に貼らずに、push だけで反映する)。
# 公開するのは helper のページだけ。最初に Settings → Pages → Source を「GitHub Actions」にする
on:
  push:
    branches: [main]
    paths:
      - 'issue_helper_blogger.html'
      - 'tests/test_helper.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gllogs-pages
  cancel-in-progress: false

jobs:
  # 公開する前に helper のテストを通す。失敗したら公開しない(公開中のページはそのまま)
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install playwright pyyaml
      - run: playwright install --with-deps chromium
      - name: Pre-check
        run: python scripts/check_repo.py
      - name: Helper tests
        run: python -m unittest tests.test_helper -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # helper は Blogger に貼る部品なので、ページの外枠を付ける
      - name: Build the page
        run: |
          mkdir -p site
          {
            printf '%s\n' '<!doctype html>' '<html lang="ja">' '<head>' '<meta charset="utf-8">'
            printf '%s\n' '<meta name="viewport" content="width=device-width, initial-scale=1">'
            printf '%s\n' '<meta name="robots" content="noindex, nofollow">' '<title>GL log helper</title>'
            printf '%s\n' '<style>body{margin:0;padding:8px}</style>' '</head>' '<body>'
            cat issue_helper_blogger.html
            printf '%s\n' '</body>' '</html>'
          } > site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
