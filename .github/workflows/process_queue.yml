name: Process Queue

# data/*/queue/ にJSONをpushしたとき、または手動(Run workflow)で、キューを処理する
on:
  push:
    paths:
      - 'data/logs/queue/*.json'
      - 'data/setlist/queue/*.json'
      - 'data/songs/queue/*.json'
      - 'data/albums/queue/*.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gllogs-data-merge
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run merge script (Queue to Main & Processed)
        id: merge
        continue-on-error: true  # 読めないファイルがあっても、処理できた分は保存する
        run: python scripts/merge_json.py

      - name: Commit and push (with retry)
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git add data/
            if git diff --staged --quiet; then
              echo "コミットする変更はありません"
              exit 0
            fi
            git commit -m "Process queue, merge JSON"
            if git push; then
              echo "push 成功（${i}回目）"
              exit 0
            fi
            # 他の実行が先にpushした。rebaseはデータJSONが競合するため、最新に合わせ直してキューを再処理する
            echo "push に失敗しました（${i}回目）。最新を取得して処理をやり直します"
            sleep $((i * 5))
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            python scripts/merge_json.py || true
          done
          echo "::error::5回試しても push できませんでした。Run workflow で再実行してください"
          exit 1

      - name: Fail if some queue files could not be read
        if: steps.merge.outcome == 'failure'
        run: |
          echo "::error::読み込めないキューファイルがあります。上の「キュー処理の詳細」（Summary）を確認してください"
          exit 1
