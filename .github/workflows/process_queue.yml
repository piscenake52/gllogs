name: Process Queue

# 次のどれかで、キューを処理する
#  - data/*/queue/ にJSONをpush
#  - helper から直接送られた依頼 data/inbox/*.json をpush
#  - 手動(Run workflow)
on:
  push:
    paths:
      - 'data/logs/queue/*.json'
      - 'data/setlist/queue/*.json'
      - 'data/songs/queue/*.json'
      - 'data/albums/queue/*.json'
      - 'data/inbox/*.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gllogs-data-merge
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - run: pip install pyyaml

      - name: Process, commit and push (with retry)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          MERGE_STATUS=0
          run_all() {
            python scripts/inbox_to_json.py || true          # helperからの依頼 → キュー
            python scripts/merge_json.py || MERGE_STATUS=$?  # キュー → メインJSON（読めないファイルがあると 1）
            python scripts/inbox_to_json.py --finish || true # 依頼ごとの結果を書き足す
          }
          run_all
          for i in 1 2 3 4 5; do
            git add data/
            if git diff --staged --quiet; then
              echo "コミットする変更はありません"
              break
            fi
            git commit -m "Process queue, merge JSON"
            if git push; then
              echo "push 成功（${i}回目）"
              break
            fi
            # 他の実行が先にpushした。rebaseはデータJSONが競合するため、最新に合わせ直して再処理する
            echo "push に失敗しました（${i}回目）。最新を取得して処理をやり直します"
            sleep $((i * 5))
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            MERGE_STATUS=0
            run_all
            if [ "$i" = 5 ]; then
              echo "::error::5回試しても push できませんでした。Run workflow で再実行してください"
              exit 1
            fi
          done
          if [ "$MERGE_STATUS" != 0 ]; then
            echo "::error::読み込めないキューファイルがあります。Summary の「キュー処理の詳細」を確認してください"
            exit 1
          fi
