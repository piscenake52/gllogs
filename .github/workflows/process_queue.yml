name: Process Queue

# data/*/queue/ にJSONをpushしたとき、または手動(Run workflow)で、キューを処理する
on:
  push:
    paths:
      - 'data/logs/queue/*.json'
      - 'data/setlist/queue/*.json'
      - 'data/songs/queue/*.json'
      - 'data/albums/queue/*.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gllogs-data-merge
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run merge script (Queue to Main & Processed)
        id: merge
        continue-on-error: true  # 読めないファイルがあっても、処理できた分は保存する
        run: python scripts/merge_json.py

      - name: Commit and push (with retry)
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "コミットする変更はありません"
            exit 0
          fi
          git commit -m "Process queue, merge JSON"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push 成功（${i}回目）"
              exit 0
            fi
            echo "push に失敗しました（${i}回目）。最新を取り込んで再試行します"
            sleep $((i * 5))
            git pull --rebase origin "${GITHUB_REF_NAME}" || { git rebase --abort 2>/dev/null; echo "::error::rebase に失敗しました。競合の可能性があります"; exit 1; }
          done
          echo "::error::5回試しても push できませんでした。Actions の Run workflow で再実行してください"
          exit 1

      - name: Fail if some queue files could not be read
        if: steps.merge.outcome == 'failure'
        run: |
          echo "::error::読み込めないキューファイルがあります。上の「キュー処理の詳細」（Summary）を確認してください"
          exit 1
