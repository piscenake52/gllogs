name: Issue to JSON & Auto Merge

on:
  issues:
    types: [opened, edited]

# 同時に複数のIssueが処理されても、コミットが衝突しないよう直列に実行する
concurrency:
  group: gllogs-data-merge
  cancel-in-progress: false

jobs:
  process-issue:
    # data ラベル付き（または旧形式の [DATA] タイトル）のIssueのみ、かつリポジトリ関係者の投稿のみ処理する
    if: >-
      (contains(github.event.issue.labels.*.name, 'data') || startsWith(github.event.issue.title, '[DATA]')) &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run convert script (Issue to Queue)
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_CREATED_AT: ${{ github.event.issue.created_at }}
        run: python scripts/issue_to_json.py

      - name: Comment input errors on the issue
        # issue_to_json.py が入力エラーを見つけたときだけ、Issueにコメントする
        if: ${{ hashFiles('issue_error.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --body-file issue_error.md

      - name: Save queue files (for retry)
        run: |
          mkdir -p /tmp/qsnap
          for d in data/*/queue; do
            [ -d "$d" ] && mkdir -p "/tmp/qsnap/$d" && cp "$d"/*.json "/tmp/qsnap/$d/" 2>/dev/null || true
          done

      - name: Run merge script (Queue to Main & Processed)
        id: merge
        continue-on-error: true  # 読めないファイルがあっても、処理できた分は保存する
        run: python scripts/merge_json.py

      - name: Comment error details on the issue
        # 詳細なエラー原因（どのファイル・何件目・なぜ）をIssueにコメントする
        if: ${{ hashFiles('queue_report.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --body-file queue_report.md

      - name: Comment merge notices on the issue
        # 削除対象が見つからなかったときなど、merge_json.py が出した通知をIssueにコメントする
        if: ${{ hashFiles('merge_notice.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --body-file merge_notice.md

      - name: Commit and push all changes (with retry)
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git add data/
            if git diff --staged --quiet; then
              echo "コミットする変更はありません"
              exit 0
            fi
            git commit -m "Process issue #${{ github.event.issue.number }}, merge JSON"
            if git push; then
              echo "push 成功（${i}回目）"
              exit 0
            fi
            # 他の実行が先にpushした。rebaseはデータJSONが競合するため、最新に合わせ直してキューを再処理する
            echo "push に失敗しました（${i}回目）。最新を取得して処理をやり直します"
            sleep $((i * 5))
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            cp -r /tmp/qsnap/data/. data/
            python scripts/merge_json.py || true
          done
          echo "::error::5回試しても push できませんでした。Run workflow で再実行してください"
          exit 1

      - name: Fail if some queue files could not be read
        if: steps.merge.outcome == 'failure'
        run: |
          echo "::error::読み込めないキューファイルがあります。Summaryとコメントを確認してください"
          exit 1
