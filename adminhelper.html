function dkey(pw,salt){return crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']).then(function(k){return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:250000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])})}
function encTok(t,pw){var salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));return dkey(pw,salt).then(function(k){return crypto.subtle.encrypt({name:'AES-GCM',iv:iv},k,new TextEncoder().encode(t))}).then(function(ct){return{s:b64b(salt),i:b64b(iv),c:b64b(ct)}})}
function decTok(e,pw){return dkey(pw,unb64(e.s)).then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(e.i)},k,unb64(e.c))}).then(function(pt){return new TextDecoder().decode(pt)})}
function hasCrypto(){return !!(window.crypto&&crypto.subtle&&window.TextEncoder)}

if(r.status===401||r.status===403){x.txt='\u7d50\u679c\u3092\u78ba\u8a8d\u3067\u304d\u307e\u305b\u3093: '+httpMsg(r.status);x.cls='err';fin=true}
else if(r.status===200){var j=await r.json();
if(j.status==='done'){x.txt='\u5b8c\u4e86'+((j.notes&&j.notes.length)?' ('+j.notes.join(', ')+')':'');x.cls='ok';fin=true}
else if(j.status==='error'){x.txt='\u5931\u6557: '+((j.errors||[]).join(' / ')||'\u4e0d\u660e')+((j.notes&&j.notes.length)?' ('+j.notes.join(', ')+')':'');x.cls='err';fin=true}}}catch(e){}
if(!fin)x.txt='\u53cd\u6620\u5f85\u3061 ('+(n+1)*4+'s)';drawR()}
