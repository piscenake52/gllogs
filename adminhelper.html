<div id="adm">
<style>
html,body{background:#000!important}
#adm{position:relative;font:14px/1.5 system-ui,sans-serif;max-width:640px;margin:0 auto;padding:12px;color:#e5e7eb;background:#000;box-shadow:0 0 0 100vmax #000;clip-path:inset(0 -100vmax)}
#adm *{box-sizing:border-box}#adm h1{font-size:16px;margin:0 0 8px}
#adm .tabs{display:flex;gap:6px;margin-bottom:10px}
#adm button{background:#1f2937;color:#e5e7eb;border:1px solid #374151;border-radius:8px;padding:8px 12px;cursor:pointer}
#adm button.on,#adm .go{background:#2563eb;border-color:#2563eb}

#adm input[type=checkbox]{width:auto}#adm textarea{min-height:90px}
#adm .row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
#adm .box{margin-top:14px;padding:10px;border:1px solid #374151;border-radius:8px}

#adm .err{color:#f87171}#adm .ok{color:#4ade80}
</style>
<h1>SARD UNDERLINKS DATA ENTRY</h1>
<div class="tabs" id="tabs"></div>
<form id="f" onsubmit="return false"></form>
<div class="row"><button class="go" id="add">追加（キューへ）</button><button id="add2">ISSUEで送信</button><span id="msg"></span></div>
<div class="box"><b>QUEUE</b> <span id="qc"></span><div id="ql"></div>
<div class="row"><button id="retry">今すぐ再試行</button><button id="drop">失敗を破棄</button></div></div>
<details class="box"><summary>SETTINGS</summary>
<label>REPO</label><input id="s_repo"><label>BRANCH</label><input id="s_br">
<label>GITHUB TOKEN（Fine-grained / 対象リポジトリの Contents: Read and write のみ。この端末のブラウザにだけ保存）</label><input id="s_tk" type="password" autocomplete="off">
<div class="row"><button id="s_save">保存</button></div></details>
<script>
(function(){
var LS=localStorage,MEM=['YUA','IZM','HRM','MIU'],$=function(s){return document.querySelector(s)};
var CT=['live','tour','event','release','tv','radio','fanclub','sns','youtube','web','ticket','anniversary','birthday'];
var F={logs:[['date','DATE YYYYMMDD',1,'d8'],['time','TIME HHMM',0,'t4'],['cat','CAT',1,CT],['title','TITLE',1],['url','URL',0,'url'],['members','MEMBERS\uff08YUA,IZM,HRM,MIU\uff09',0,'mem'],['tags','TAGS\uff08\u30ab\u30f3\u30de\u533a\u5207\u308a\uff09',0,'arr'],['live','LIVE\uff08setlist \u306e ID\u3002\u7a7a\u6b04\u306a\u3089 DATE+TIME\uff09',0,'id12'],
['_live.venue','\u3010LIVE/TOUR/EVENT\u3011VENUE',0,'','live'],['_live.area','\u3010LIVE/TOUR/EVENT\u3011AREA',0,'','live'],['_live.kind','\u3010LIVE/TOUR/EVENT\u3011KIND\uff08CAT \u5185\u306e\u533a\u5206\u3002event \u306a\u3089 releaseevent \u306a\u3069\u3002\u81ea\u7531\u5165\u529b\uff09',0,'','live'],['_live.tour','\u3010LIVE/TOUR/EVENT\u3011TOUR\uff08\u30c4\u30a2\u30fc\u540d\u30fb\u30b7\u30ea\u30fc\u30ba\u540d\uff09',0,'','live'],['_live.open','\u3010LIVE/TOUR/EVENT\u3011OPEN HHMM',0,'t4','live'],['_live.songs','\u3010LIVE/TOUR/EVENT\u3011SONGS\uff081\u884c: \u66f2\u540d | type | note\u3002TIME \u304c\u5fc5\u8981\uff09',0,'sl','live'],
['_release.name','\u3010RELEASE\u3011\u4f5c\u54c1\u540d',0,'','release'],['_release.type','\u3010RELEASE\u3011\u7a2e\u5225',0,['album','single'],'release'],['_release.songs','\u3010RELEASE\u3011\u53ce\u9332\u66f2\uff081\u884c1\u66f2\u3002DATE \u304c\u767a\u58f2\u65e5\u306b\u306a\u308a\u307e\u3059\uff09',0,'tl','release'],
['_video.label','\u3010YOUTUBE\u3011VIDEO LABEL\uff08MV \u306a\u3069\uff09',0,'','video'],['_video.song','\u3010YOUTUBE\u3011SONG\uff08\u66f2\u540d\uff09',0,'','video']],
songs:[['title','TITLE',1],['yomi','YOMI\uff08\u3072\u3089\u304c\u306a\uff09'],['date','DATE YYYYMMDD',0,'d8'],['release','RELEASE\uff081\u884c: \u540d\u524d | album \u304b single\uff09',0,'rel'],['keywords','KEYWORDS\uff08\u30ab\u30f3\u30de\u533a\u5207\u308a\uff09',0,'arr'],['url','YOUTUBE URL',0,'url'],['lyricsid','LYRICSID\uff08\u6b4c\u30cd\u30c3\u30c8\u306eURL\u304b\u756a\u53f7\uff09',0,'lyr'],['lyric','LYRIC\uff08\u6b4c\u8a5e\u306e\u4e00\u90e8\uff09'],['original.name','ORIGINAL NAME'],['original.title','ORIGINAL TITLE'],['original.year','ORIGINAL YEAR'],['original.work','ORIGINAL WORK']],
setlist:[['id','ID YYYYMMDDHHMM',1,'id12'],['title','TITLE',1],['venue','VENUE'],['area','AREA'],['cat','CAT',0,['live','tour','event']],['kind','KIND\uff08CAT \u5185\u306e\u533a\u5206\u3002event \u306a\u3089 releaseevent \u306a\u3069\u3002\u81ea\u7531\u5165\u529b\uff09'],['tour','TOUR\uff08\u30c4\u30a2\u30fc\u540d\u30fb\u30b7\u30ea\u30fc\u30ba\u540d\uff09'],['open','OPEN HHMM',0,'t4'],['members','MEMBERS\uff08YUA,IZM,HRM,MIU\uff09',0,'mem'],['songs','SONGS\uff081\u884c: \u66f2\u540d | type | note\u3002type \u306f encore \u306a\u3069\uff09',0,'sl']],
videos:[['title','TITLE',1],['label','LABEL\uff08MV \u306a\u3069\uff09'],['url','URL',1,'url'],['song','SONG\uff08\u66f2\u540d\u307e\u305f\u306f id\uff09']]};
var kind='logs',Q=JSON.parse(LS.su_q||'[]'),busy=false;
var gen=function(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6)};
var cfg=function(){return{repo:LS.su_repo||'piscenake52/sulinks',br:LS.su_br||'main',tk:LS.su_tk||''}};
var say=function(t,c){var m=$('#msg');m.textContent=t;m.className=c||''};
var save=function(){LS.su_q=JSON.stringify(Q);draw()};
var b64=function(s){return btoa(unescape(encodeURIComponent(s)))};
var sleep=function(ms){return new Promise(function(r){setTimeout(r,ms)})};
var newPath=function(k){return 'data/'+k+'/queue/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.json'};
function grp(c){return c==='live'||c==='tour'||c==='event'?'live':c==='release'?'release':c==='youtube'?'video':''}
function sync(){var c=document.getElementById('f_cat'),g=c?grp(c.value):'';[].forEach.call(document.querySelectorAll('#f [data-g]'),function(w){w.style.display=w.dataset.g===g?'':'none'})}
function form(){var f=$('#f');f.innerHTML='';F[kind].forEach(function(d){var l=document.createElement('label');l.textContent=d[1]+(d[2]?' *':'');var e;
if(Array.isArray(d[3])){e=document.createElement('select');e.innerHTML='<option></option>'+d[3].map(function(o){return'<option>'+o+'</option>'}).join('')}
else if(d[3]==='rel'||d[3]==='sl'||d[3]==='tl'){e=document.createElement('textarea')}else{e=document.createElement('input');if(d[3]==='chk')e.type='checkbox'}
e.id='f_'+d[0];var w=document.createElement('div');if(d[4])w.dataset.g=d[4];w.append(l,e);f.append(w)});
var c=document.getElementById('f_cat');if(c)c.onchange=sync;sync();
document.querySelectorAll('#tabs button').forEach(function(b){b.className=b.dataset.k===kind?'on':''})}
function conv(d,v){var t=d[3];if(t==='chk')return v?true:undefined;v=String(v).trim();if(!v){if(d[2])throw Error(d[1]+' \u306f\u5fc5\u9808');return undefined}
var csv=function(s){return s.split(/[,\u3001]/).map(function(x){return x.trim()}).filter(Boolean)};
if(t==='d8'&&!/^\d{8}$/.test(v))throw Error(d[1]+' \u306f8\u6841\u306e\u6570\u5b57');
if(t==='id12'&&!/^\d{12}$/.test(v))throw Error(d[1]+' \u306f12\u6841\u306e\u6570\u5b57');
if(t==='t4'&&!(/^\d{4}$/.test(v)&&+v.slice(0,2)<24&&+v.slice(2)<60))throw Error(d[1]+' \u306f4\u6841\u306e\u6642\u523b\uff08\u4f8b 1730\uff09');
if(t==='url'&&!/^https?:\/\//i.test(v))throw Error(d[1]+' \u306f http(s):// \u3067\u59cb\u3081\u308b');
if(t==='arr')return csv(v);
if(t==='mem'){var m=csv(v.toUpperCase());m.forEach(function(x){if(MEM.indexOf(x)<0)throw Error('\u30e1\u30f3\u30d0\u30fc\u30b3\u30fc\u30c9\u4e0d\u6b63: '+x)});return m}
if(t==='rel'){var rl=v.split('\n').filter(function(r){return r.trim()}).map(function(r){var p=r.split('|').map(function(x){return x.trim()});var ty=(p[1]||'').toLowerCase();if(!p[0]||(ty!=='album'&&ty!=='single'))throw Error('RELEASE \u306f\u300c\u540d\u524d | album\u300d\u304b\u300c\u540d\u524d | single\u300d\u306e\u5f62\u5f0f');return{name:p[0],type:ty}});return rl.length===1?rl[0]:rl}
if(t==='lyr'){var lm=v.match(/uta-net\.com\/song\/(\d+)/);if(lm)return lm[1];if(/^\d+$/.test(v))return v;throw Error(d[1]+' \u306f\u6b4c\u30cd\u30c3\u30c8\u306eURL\u304b\u756a\u53f7')}
if(t==='tl')return v.split('\n').map(function(x){return x.trim()}).filter(Boolean);
if(t==='sl')return v.split('\n').filter(function(r){return r.trim()}).map(function(r,i){var p=r.split('|').map(function(x){return x.trim()});var o={no:i+1,title:p[0]};if(!p[0])throw Error('SONGS \u306e\u66f2\u540d\u304c\u7a7a\u306e\u884c\u304c\u3042\u308a\u307e\u3059');if(p[1])o.type=p[1];if(p.length>2)o.note=p.slice(2).join(' | ');return o});
return v}
function add(dest){try{var it={},cv=document.getElementById('f_cat'),vg=kind==='logs'&&cv?grp(cv.value):'';F[kind].forEach(function(d){if(d[4]&&d[4]!==vg)return;var e=document.getElementById('f_'+d[0]),v=conv(d,d[3]==='chk'?e.checked:e.value);if(v!==undefined){var p=d[0].split('.');if(p.length>1){it[p[0]]=it[p[0]]||{};it[p[0]][p[1]]=v}else it[d[0]]=v}});
if(kind==='logs'){
if(it._live){if(!it.time&&!it.live)throw Error('LIVE/EVENT \u306e\u60c5\u5831\u3092\u5165\u308c\u308b\u3068\u304d\u306f TIME \u304c\u5fc5\u8981\u3067\u3059');}
if(it.cat==='tour'&&!(it._live&&it._live.tour))throw Error('CAT \u304c tour \u306e\u3068\u304d\u306f TOUR\uff08\u30c4\u30a2\u30fc\u540d\uff09\u304c\u5fc5\u8981\u3067\u3059');
if(it._release){if(!it._release.name||!it._release.type||!it._release.songs)throw Error('RELEASE \u306f \u4f5c\u54c1\u540d\u30fb\u7a2e\u5225\u30fb\u53ce\u9332\u66f2 \u3092\u3059\u3079\u3066\u5165\u308c\u3066\u304f\u3060\u3055\u3044')}
if(it._video&&!it.url)throw Error('\u52d5\u753b\u3092\u767b\u9332\u3059\u308b\u3068\u304d\u306f URL \u304c\u5fc5\u8981\u3067\u3059')}
if(kind==='logs'){var o={id:gen('L')};for(var k in it)o[k]=it[k];it=o}
if(dest==='issue'){var u='https://github.com/'+cfg().repo+'/issues/new?template=add_queue.yml&title='+encodeURIComponent('[QUEUE] '+kind+' '+(it.title||''))+'&kind='+encodeURIComponent(kind)+'&item='+encodeURIComponent(JSON.stringify(it));
if(u.length>7500)throw Error('\u5185\u5bb9\u304c\u9577\u3059\u304e\u3066 ISSUE \u3067\u306f\u9001\u308c\u307e\u305b\u3093\u3002\u300c\u8ffd\u52a0\uff08\u30ad\u30e5\u30fc\u3078\uff09\u300d\u3092\u4f7f\u3063\u3066\u304f\u3060\u3055\u3044');
var w=window.open(u,'_blank');if(!w)throw Error('\u30dd\u30c3\u30d7\u30a2\u30c3\u30d7\u304c\u30d6\u30ed\u30c3\u30af\u3055\u308c\u307e\u3057\u305f\u3002\u8a31\u53ef\u3057\u3066\u304b\u3089\u3082\u3046\u4e00\u5ea6\u62bc\u3057\u3066\u304f\u3060\u3055\u3044');w.opener=null;form();say('GitHub \u306e\u753b\u9762\u3092\u958b\u304d\u307e\u3057\u305f\u3002\u5185\u5bb9\u306f\u5909\u3048\u305a\u306b\u9001\u4fe1\u3057\u3066\u304f\u3060\u3055\u3044','ok');return}
Q.push({kind:kind,path:newPath(kind),body:b64(JSON.stringify({item:it})),title:it.title,tries:0,st:'wait',next:0});save();form();say('\u30ad\u30e5\u30fc\u306b\u8ffd\u52a0\u3057\u307e\u3057\u305f','ok');run()}catch(e){say(e.message,'err')}}
async function run(){if(busy)return;busy=true;try{for(;;){var it=Q.find(function(x){return x.st!=='failed'&&Date.now()>=(x.next||0)});if(!it)break;var c=cfg();if(!c.tk){say('\u30c8\u30fc\u30af\u30f3\u3092\u8a2d\u5b9a\u3057\u3066\u304f\u3060\u3055\u3044','err');break}
var r;try{r=await fetch('https://api.github.com/repos/'+c.repo+'/contents/'+it.path,{method:'PUT',headers:{Authorization:'Bearer '+c.tk,Accept:'application/vnd.github+json'},body:JSON.stringify({message:'queue: '+it.kind+' '+(it.title||''),content:it.body,branch:c.br})})}catch(e){r={ok:false,status:0}}
if(r.ok){Q=Q.filter(function(x){return x!==it});save();await sleep(1200);continue}
if(r.status===401||r.status===404){say('\u8a8d\u8a3c/\u30ea\u30dd\u30b8\u30c8\u30ea\u8a2d\u5b9a\u30a8\u30e9\u30fc\uff08'+r.status+'\uff09\u3002SETTINGS\u3092\u78ba\u8a8d\u3057\u3066\u300c\u4eca\u3059\u3050\u518d\u8a66\u884c\u300d','err');it.err=r.status;it.next=Date.now()+3600000;save();break}
it.tries++;if(r.status===422){it.path=newPath(it.kind);if(it.tries>3)it.st='failed'}
it.next=Date.now()+Math.min(60000,2000*Math.pow(2,it.tries));save()}}finally{busy=false}}
function draw(){var n=Q.length;$('#qc').textContent='\uff08'+n+'\u4ef6\uff09';var l=$('#ql');l.innerHTML='';Q.forEach(function(x){var d=document.createElement('div');d.className='q';var a=document.createElement('span'),b=document.createElement('span');
a.textContent=x.kind.toUpperCase()+' '+(x.title||'');b.textContent=x.st==='failed'?'\u5931\u6557':x.tries?'\u518d\u8a66\u884c\u5f85\u3061('+x.tries+')':'\u9001\u4fe1\u5f85\u3061';if(x.st==='failed')b.className='err';d.append(a,b);l.append(d)})}
var tabs=$('#tabs');Object.keys(F).forEach(function(k){var b=document.createElement('button');b.textContent=k.toUpperCase();b.dataset.k=k;b.onclick=function(){kind=k;form()};tabs.append(b)});
$('#add').onclick=function(){add('queue')};$('#add2').onclick=function(){add('issue')};$('#retry').onclick=function(){Q.forEach(function(x){x.next=0;if(x.st==='failed'){x.st='wait';x.tries=0}});save();run()};
$('#drop').onclick=function(){Q=Q.filter(function(x){return x.st!=='failed'});save()};
var c0=cfg();$('#s_repo').value=c0.repo;$('#s_br').value=c0.br;$('#s_tk').value=c0.tk;
$('#s_save').onclick=function(){LS.su_repo=$('#s_repo').value.trim();LS.su_br=$('#s_br').value.trim();LS.su_tk=$('#s_tk').value.trim();say('\u8a2d\u5b9a\u3092\u4fdd\u5b58\u3057\u307e\u3057\u305f','ok');run()};
window.onbeforeunload=function(){if(Q.length)return'\u672a\u9001\u4fe1\u306e\u30ad\u30e5\u30fc\u304c\u3042\u308a\u307e\u3059'};
setInterval(run,5000);form();draw();run();
})();
</script></div>
