<script type="text/javascript">
//<![CDATA[
(() => {
  // 特定の配信元(ホスト名+パス)からのアクセスかどうかをハッシュ比較で判定する(URL文字列はソースに直接書かない)。
  // headの早期リダイレクト用スクリプトと同じアルゴリズム・同じハッシュ値を使用している。
  const isForcedFreshSource = () => {
    const simpleHash = s => {
      let h = 0;
      for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
      return h;
    };
    return simpleHash(location.hostname) === -1626720631 && simpleHash(location.pathname) === 982197929;
  };
  let logs = [], filtered = [], rendered = 0, updating = false;
  let desc = true, defaultText = '', timer = null, renderTimer = null;
  let setlistData = []; // setlist.json(公演ごとのセットリスト)のキャッシュ
  let songsData = []; // songs.json(artist/title/link)のキャッシュ。SETLISTポップアップの再生ボタンにも使う
  let setlistMode = false; // SETLISTボタンでON/OFFする「セトリ検索モード」
  // セトリ検索モードに入る直前のTODAY状態(todayMode/todayOffset/desc/preTodaySort)のスナップショット。
  // セトリ検索モード中のTODAYは通常時とは別管理(独立してON/OFFできる)とし、セトリ検索モードを
  // 終了した時にここへ完全復元する。セトリ検索モード中でなければnull。
  let setlistTodaySavedState = null;
  // セトリ検索モード中、コンテンツフィルターの LIVE/EVENT 以外を「ダブルクリックした時と同じ除外状態」に
  // 一括で強制する。対象は SETLIST_ALLOWED_CONTS(許可する種類)以外を allConts から動的に算出するため、
  // 今後コンテンツ種類が追加/削除されてもこのロジックを変更する必要はない。
  const SETLIST_ALLOWED_CONTS = ['LIVE', 'EVENT'];
  const setlistExcludedConts = () => allConts.filter(v => !SETLIST_ALLOWED_CONTS.includes(v));
  // セトリ検索モードに入る直前の除外状態(excludedFilterValues)のスナップショット。セトリ検索モードを
  // 終了した時にここへ完全復元する。セトリ検索モード中でなければnull。
  let setlistExcludedSavedState = null;
  const pageSize = 40, isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
  const $ = id => document.getElementById(id);
  // G2: 小田柚葉:YZH、隅谷百花:MMK、鶴屋美咲:MSK、小川桜花:YOK、増田來亜:KUR、菱田未渚美:MNM、山口綺羅:KIR、原田都愛:TOA、石井蘭:RAN
  // L2: 山口莉愛:RIN、杉浦優來:YUR、永山椿:TBK、深澤日彩:HIR、比嘉優和:YUW、佐藤栞奈:KAN、上村梨々香:RRK、森朱里:AKR、佐藤妃希:KIK
  const g2 = [
    {v:'G2',t:'Girls\u00B2'},{v:'YZH',n:'YUZUHA',c:'\uD83E\uDE75'},{v:'MMK',n:'MOMOKA',c:'\uD83D\uDC99'},{v:'MSK',n:'MISAKI',c:'\uD83E\uDDE1'},
    {v:'YOK',n:'YOKA',c:'\uD83D\uDC9C'},{v:'KUR',n:'KUREA',c:'\uD83E\uDD0D'},{v:'MNM',n:'MINAMI',c:'\uD83E\uDE77'},{v:'KIR',n:'KIRA',c:'\uD83D\uDC9B'},
    'sep',{v:'TOA',n:'TOA',c:'\uD83D\uDC9A'},{v:'RAN',n:'RAN',c:'\u2764\uFE0F'}
  ];
  const l2 = [
    {v:'L2',t:'Laki'},{v:'RIN',n:'RINA',c:'\uD83D\uDC9C'},{v:'TBK',n:'TSUBAKI',c:'\uD83E\uDDE1'},{v:'HIR',n:'HIIRO',c:'\uD83E\uDE75'},
    {v:'YUW',n:'YUWA',c:'\u2764\uFE0F'},{v:'KAN',n:'KANNA',c:'\uD83D\uDC99'},{v:'RRK',n:'RIRIKA',c:'\uD83E\uDE77'},{v:'AKR',n:'AKARI',c:'\uD83D\uDC9A'},
    {v:'KIK',n:'KIKI',c:'\uD83D\uDC9B'},'sep',{v:'YUR',n:'YURA',c:'\uD83E\uDD0D'}
  ];
  const others = ['FANCLUB','DIARY','GLRADIO','GTUBE','YOUTUBE','CL','SNS','RELEASE','LIVE','EVENT','MODEL','MOVIE','MEDIA','MAGAZINE','WEB','TICKET','SALES','ETC'];

  const symbols = {
    'FANCLUB': '\uD83D\uDCE3',
    'DIARY': '\uD83D\uDCDD', 'GLRADIO': '\uD83D\uDD0A', 'GTUBE': '\u25B6\uFE0F', 'YOUTUBE': '\uD83C\uDF9E\uFE0F', 
    'CL': '\uD83C\uDD91', 'RELEASE': '\uD83C\uDFA7', 'LIVE': '\uD83C\uDF99\uFE0F', 
    'EVENT': '\uD83D\uDCAC', 'MEDIA': '\uD83D\uDCE1', 'MAGAZINE': '\uD83D\uDCD6', 'WEB': '\uD83C\uDF10', 'SNS': '\uD83D\uDCF1', 'SALES': '\uD83D\uDED2', 'ANNIVERSARY': '\uD83D\uDD16', 'BIRTHDAY': '\uD83C\uDF82',
    'MODEL': '\uD83D\uDC60', 'MOVIE': '\uD83C\uDFAC\uFE0F', 'TICKET': '\uD83C\uDFAB',
    'CLOSE': '\u2705', 'RESULT': '\uD83C\uDFAF', 'CAMPAIGN': '\uD83D\uDCE8', 'PLAYING': '\uD83C\uDFB6', 'MESSAGE': '\uD83D\uDCE8', // フィルターボタンには表示せず、ETC選択時のみ該当させる
    'ETC': '\uD83D\uDCCC',
    // 以下5種類はcontentsフィルターボタンには表示しないが、フィルター判定上は"RELEASE"として扱う(normalizeContType参照)。
    // データ部のアイコン表示ではそれぞれ専用のアイコン+コンテンツ名を表示する。
    'CD': '\uD83D\uDCBF\uFE0F', 'DVD': '\uD83D\uDCC0\uFE0F', 'BD': '\uD83D\uDCC0\uFE0F', 'DIGITAL': '\uD83C\uDFA7', 'MUSICCARD': '\uD83C\uDFA7',
    // 以下4種類はフィルターボタンには表示せず、フィルター判定上は"MEDIA"として扱う(normalizeContType参照)
    'TV': '\uD83D\uDCFA\uFE0F', 'RADIO': '\uD83D\uDCFB\uFE0F', 'BOOK': '\uD83D\uDCDA', 'NEWSPAPER': '\uD83D\uDCF0',
    // 以下2種類はフィルターボタンには表示せず、フィルター判定上は"WEB"として扱う(normalizeContType参照)
    'STREAMING': '\uD83D\uDCF6', 'PODCAST': '\uD83C\uDFA4',
    // COLUMNはフィルターボタンには表示せず、フィルター判定上は"WEB"として扱う(normalizeContType参照)
    'COLUMN': '\uD83C\uDF10',
    // GOODSはフィルターボタンには表示せず、フィルター判定上は"SALES"として扱う(normalizeContType参照)
    'GOODS': '\uD83D\uDED2',
    // 以下2種類はフィルターボタンには表示せず、フィルター判定上は"EVENT"として扱う(normalizeContType参照)
    'STAGE': '\uD83C\uDFAD', 'COOKING': '\uD83C\uDF7D\uFE0F', 'RELEASEEVENT': '\uD83C\uDFA4',
    // DEBUT/FORMATIONはフィルターボタンには表示せず、フィルター判定上は"BIRTHDAY"として扱う(normalizeContType参照)。
    // ただしBIRTHDAYと違い、isBirthdayAnniversaryの対象外なので年をまたいだ月日一致では表示されない
    'DEBUT': '\uD83C\uDF82', 'FORMATION': '\uD83D\uDD17'
  };

  // 内部値(contents値・フィルター値)と実際の表示名が異なるものだけここに登録する(それ以外は値そのものを表示名として使う)
  const contentDisplayNames = { 'GLRADIO': 'GL\u00B2RADIO' };
  const displayNameFor = v => contentDisplayNames[v] || v;

  const dayNames = ['日', '月', '火', '水', '木', '金', '土'];

  // 項目左端の日付表示:年/月/日/曜日/時分をそれぞれ個別に表示on/offできる(次回訪問時も記憶)
  const DATE_PARTS_KEY = 'gl_log_date_parts';
  let dateParts = { year: true, month: true, day: true, weekday: true, time: false };
  try {
    const savedParts = JSON.parse(localStorage.getItem(DATE_PARTS_KEY) || 'null');
    if (savedParts && typeof savedParts === 'object') dateParts = Object.assign(dateParts, savedParts);
  } catch (e) { /* 壊れていたら既定値のまま使う */ }

  const formatTimeStr = timeStr => {
    if (!timeStr || timeStr.length !== 4) return '';
    return timeStr.slice(0, 2) + ':' + timeStr.slice(2, 4);
  };

  // dateは「20260908」のような8桁(年4桁+月2桁+日2桁)の文字列を想定
  const formatDisplayDate = item => {
    const dateStr = item.date;
    if (!dateStr) return '';
    if (!/^\d{8}$/.test(dateStr)) return dateStr; // 想定外フォーマットはそのまま表示
    const y = dateStr.slice(0, 4), m = dateStr.slice(4, 6), d = dateStr.slice(6, 8);
    const dateObj = new Date(parseInt(y, 10), parseInt(m, 10) - 1, parseInt(d, 10));
    const dayStr = isNaN(dateObj.getTime()) ? '' : dayNames[dateObj.getDay()];

    // 画面表示は従来通り「年.月.日」のドット区切りにする(データ格納形式とは切り離す)
    const ymd = [];
    if (dateParts.year) ymd.push(y);
    if (dateParts.month) ymd.push(m);
    if (dateParts.day) ymd.push(d);
    let out = ymd.join('.');
    if (dateParts.weekday && dayStr) out += (out ? ' ' : '') + `[${dayStr}]`;
    return out;
  };

  // 8桁のYYYYMMDD形式は既にゼロ埋め済みなので、そのまま文字列比較でソート可能
  const normalizeDateForSort = dateStr => dateStr || '';

  // ソート専用のキー:date(正規化)とtime(HHMM、未設定時は"0000"扱い)を組み合わせる。
  // timeは検索対象には含めない(検索用テキストの生成には使わない)。
  const sortKeyFor = item => normalizeDateForSort(item.date) + '_' + (item.time || '0000');

  const createLabel = item => {
    if (item === 'sep') {
      const s = document.createElement('span');
      s.className = 'sep';
      s.textContent = '/';
      return s;
    }
    const l = document.createElement('label');
    l.tabIndex = 0;
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.tabIndex = -1;
    cb.value = item.v || item;
    const sp = document.createElement('span');
    sp.className = 'label-text';
    if (item.n) {
      sp.title = item.n;
      sp.textContent = item.c;
      l.title = item.n; // ホバー範囲をアイコンだけでなくボタン全体に拡張
    } else if (typeof item === 'string' && symbols[item] !== undefined) {
      // コンテンツ種類ボタン:通常はテキスト、ICONモードON時はアイコンのみ表示に切り替える
      const iconPart = document.createElement('span');
      iconPart.className = 'label-icon-part';
      iconPart.textContent = symbols[item];
      const textPart = document.createElement('span');
      textPart.className = 'label-text-part';
      textPart.textContent = displayNameFor(item);
      sp.append(iconPart, textPart);
      l.dataset.tooltipName = displayNameFor(item); // ICONモード時のみtitleとして反映する(updateContentTooltipsで制御)
    } else {
      sp.textContent = item.t || item;
    }
    if (item.v && item.t) l.className = 'btn-group';
    const badge = document.createElement('span');
    badge.className = 'count-badge';
    badge.style.display = 'none';
    l.append(cb, sp, badge);
    return l;
  };

  g2.forEach(i => $('memberChecks1').appendChild(createLabel(i)));
  l2.forEach(i => $('memberChecks2').appendChild(createLabel(i)));
  // 月フィルター(1〜12月)。年フィルターと違い実データに依存しない固定の選択肢なので、ここで一度だけ生成する
  for (let m = 1; m <= 12; m++) {
    $('monthChecks').appendChild(createLabel({ v: String(m).padStart(2, '0'), t: String(m) }));
  }
  // コンテンツ種類ボタンの並び順・段(1段目/2段目)をlocalStorageから復元する。
  // 旧形式(フラットな配列=1段目のみ)が保存されている場合はそのまま1段目として扱う(後方互換)。
  const applySavedContentOrder = arr => {
    try {
      const saved = JSON.parse(localStorage.getItem('gl_log_content_order') || 'null');
      if (Array.isArray(saved)) {
        const savedValid = saved.filter(v => arr.includes(v));
        const rest = arr.filter(v => !savedValid.includes(v));
        return { row1: [...savedValid, ...rest], row2: [] };
      }
      if (saved && Array.isArray(saved.row1) && Array.isArray(saved.row2)) {
        const savedValid1 = saved.row1.filter(v => arr.includes(v));
        const savedValid2 = saved.row2.filter(v => arr.includes(v) && !savedValid1.includes(v));
        const rest = arr.filter(v => !savedValid1.includes(v) && !savedValid2.includes(v));
        return { row1: [...savedValid1, ...rest], row2: savedValid2 };
      }
      return { row1: arr, row2: [] };
    } catch (e) {
      return { row1: arr, row2: [] };
    }
  };

  const savedContentRows = applySavedContentOrder(others);
  others.splice(0, others.length, ...savedContentRows.row1, ...savedContentRows.row2);
  savedContentRows.row1.forEach(o => $('otherChecks').appendChild(createLabel(o)));
  savedContentRows.row2.forEach(o => $('otherChecks2').appendChild(createLabel(o)));
  if (savedContentRows.row2.length > 0) $('otherChecks2').classList.add('has-items');

  // コンテンツ種類ボタンのみ、ドラッグ&ドロップで並び替え・2段目への移動ができるようにする(並び・段はlocalStorageに記憶)。
  // 1段目のボタンを下にドラッグすると2段目(otherChecks2)がプレビュー表示され、そこにドロップすると
  // 実際に2段目に移動する。2段目の中身が無くなったら多段表示は自動的に解除される。
  (() => {
    const row1 = $('otherChecks');
    const row2 = $('otherChecks2');
    let draggedEl = null;

    const saveOrder = () => {
      const row1Vals = Array.from(row1.querySelectorAll('label')).map(l => l.querySelector('input')?.value).filter(Boolean);
      const row2Vals = Array.from(row2.querySelectorAll('label')).map(l => l.querySelector('input')?.value).filter(Boolean);
      localStorage.setItem('gl_log_content_order', JSON.stringify({ row1: row1Vals, row2: row2Vals }));
    };

    const updateRow2Visibility = () => {
      row2.classList.toggle('has-items', row2.children.length > 0);
    };

    const attachLabelDnD = label => {
      label.draggable = true;

      label.addEventListener('dragstart', e => {
        draggedEl = label;
        label.classList.add('is-dragging-reorder');
        e.dataTransfer.effectAllowed = 'move';
        // 2段目がまだ空の場合、ドラッグ中だけ半透明でドロップ先候補として見せる(実際に入れると本表示になる)
        if (row2.children.length === 0) row2.classList.add('drag-target-active');
      });

      label.addEventListener('dragend', () => {
        draggedEl = null;
        label.classList.remove('is-dragging-reorder');
        row2.classList.remove('drag-target-active');
        updateRow2Visibility();
        saveOrder();
      });

      label.addEventListener('dragover', e => {
        e.preventDefault();
        if (!draggedEl || draggedEl === label) return;
        const rect = label.getBoundingClientRect();
        const before = (e.clientX - rect.left) < rect.width / 2;
        // 段をまたいで移動済みのラベルでも常に現在の実際の親要素に挿入する(段移動直後は
        // attachLabelDnD時点の行と実際の所属行がズレるため、都度parentElementを参照する)
        label.parentElement.insertBefore(draggedEl, before ? label : label.nextSibling);
      });
    };

    Array.from(row1.querySelectorAll('label')).forEach(attachLabelDnD);
    Array.from(row2.querySelectorAll('label')).forEach(attachLabelDnD);

    // ラベルの無い余白(段の右端や、まだ何も無い2段目そのもの)にドロップされた場合の受け皿
    [row1, row2].forEach(rowEl => {
      rowEl.addEventListener('dragover', e => e.preventDefault());
      rowEl.addEventListener('drop', e => {
        e.preventDefault();
        if (draggedEl && !rowEl.contains(draggedEl)) rowEl.appendChild(draggedEl);
      });
    });
  })();


  const enableHorizontalScroll = el => {
    el.addEventListener('wheel', e => {
      if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
      if (el.scrollWidth <= el.clientWidth) return;
      e.preventDefault();
      el.scrollLeft += e.deltaY;
    }, { passive: false });

    let isDragging = false, dragStartX = 0, dragStartScrollLeft = 0, hasDragged = false;
    el.addEventListener('mousedown', e => {
      isDragging = true; hasDragged = false;
      dragStartX = e.pageX; dragStartScrollLeft = el.scrollLeft;
      el.style.cursor = 'grabbing';
    });
    window.addEventListener('mousemove', e => {
      if (!isDragging) return;
      const dx = e.pageX - dragStartX;
      if (Math.abs(dx) > 3) hasDragged = true;
      el.scrollLeft = dragStartScrollLeft - dx;
    });
    window.addEventListener('mouseup', () => {
      if (!isDragging) return;
      isDragging = false;
      el.style.cursor = '';
    });
    el.addEventListener('click', e => {
      if (hasDragged) { e.preventDefault(); e.stopPropagation(); hasDragged = false; }
    }, true);
  };
  document.querySelectorAll('.checks-row-years, .checks-row-other, .checks-row-months, .header-btn-group').forEach(enableHorizontalScroll);

  let checkboxes = document.querySelectorAll('.checks input[type="checkbox"]');
  let labels = document.querySelectorAll('.checks label:has(input)');
  const g2Vals = ['YZH','MMK','MSK','YOK','KUR','MNM','KIR','TOA','RAN'];
  const l2Vals = ['RIN','YUR','TBK','HIR','YUW','KAN','RRK','AKR','KIK'];
  const allGroupVals = [...g2Vals, ...l2Vals];

  // groupsからGirls\u00b2(G2)/Laki(L2)どちらの予定かを判定する。
  // 1) groupsに'G2'/'L2'のリテラルタグがあればそれを優先。
  // 2) どちらのリテラルタグも無ければ、メンバーコードの内容からG2/L2を判定する。
  // 3) 両方に該当する場合は'both'を返す(斜め半々アイコン用)。
  const getTeamClass = item => {
    const g = item.groups || [];
    let hasG2 = g.includes('G2');
    let hasL2 = g.includes('L2');
    if (!hasG2 && !hasL2) {
      hasG2 = g.some(v => g2Vals.includes(v));
      hasL2 = g.some(v => l2Vals.includes(v));
    }
    if (hasG2 && hasL2) return 'both';
    if (hasG2) return 'g2';
    if (hasL2) return 'l2';
    return null;
  };

  // ソート用:日付+時刻が同じ場合のタイブレーク優先順位(G2とL2両方 > G2のみ > L2のみ > STF含む > それ以外)
  // STFが含まれる場合は、たとえgroupsにG2/L2のリテラルタグが同時にあっても常に「STF含む」枠になる
  const groupSortRank = item => {
    const g = item.groups || [];
    if (g.includes('STF')) return 3;
    const tc = getTeamClass(item);
    if (tc === 'both') return 0;
    if (tc === 'g2') return 1;
    if (tc === 'l2') return 2;
    return 4;
  };
  // ソート用:日付+時刻+グループも同じ場合のタイブレーク。メンバーフィルターボタンの実際の表示順
  // (g2→l2、それぞれボタンの並び順どおり)でランク付けする。複数メンバーが該当する場合は
  // 最も並び順が早いメンバーを代表値として使う。該当メンバーが無ければ末尾扱い。
  const memberOrder = [...g2, ...l2]
    .filter(i => typeof i === 'object' && i.n !== undefined)
    .map(i => i.v);
  // データ部のハート表示(グループアイコン押下時・ハートモード)の並び順。フィルターボタンの並び替えや
  // 表示順(memberOrder、上記)とは完全に独立した固定の順序
  const heartOrder = [
    'YZH', 'MMK', 'MSK', 'YOK', 'KUR', 'MNM', 'KIR', 'TOA', 'RAN',
    'RIN', 'YUR', 'TBK', 'HIR', 'YUW', 'KAN', 'RRK', 'AKR', 'KIK'
  ];
  const memberSortRank = item => {
    const g = item.groups || [];
    let best = memberOrder.length;
    g.forEach(v => {
      const idx = memberOrder.indexOf(v);
      if (idx !== -1 && idx < best) best = idx;
    });
    return best;
  };

  // データ部のG2/L2アイコンをクリックした際に表示する、メンバーコード→(名前,ハート絵文字)の対応表
  const memberInfoByCode = {};
  [...g2, ...l2].forEach(i => {
    if (typeof i === 'object' && i.n !== undefined) memberInfoByCode[i.v] = { n: i.n, c: i.c };
  });

  // 💞ボタン(ハートモード):データ部のハート表示を一括で展開/縮小する。
  // 個別のG2/L2アイコンでの開閉とも連動し、ひとつでも展開されていればON、ひとつも展開されていなければOFFとする。
  // フィルター変更や追加読み込みで行が再描画された場合も、ON中は新しく表示される行のハートを自動的に展開状態で生成する。
  let heartModeOn = false;
  const refreshHeartModeState = () => {
    heartModeOn = !!$('items').querySelector('.team-hearts.is-open');
    $('heartToggleBtn').classList.toggle('is-active', heartModeOn);
  };

  // コンテンツアイコン(item-contents)クリック時のアコーディオン展開:行ごとに独立して開閉する。
  // 開いている行はitemKeyForで識別してexpandedContentKeysに保持し、再描画時にも復元する。
  // 通常の再描画(検索・フィルター変更・CLEAR等)では全て閉じた状態に戻すが、年/月/日/曜/時の
  // 表示切替ボタンによる再描画だけは、updateDisplay()の第2引数で明示的に保持する。
  const itemKeyFor = item => `${item.date || ''}_${item.time || ''}_${item.contents || ''}_${item.title || ''}_${item.url || ''}`;
  let expandedContentKeys = new Set();

  // 展開時の幅を「コンテンツ名の長さ」に合わせて計測する(上限はRELEASEEVENT等の最長級でも収まるよう11.5em)。
  // 一時的にflex-basisの制約を外して自然な横幅(scrollWidth)を測り、パディング分を差し引いてから
  // 元の値に戻す(実際の反映は呼び出し側でstyle.flexBasisに設定する)。widthは併用せずflex-basisのみで
  // サイズを決める(flex-shrink:0のためflex-basisがそのまま表示幅になり、左端の位置がぶれない)。
  // 計測値ぴったりだと文字がぎりぎりで見切れることがあるため、少し余裕(CONTENT_OPEN_BUFFER_PX)を足す。
  const MAX_CONTENT_OPEN_EM = 11.5;
  const CONTENT_OPEN_BUFFER_PX = 8;
  const measureContentOpenWidthPx = el => {
    const cs = getComputedStyle(el);
    const paddingH = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
    const fontSizePx = parseFloat(cs.fontSize);
    const prevBasis = el.style.flexBasis;
    const prevMaxWidth = el.style.maxWidth;
    el.style.flexBasis = 'auto';
    el.style.maxWidth = 'none'; // 計測中はCSS側のmax-width(11.5em)の影響を受けないようにする
    const naturalContentWidth = Math.ceil(el.scrollWidth - paddingH) + CONTENT_OPEN_BUFFER_PX;
    el.style.flexBasis = prevBasis;
    el.style.maxWidth = prevMaxWidth;
    const maxContentWidth = fontSizePx * MAX_CONTENT_OPEN_EM;
    return Math.min(naturalContentWidth, maxContentWidth);
  };

  // team-both(G2/L2両方)の行でハートを一括表示する際、どちらのグループのメンバーかを判定するための集合
  const g2MemberCodes = new Set(g2.filter(i => typeof i === 'object' && i.n !== undefined).map(i => i.v));
  const l2MemberCodes = new Set(l2.filter(i => typeof i === 'object' && i.n !== undefined).map(i => i.v));

  const primaryConts = ['FANCLUB','DIARY','GLRADIO','GTUBE','YOUTUBE','CL','SNS','RELEASE','LIVE','EVENT','MEDIA','MAGAZINE','WEB','SALES','ANNIVERSARY','BIRTHDAY','MODEL','MOVIE','TICKET'];
  const allConts = [...primaryConts, 'ETC'];
  const cats = [{meta:'G2',values:g2Vals},{meta:'L2',values:l2Vals}];

  // CD/DVD/BD/DIGITALはコンテンツフィルターボタンには表示しないが、フィルター判定(年/コンテンツ種類/自動on-off/
  // 件数プレビュー/ソート等)上は"RELEASE"の一部として扱う。データ部の表示(アイコン・コンテンツ名)には影響しない。
  const releaseAliasConts = ['CD', 'DVD', 'BD', 'DIGITAL', 'MUSICCARD'];
  const mediaAliasConts = ['TV', 'RADIO', 'BOOK', 'NEWSPAPER'];
  const webAliasConts = ['STREAMING', 'PODCAST', 'COLUMN'];
  const salesAliasConts = ['GOODS'];
  const eventAliasConts = ['STAGE', 'COOKING', 'RELEASEEVENT'];
  const birthdayAliasConts = ['DEBUT', 'FORMATION'];
  const normalizeContTypeCache = new Map();
  // logs.jsonの実データではcontents(コンテンツ種類の生値)は数十種類程度しかなく、同じ値が何度も
  // 出現するため、毎回エイリアス配列を線形チェックするのではなく、値ごとに1回計算した結果をキャッシュする。
  // エイリアス配列(releaseAliasConts等)は実行中に変化しないため、キャッシュが古くなる心配は無い
  const normalizeContType = c => {
    if (normalizeContTypeCache.has(c)) return normalizeContTypeCache.get(c);
    const result =
      releaseAliasConts.includes(c) ? 'RELEASE' :
      mediaAliasConts.includes(c) ? 'MEDIA' :
      webAliasConts.includes(c) ? 'WEB' :
      salesAliasConts.includes(c) ? 'SALES' :
      eventAliasConts.includes(c) ? 'EVENT' :
      birthdayAliasConts.includes(c) ? 'BIRTHDAY' : c;
    normalizeContTypeCache.set(c, result);
    return result;
  };

  // キーワード検索用の連結文字列(searchText)は、タイトル・タグ等データが変わらない限り
  // アイテムごとに常に同じ結果になるため、初回計算時にWeakMapへキャッシュし使い回す。
  // updateDisplay/previewCountFor/autoUpdateContentTypeFiltersの3箇所すべてで、検索・フィルター操作の
  // たびに全件(約1万件)ぶんの文字列連結+toLowerCaseをやり直していたのを避けるための最適化。
  // WeakMapなので、データ更新でlogs配列が丸ごと新しいオブジェクトに入れ替わった場合も、
  // 古いアイテムへの参照が無くなればエントリごと自動的にGCされ、明示的なキャッシュクリアは不要
  const searchTextCache = new WeakMap();
  const getSearchText = item => {
    let text = searchTextCache.get(item);
    if (text === undefined) {
      text = (item.title + ' ' + (item.display_pc || '') + ' ' + (item.display_sp || '') + ' ' + item.date + ' ' + item.contents + ' ' + normalizeContType(item.contents) + ' ' + (item.tags ? item.tags.join(' ') : '')).toLowerCase();
      searchTextCache.set(item, text);
    }
    return text;
  };

  // 検索窓の"-コンテンツ種類名"(例:"-DIARY"、または"-RELEASE"のような正規化後の総称名)でその種類を
  // 非表示にできるよう、各アイテムのsearchTextにはitem.contentsの生の値に加えてnormalizeContType後の
  // 正規化名も含める(下記3箇所のsearchText構築を参照)。これによりCD/DVD/BD等のエイリアスも
  // "-RELEASE"一つで一括除外でき、種類ごとに個別のエイリアス名を意識する必要が無くなる。

  // ソート用:日付+時刻+グループも同じ場合の最終タイブレーク。othersはコンテンツフィルターボタンの
  // 現在の並び順(ドラッグでの並び替え結果を含む)を反映しているため、そのインデックスをそのまま使う。
  const contentSortRank = item => {
    const idx = others.indexOf(normalizeContType(item.contents));
    return idx === -1 ? others.length : idx;
  };

  const updateThemeButtonStyle = isDark => {
    const btn = $('themeToggleBtn');
    // ボタンの色は「押すと切り替わる先」の色を示す:ライト時は黒丸(押すとダークに)、ダーク時は白丸(押すとライトに)
    btn.classList.toggle('mode-to-dark', !isDark);
    btn.classList.toggle('mode-to-light', isDark);
    btn.setAttribute('aria-label', isDark ? '\u30E9\u30A4\u30C8\u30E2\u30FC\u30C9\u306B\u5207\u308A\u66FF\u3048' : '\u30C0\u30FC\u30AF\u30E2\u30FC\u30C9\u306B\u5207\u308A\u66FF\u3048');
  };

  if (localStorage.getItem('gl_log_theme') === 'dark') {
    document.body.classList.add('dark-mode');
  }
  updateThemeButtonStyle(document.body.classList.contains('dark-mode'));

  $('themeToggleBtn').onclick = () => {
    const isDark = document.body.classList.toggle('dark-mode');
    updateThemeButtonStyle(isDark);
    localStorage.setItem('gl_log_theme', isDark ? 'dark' : 'light');
  };

  if (localStorage.getItem('gl_log_collapsed') === 'true') {
    $('stickyHeader').classList.add('collapsed');
    $('toggleBtn').textContent = '\u25BC';
    $('activeFiltersRow').classList.add('is-open');
    $('filterSummaryToggleBtn').classList.add('is-active');
  }
  requestAnimationFrame(() => $('stickyHeader').classList.remove('is-initializing'));

  // FILTERボタンをユーザーが手動でOFFにしたかどうか。初期表示時の自動ONは対象外(falseのまま)で、
  // 一度でも手動でOFFにした後は、フィルターエリアを閉じても自動では再表示しないようにするためのフラグ
  let filterSummaryManuallyOff = false;

  $('toggleBtn').onclick = () => {
    const c = $('stickyHeader').classList.toggle('collapsed');
    $('toggleBtn').textContent = c ? '\u25BC' : '\u25B2';
    localStorage.setItem('gl_log_collapsed', c);
    // フィルターエリアを閉じた時は、一度も手動でFILTERボタンをOFFにしたことが無ければ「現在のフィルター
    // 一覧」を自動表示する(FILTERボタンをON扱いに)。一度でも手動でOFFにしていたら、その意思を尊重して
    // 自動では表示しない。開いた時はFILTERボタンの状態はそのままにする(閉じても開いてもFILTERボタンで
    // 独立にON/OFFできる)
    if (c && !filterSummaryManuallyOff) {
      $('activeFiltersRow').classList.add('is-open');
      $('filterSummaryToggleBtn').classList.add('is-active');
    }
  };

  // FILTERボタン:フィルターエリアが閉じている時に自動表示される「現在のフィルター一覧」を、
  // 開いている時でも任意のタイミングで表示/非表示できるようにする(フィルターエリアの開閉状態とは独立)
  $('filterSummaryToggleBtn').onclick = () => {
    const open = $('activeFiltersRow').classList.toggle('is-open');
    $('filterSummaryToggleBtn').classList.toggle('is-active', open);
    filterSummaryManuallyOff = !open;
  };

  // 錠前ボタン:既定はOFF(画面固定しない、通常スクロール)。ONにするとヘッダーが画面上部に固定される。
  const setHeaderLocked = (locked, persist) => {
    $('stickyHeader').classList.toggle('unlocked', !locked);
    $('lockToggleBtn').classList.toggle('is-active', locked);
    $('lockToggleBtn').textContent = locked ? '\uD83D\uDD12' : '\uD83D\uDD13';
    $('lockToggleBtn').setAttribute('aria-label', locked ? '\u30D8\u30C3\u30C0\u30FC\u56FA\u5B9A\u5207\u66FF(\u73FE\u5728ON)' : '\u30D8\u30C3\u30C0\u30FC\u56FA\u5B9A\u5207\u66FF(\u73FE\u5728OFF)');
    if (persist) localStorage.setItem('gl_log_header_locked', locked);
  };

  setHeaderLocked(localStorage.getItem('gl_log_header_locked') === 'true', false);

  $('lockToggleBtn').onclick = () => {
    setHeaderLocked(!$('lockToggleBtn').classList.contains('is-active'), true);
  };

  $('sortBtn').onclick = () => {
    desc = !desc;
    updateSortBtnLabel();
    updateDisplay(true);
  };

  const searchInput = $('searchInput');
  const searchClearBtn = $('searchClearBtn');
  const searchBoxWrap = searchInput.parentElement;
  const searchSuggestions = $('searchSuggestions');

  const updateSearchClearState = () => {
    if (searchInput.value.length > 0) {
      searchBoxWrap.classList.add('has-text');
    } else {
      searchBoxWrap.classList.remove('has-text');
    }
  };

  // セトリ検索モード中は検索窓のプレースホルダーの「keyword」部分を「song」に切り替える
  const SEARCH_PLACEHOLDER_NORMAL = 'search keyword';
  const SEARCH_PLACEHOLDER_SETLIST = 'search setlist song';
  const updateSearchPlaceholder = () => {
    searchInput.placeholder = setlistMode ? SEARCH_PLACEHOLDER_SETLIST : SEARCH_PLACEHOLDER_NORMAL;
  };

  // 検索窓:直近使った検索ワードを最大10件まで記憶し、フォーカス時に候補として表示する
  // セトリ検索モード中に入力された検索ワードは、通常検索とは別のキーで保存する(要件により分離)
  // 各ワードは🔑(固定)アイコンで固定でき、固定中は個別削除(×)が効かず、保存上限による
  // 自動的な押し出し(間引き)からも保護される。固定できる件数も保存上限と同じ10件まで。
  const RECENT_SEARCH_KEY = 'gl_log_recent_searches';
  const SETLIST_RECENT_SEARCH_KEY = 'gl_log_recent_setlist_searches';
  const MAX_RECENT_SEARCHES = 10;
  const MAX_PINNED_SEARCHES = 10;
  let highlightedSuggestionIndex = -1;
  const getRecentSearchKey = () => setlistMode ? SETLIST_RECENT_SEARCH_KEY : RECENT_SEARCH_KEY;
  // 旧形式(文字列の配列)で保存されている場合は{term, pinned:false}へ読み込み時に変換する(後方互換)
  const getRecentSearches = () => {
    try {
      const arr = JSON.parse(localStorage.getItem(getRecentSearchKey()) || '[]');
      if (!Array.isArray(arr)) return [];
      return arr.map(v => typeof v === 'string' ? { term: v, pinned: false } : { term: v.term, pinned: !!v.pinned });
    } catch {
      return [];
    }
  };
  const setRecentSearches = list => localStorage.setItem(getRecentSearchKey(), JSON.stringify(list));
  const saveRecentSearch = kw => {
    const trimmed = kw.trim();
    if (!trimmed) return;
    const list = getRecentSearches();
    const existing = list.find(v => v.term === trimmed);
    if (existing && existing.pinned) return; // 固定済みのワードは再検索されても順序・状態を変えない
    const pinnedList = list.filter(v => v.pinned);
    const unpinnedList = list.filter(v => !v.pinned && v.term !== trimmed);
    unpinnedList.unshift({ term: trimmed, pinned: false });
    // 保存上限(10件)を超えたら、固定されていないものだけを末尾から間引く(固定分は削らない)
    while (pinnedList.length + unpinnedList.length > MAX_RECENT_SEARCHES && unpinnedList.length) {
      unpinnedList.pop();
    }
    setRecentSearches([...pinnedList, ...unpinnedList]);
  };
  const removeRecentSearch = term => {
    const list = getRecentSearches();
    const entry = list.find(v => v.term === term);
    if (entry && entry.pinned) return; // 固定中は削除不可
    setRecentSearches(list.filter(v => v.term !== term));
  };
  // 🔑(固定)⇔🔐(固定中、押すと解除)の切り替え。固定は最大10件まで
  const togglePinRecentSearch = term => {
    const list = getRecentSearches();
    const idx = list.findIndex(v => v.term === term);
    if (idx === -1) return;
    const willPin = !list[idx].pinned;
    if (willPin && list.filter(v => v.pinned).length >= MAX_PINNED_SEARCHES) return;
    list[idx] = { term: list[idx].term, pinned: willPin };
    // 固定済みを常に上側にまとめて表示する(固定/解除どちらの操作でも並びを整える)
    const pinnedList = list.filter(v => v.pinned);
    const unpinnedList = list.filter(v => !v.pinned);
    setRecentSearches([...pinnedList, ...unpinnedList]);
  };
  const getSuggestionButtons = () => Array.from(searchSuggestions.querySelectorAll('.search-suggestion-term'));
  const highlightSuggestion = index => {
    const btns = getSuggestionButtons();
    highlightedSuggestionIndex = index;
    btns.forEach(b => b.parentElement.classList.remove('is-highlighted'));
    if (index >= 0 && index < btns.length) {
      btns[index].parentElement.classList.add('is-highlighted');
      try { btns[index].scrollIntoView({ block: 'nearest' }); } catch {}
    }
  };
  const applySuggestion = term => {
    searchInput.value = term;
    updateSearchClearState();
    saveRecentSearch(term);
    searchSuggestions.classList.remove('is-open');
    syncTodayModeFromSearch(); // 年月日8桁の候補が選ばれた場合もTODAYモードに反映する
    if (setlistMode) {
      autoUpdateContentTypeFilters();
      updateManualIndicators();
    }
    updateDisplay(true);
  };
  // 入力中のデータサジェスト:クエリ文字列で前方一致する候補を最大MAX_DATA_SUGGESTIONS件集める。
  // 通常検索モード中はログのtitle/tagsを、セトリ検索モード中はsongs.jsonの曲名(title)を候補ソースとする。
  // 大文字小文字は区別しない。先頭からPREFIX_DEDUPE_LEN文字が一致するものは重複とみなして除外する
  // (seenPrefixesに含まれる先頭一致分〈履歴側で採用済みのもの等〉も同様に除外)。
  const MAX_DATA_SUGGESTIONS = 5;
  const PREFIX_DEDUPE_LEN = 10;
  const dedupePrefixKey = s => s.toLowerCase().slice(0, PREFIX_DEDUPE_LEN);
  // 文字列中の最初の「#」以降、末尾まで数値で終わっている場合、その「#...数値」部分を候補表示から除外し、
  // #より前の部分だけを残す(例:「新春ライブ#2026」→「新春ライブ」。#の後ろが数値で終わっていない
  // 場合は変更しない)
  const stripHashNumberSuffix = s => {
    const idx = s.indexOf('#');
    if (idx === -1) return s;
    const after = s.slice(idx).trim();
    if (/^#\S*\d$/.test(after)) return s.slice(0, idx).trim();
    return s;
  };
  const collectDataSuggestions = (query, seenPrefixes) => {
    const result = [];
    const seen = new Set(seenPrefixes);
    const tryAdd = term => {
      if (!term) return false;
      const t = stripHashNumberSuffix(String(term).trim());
      if (!t) return false;
      const lower = t.toLowerCase();
      if (!lower.startsWith(query)) return false;
      const key = dedupePrefixKey(t);
      if (seen.has(key)) return false;
      seen.add(key);
      result.push(t);
      return result.length >= MAX_DATA_SUGGESTIONS;
    };
    if (setlistMode) {
      for (const s of songsData) {
        if (tryAdd(s.title)) break;
      }
    } else {
      outer:
      for (const item of logs) {
        if (tryAdd(item.title)) break outer;
        if (Array.isArray(item.tags)) {
          for (const tag of item.tags) {
            if (tryAdd(tag)) break outer;
          }
        }
      }
    }
    return result;
  };

  // データサジェスト用の候補行(クリックで即検索実行するのみ。固定/削除ボタンは無し)を生成する
  const createDataSuggestionRow = term => {
    const row = document.createElement('div');
    row.className = 'search-suggestion-row';
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'search-suggestion-term';
    btn.textContent = term;
    btn.onmousedown = e => {
      e.preventDefault();
      applySuggestion(term);
    };
    row.appendChild(btn);
    return row;
  };

  const renderSearchSuggestions = () => {
    // フォーカスが外れている間の遅延実行(デバウンス後)で誤って再表示しないようにする
    if (document.activeElement !== searchInput) {
      searchSuggestions.classList.remove('is-open');
      return;
    }
    const rawQuery = searchInput.value.trim();
    const query = rawQuery.toLowerCase();
    const historyList = getRecentSearches();
    // 入力が空でも入力中でも、履歴は先頭からPREFIX_DEDUPE_LEN文字が同じものを重複とみなして先着(固定済みが
    // 先頭に来る並び順のため、固定済み優先)のものだけ残す。入力中はさらに前方一致するものだけに絞り込む。
    // その後、データサジェストを「履歴→データ」の順で混ぜて表示する(データサジェストも同じ基準で重複除外)
    const seenPrefixes = new Set();
    const filteredHistory = [];
    historyList.forEach(entry => {
      if (query && !entry.term.toLowerCase().startsWith(query)) return;
      const key = dedupePrefixKey(entry.term);
      if (seenPrefixes.has(key)) return;
      seenPrefixes.add(key);
      filteredHistory.push(entry);
    });
    const dataSuggestions = query ? collectDataSuggestions(query, seenPrefixes) : [];

    searchSuggestions.textContent = '';
    highlightedSuggestionIndex = -1;
    if (!filteredHistory.length && !dataSuggestions.length) {
      searchSuggestions.classList.remove('is-open');
      return;
    }
    filteredHistory.forEach(entry => {
      const term = entry.term;
      const pinned = entry.pinned;
      const row = document.createElement('div');
      row.className = 'search-suggestion-row' + (pinned ? ' is-pinned' : '');

      // 固定(🔑)⇔固定中(🔐)アイコン:押すと固定状態をトグルする(検索は実行しない)
      const pinBtn = document.createElement('button');
      pinBtn.type = 'button';
      pinBtn.className = 'search-suggestion-pin';
      pinBtn.textContent = pinned ? '\uD83D\uDD10' : '\uD83D\uDD11';
      pinBtn.setAttribute('aria-label', pinned ? '\u56FA\u5B9A\u3092\u89E3\u9664' : '\u56FA\u5B9A\u3059\u308B');
      pinBtn.onmousedown = e => {
        e.preventDefault(); // inputのblurを起こさない
        e.stopPropagation();
        togglePinRecentSearch(term);
        renderSearchSuggestions();
        searchInput.focus(); // 操作後も検索窓のフォーカス・候補表示を維持する
      };

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'search-suggestion-term';
      btn.textContent = term;
      // mousedownで反応させる(inputのblurより先に発火させ、候補クリックが確実に効くようにするため)
      btn.onmousedown = e => {
        e.preventDefault();
        applySuggestion(term);
      };

      // 個別削除ボタン:タップ/クリックでその履歴だけを削除する(検索は実行しない)。固定中は非表示(CSS側で制御)
      const delBtn = document.createElement('button');
      delBtn.type = 'button';
      delBtn.className = 'search-suggestion-delete';
      delBtn.textContent = '\u00D7';
      delBtn.setAttribute('aria-label', 'Delete');
      delBtn.onmousedown = e => {
        e.preventDefault(); // inputのblurを起こさない
        e.stopPropagation();
        removeRecentSearch(term);
        renderSearchSuggestions();
        searchInput.focus(); // 削除後も検索窓のフォーカス・候補表示を維持する
      };

      row.append(pinBtn, btn, delBtn);
      searchSuggestions.appendChild(row);
    });
    dataSuggestions.forEach(term => {
      searchSuggestions.appendChild(createDataSuggestionRow(term));
    });
    searchSuggestions.classList.add('is-open');
  };
  searchInput.addEventListener('focus', () => {
    renderSearchSuggestions();
  });
  searchInput.addEventListener('blur', () => {
    searchSuggestions.classList.remove('is-open');
    if (searchInput.value.trim()) saveRecentSearch(searchInput.value);
  });

  searchInput.oninput = () => {
    updateSearchClearState();
    searchSuggestions.classList.remove('is-open'); // 入力の度に一旦候補を閉じ、デバウンス後に最新の内容で再表示する
    syncTodayModeFromSearch(); // 年月日8桁の入力/削除に応じてTODAYモードをON/OFFする
    clearTimeout(timer);
    timer = setTimeout(() => {
      renderSearchSuggestions(); // 履歴の前方一致分＋データサジェストを入力内容に応じて再表示する
      // セトリ検索モード中は、検索ワードの変化に応じてコンテンツ種類フィルターも自動on/offする
      if (setlistMode) {
        autoUpdateContentTypeFilters();
        updateManualIndicators();
      }
      updateDisplay(true);
    }, 180);
  };
  searchInput.addEventListener('keydown', e => {
    const isOpen = searchSuggestions.classList.contains('is-open');
    const btns = getSuggestionButtons();

    if (isOpen && btns.length && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
      e.preventDefault();
      const next = e.key === 'ArrowDown'
        ? (highlightedSuggestionIndex < btns.length - 1 ? highlightedSuggestionIndex + 1 : 0)
        : (highlightedSuggestionIndex > 0 ? highlightedSuggestionIndex - 1 : btns.length - 1);
      highlightSuggestion(next);
      return;
    }

    if (isOpen && highlightedSuggestionIndex >= 0 && btns[highlightedSuggestionIndex]) {
      // ハイライト中の候補をDeleteキーで削除する(履歴由来の候補のみ対象。データサジェスト行には削除ボタンが
      // 無いため、そのことを目印に判定し、データサジェストの場合は何もしない)
      if (e.key === 'Delete') {
        e.preventDefault();
        const targetIndex = highlightedSuggestionIndex;
        const targetRow = btns[targetIndex].parentElement;
        if (targetRow.querySelector('.search-suggestion-delete')) {
          removeRecentSearch(btns[targetIndex].textContent);
          renderSearchSuggestions();
          const newBtns = getSuggestionButtons();
          if (newBtns.length) highlightSuggestion(Math.min(targetIndex, newBtns.length - 1));
        }
        return;
      }
      if (e.key === 'Enter') {
        e.preventDefault();
        applySuggestion(btns[highlightedSuggestionIndex].textContent);
        searchInput.blur(); // スマホの仮想キーボードも閉じる
        return;
      }
    }

    if (e.key === 'Escape' && isOpen) {
      searchSuggestions.classList.remove('is-open');
      return;
    }

    if (e.key === 'Enter' && searchInput.value.trim()) {
      saveRecentSearch(searchInput.value);
    }
    // Enter(スマホ版の仮想キーボードの→/決定キーも同じキーイベントとして届く)で検索履歴・サジェスト候補を
    // 閉じ、スマホの仮想キーボードも閉じる
    if (e.key === 'Enter') {
      searchSuggestions.classList.remove('is-open');
      searchInput.blur();
    }
  });

  searchClearBtn.onclick = () => {
    searchInput.value = '';
    updateSearchClearState();
    syncTodayModeFromSearch(); // クリアで日付ではなくなるのでTODAYモードもOFFに戻す
    if (setlistMode) {
      autoUpdateContentTypeFilters();
      updateManualIndicators();
    }
    updateDisplay(true);
    searchInput.focus();
  };

  window.onkeydown = e => {
    if ((e.key === '/' || (e.ctrlKey && e.key.toLowerCase() === 'k')) && document.activeElement !== searchInput) {
      e.preventDefault();
      searchInput.focus();
      searchInput.select();
    }
  };

  window.onscroll = () => $('toTopBtn').classList.toggle('is-visible', window.scrollY > 300);
  $('toTopBtn').onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });

  // ヘルプ(?)・設定(⚙)ボタン:どちらもセットリストポップアップと同じズーム+フェードで開閉する
  // 汎用ポップアップ。中身(popup-body)は現時点では空のままでよい。
  const bindSimplePopup = (btnId, overlayId, closeBtnId) => {
    const overlay = $(overlayId);
    const open = () => overlay.classList.add('is-open');
    const close = () => overlay.classList.remove('is-open');
    $(btnId).onclick = open;
    $(closeBtnId).onclick = close;
    overlay.onclick = e => {
      if (e.target === overlay) close(); // オーバーレイ部分クリックで閉じる(中身のクリックでは閉じない)
    };
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && overlay.classList.contains('is-open')) close();
    });
    return close;
  };
  bindSimplePopup('helpBtn', 'helpModalOverlay', 'helpModalCloseBtn');
  bindSimplePopup('settingsBtn', 'settingsModalOverlay', 'settingsModalCloseBtn');

  let isMobileState = window.innerWidth <= 600;
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      const nowMobile = window.innerWidth <= 600;
      if (nowMobile !== isMobileState) {
        isMobileState = nowMobile;
        updateDisplay(false);
      }
      if ($('songBar').classList.contains('is-open')) updateSongTickerScroll();
    }, 200);
  });

  const createItemNode = item => {
    const w = document.createElement('div');
    w.className = 'item';
    const sc = document.createElement('div');
    sc.className = 'item-scroll-container';
    
    const d = document.createElement('span');
    d.className = 'item-date';
    d.textContent = formatDisplayDate(item);

    // 今日の日付の行を目立たせる(チップ風の背景)。TODAYモード中は全行が「今日」になり意味が無いため対象外。
    // 年月日曜日をすべて非表示にしていて文字が空の場合は、空のチップが出ないよう対象外にする
    const isTodayDate = !todayMode && item.date === getTargetDateStr(0) && d.textContent !== '';
    if (isTodayDate) d.classList.add('is-today-date');

    // 時刻は日付と別要素にして、未設定の行でも"00:00"と同じ幅を確保したまま見た目だけブランクにする
    // (幅を確保しないと、後ろのコンテンツ種類アイコン等が左にずれて見えるため)
    let tm = null;
    if (dateParts.time) {
      const t = formatTimeStr(item.time);
      tm = document.createElement('span');
      tm.className = 'item-time';
      tm.textContent = t || '00:00';
      if (!t) tm.classList.add('is-blank');
      if (isTodayDate) tm.classList.add('is-today-date');
    }
    
    const ct = document.createElement('span');
    ct.className = 'item-contents';
    if (item.contents) {
      // アイコンは常に専用の固定幅の箱(item-contents-icon)に入れる。この箱の幅・中央寄せは開閉状態に
      // 関わらず常に同じなので、枠(item-contents)自体が広がってもアイコンの描画位置はずれない。
      // コンテンツ名はアイコンの右側に続くitem-contents-nameに入れ、閉じている間はDOM上に置かない。
      const contentsName = displayNameFor(item.contents);
      const iconText = symbols[item.contents] || contentsName; // 絵文字が無い種類は名前そのものをアイコン代わりに使う(従来仕様通り)
      const hasSymbol = !!symbols[item.contents];
      // スマホ版・ICONモードONはアイコンのみ、それ以外(PC版・ICONモードOFF)は「アイコン + コンテンツ名」を常時表示
      const showNameByDefault = !(isMobileState || iconMode) && hasSymbol;

      const ctIcon = document.createElement('span');
      ctIcon.className = 'item-contents-icon';
      ctIcon.textContent = iconText;
      ct.appendChild(ctIcon);

      let ctName = null;
      if (hasSymbol) {
        ctName = document.createElement('span');
        ctName.className = 'item-contents-name';
        ctName.textContent = contentsName;
        ctName.style.display = showNameByDefault ? '' : 'none';
        ct.appendChild(ctName);
      }

      ct.classList.add('is-clickable');
      ct.tabIndex = -1; // データ部のアイコンはTab移動の対象にしない(クリック/タップでは従来通り開閉可能)
      ct.setAttribute('role', 'button');
      ct.setAttribute('aria-expanded', String(showNameByDefault));
      const contentKey = itemKeyFor(item);

      // PC通常表示(ICONモードOFF)は既に常時コンテンツ名を表示しているため、これ以上開閉させる意味が無い。
      // 絵文字が無い種類も、アイコン枠に名前をそのまま表示済みで追加表示するものが無いため、対象外とする。
      const canToggle = hasSymbol && !showNameByDefault;

      if (canToggle) {
        // 開く:コンテンツ名を表示した上で、枠全体の実際の横幅を計測し、ちょうど収まる幅(上限11.5em)まで
        // 枠を広げる。DOM挿入直後は幅の計測ができないため、描画完了後の次フレームで計測する
        // (通常クリック時は体感できない遅延)。アイコン自体はitem-contents-iconの固定幅内で動かない。
        const openContentBox = () => {
          ct.classList.add('is-content-open');
          ctName.style.display = '';
          ct.setAttribute('aria-expanded', 'true');
          requestAnimationFrame(() => {
            if (!ct.isConnected || !ct.classList.contains('is-content-open')) return;
            const targetPx = measureContentOpenWidthPx(ct);
            ct.style.flexBasis = targetPx + 'px';
          });
        };
        // 閉じる:コンテンツ名を隠し、幅の指定も解除して現在の表示モード基準の幅に戻す
        const closeContentBox = () => {
          ct.classList.remove('is-content-open');
          ctName.style.display = 'none';
          ct.style.flexBasis = '';
          ct.setAttribute('aria-expanded', 'false');
        };

        if (expandedContentKeys.has(contentKey)) openContentBox();

        const toggleContentExpand = () => {
          // この行だけの開閉状態をキーで記録する(他の行の展開状態には影響しない)
          if (ct.classList.contains('is-content-open')) {
            closeContentBox();
            expandedContentKeys.delete(contentKey);
          } else {
            openContentBox();
            expandedContentKeys.add(contentKey);
          }
        };
        ct.addEventListener('click', toggleContentExpand);
        ct.addEventListener('keydown', e => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            toggleContentExpand();
          }
        });
      } else {
        ct.classList.remove('is-clickable');
        ct.removeAttribute('role');
        ct.removeAttribute('aria-expanded');
        ct.removeAttribute('tabindex');
      }
    } else {
      ct.textContent = '';
    }

    // http(s)始まりのURLのみリンク化する(javascript:等の危険なスキームを弾く簡易バリデーション)
    const hasUrl = !!(item.url && /^https?:\/\//i.test(item.url.trim()));
    const t = document.createElement(hasUrl ? 'a' : 'span');
    t.className = 'item-title';
    t.tabIndex = -1; // データ部の文章はTab移動の対象にしない(クリック/タップでは従来通り操作可能)
    if (hasUrl) {
      t.href = item.url;
      t.target = '_blank';
      t.rel = 'noopener noreferrer';
    } else {
      t.classList.add('no-url');
    }
    // 表示テキストの優先順位:スマホ版はdisplay_sp→display_pc→title、PC版はdisplay_pc→titleの順にフォールバックする
    const rawDisplayText = (isMobileState ? (item.display_sp || item.display_pc || item.title) : (item.display_pc || item.title) || '');
    // BIRTHDAYの年別複製アイテム(_birthYear付き)の場合のみ、「名前　誕生日」を「名前　N歳の誕生日」に置換する
    t.textContent = applyBirthdayAgeText(item, rawDisplayText).trim();

    const teamClass = getTeamClass(item);
    // MAPモードON時のみ、mapに有効なhttp(s)リンクがある場合に📍アイコンをリンク化して表示する(値が無ければ何も表示しない)
    let mp = null;
    if (mapMode) {
      const hasMap = !!(item.map && /^https?:\/\//i.test(item.map.trim()));
      mp = document.createElement(hasMap ? 'a' : 'span');
      mp.className = 'map-pin';
      mp.tabIndex = -1; // データ部のアイコンはTab移動の対象にしない
      mp.textContent = '\uD83D\uDCCD'; // map値の有無にかかわらず同じ幅を確保するため、常にアイコン文字を入れておく
      if (hasMap) {
        mp.href = item.map;
        mp.target = '_blank';
        mp.rel = 'noopener noreferrer';
      }
    }

    // SETLISTアイコン表示:①セトリ検索モード中(従来通り)、②📋️ボタン(setlistIconMode)ON中、のいずれかで
    // 📍の右に表示する。押すとセットリストをポップアップ表示する。
    // setlistIconMode時は📍(mapMode)と同じ考え方で、setlistidが無い行もアイコン要素自体は作り、
    // 幅だけ確保して見た目を隠す(is-blank)。セトリ検索モードのみがONの場合は従来通りsetlistidが無い行は要素を作らない。
    let sl = null;
    if (setlistIconMode) {
      const hasSetlistId = !!item.setlistid;
      sl = document.createElement('span');
      sl.className = 'setlist-icon' + (hasSetlistId ? '' : ' is-blank');
      sl.tabIndex = -1; // データ部のアイコンはTab移動の対象にしない
      sl.textContent = '\uD83D\uDCCB\uFE0F'; // setlistidの有無にかかわらず同じ幅を確保するため、常にアイコン文字を入れておく
      if (hasSetlistId) {
        sl.setAttribute('role', 'button');
        sl.setAttribute('aria-label', 'Setlist');
        sl.onclick = e => {
          e.stopPropagation();
          openSetlistModal(item.setlistid);
        };
      }
    } else if (setlistMode && item.setlistid) {
      sl = document.createElement('span');
      sl.className = 'setlist-icon';
      sl.tabIndex = -1; // データ部のアイコンはTab移動の対象にしない
      sl.textContent = '\uD83D\uDCCB\uFE0F';
      sl.setAttribute('role', 'button');
      sl.setAttribute('aria-label', 'Setlist');
      sl.onclick = e => {
        e.stopPropagation();
        openSetlistModal(item.setlistid);
      };
    }

    const dateChildren = tm ? [d, tm] : [d];
    const children = [...dateChildren, ...(mp ? [mp] : []), ...(sl ? [sl] : []), ct];
    if (teamClass) {
      const ti = document.createElement('span');
      ti.className = 'team-icon team-' + teamClass;

      // groups内のメンバーコードのうち、名前が判明しているものだけを固定の表示順(heartOrder)で抽出する
      const memberCodes = heartOrder.filter(v => (item.groups || []).includes(v));
      if (memberCodes.length) {
        const hearts = document.createElement('span');
        hearts.className = 'team-hearts';
        // 四角(マーカー)はteam-both(G2/L2混在)の行のみ、G2/L2それぞれの最初のハートに直接クラスを付けて
        // CSSでバッジのように重ねて表示する(独立した別枠にすると、四角の有無でハートの位置がずれてしまうため)
        let g2MarkerAdded = false, l2MarkerAdded = false;
        memberCodes.forEach(code => {
          const info = memberInfoByCode[code];
          if (!info) return;
          const h = document.createElement('span');
          h.className = 'team-heart';
          if (teamClass === 'both') {
            if (!g2MarkerAdded && g2MemberCodes.has(code)) {
              h.classList.add('group-start-g2');
              g2MarkerAdded = true;
            } else if (!l2MarkerAdded && l2MemberCodes.has(code)) {
              h.classList.add('group-start-l2');
              l2MarkerAdded = true;
            }
          }
          h.textContent = info.c;
          hearts.appendChild(h);
        });

        ti.classList.add('is-clickable');
        ti.tabIndex = -1; // データ部のアイコンはTab移動の対象にしない(クリック/タップでは従来通り開閉可能)
        ti.setAttribute('role', 'button');
        ti.setAttribute('aria-expanded', 'false');
        if (heartModeOn) {
          hearts.classList.add('is-open');
          ti.setAttribute('aria-expanded', 'true');
        }
        const toggleHearts = () => {
          const isOpen = hearts.classList.toggle('is-open');
          ti.setAttribute('aria-expanded', String(isOpen));
          refreshHeartModeState();
        };
        ti.addEventListener('click', toggleHearts);
        ti.addEventListener('keydown', e => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            toggleHearts();
          }
        });

        children.push(ti, hearts);
      } else {
        children.push(ti);
      }
    }
    children.push(t);

    sc.append(...children);
    w.append(sc);
    return w;
  };

  const renderBatch = () => {
    if (rendered >= filtered.length) return;
    requestAnimationFrame(() => {
      const frag = document.createDocumentFragment();
      const next = Math.min(rendered + pageSize, filtered.length);
      for (let i = rendered; i < next; i++) {
        frag.appendChild(createItemNode(filtered[i]));
      }
      $('items').appendChild(frag);
      rendered = next;
    });
  };

  new IntersectionObserver(entries => {
    entries.forEach(en => en.isIntersecting && renderBatch());
  }, { rootMargin: '300px' }).observe($('scrollSentinel'));

  // PC(マウス操作)でも、省略されているタイトルをドラッグで水平スクロールして見られるようにする
  (() => {
    let dragEl = null, startX = 0, scrollStart = 0, dragged = false;
    const DRAG_THRESHOLD = 5;

    $('items').addEventListener('mousedown', e => {
      const target = e.target.closest('.item-title');
      if (!target) return;
      dragEl = target;
      startX = e.pageX;
      scrollStart = target.scrollLeft;
      dragged = false;
    });

    window.addEventListener('mousemove', e => {
      if (!dragEl) return;
      const dx = e.pageX - startX;
      if (Math.abs(dx) > DRAG_THRESHOLD) {
        if (!dragged) dragEl.classList.add('is-dragging');
        dragged = true;
      }
      if (dragged) {
        dragEl.scrollLeft = scrollStart - dx;
        e.preventDefault();
      }
    });

    window.addEventListener('mouseup', () => {
      if (dragEl) dragEl.classList.remove('is-dragging');
      dragEl = null;
    });

    // ドラッグ操作の後にリンク遷移してしまわないよう抑制する
    $('items').addEventListener('click', e => {
      const target = e.target.closest('.item-title');
      if (target && dragged) {
        e.preventDefault();
        dragged = false;
      }
    }, true);
  })();

  const renderActiveBadges = (checked, kw) => {
    $('activeFiltersRow').textContent = '';
    const frag = document.createDocumentFragment();

        updateSearchClearState();
        syncTodayModeFromSearch(); // 検索ワード削除でTODAYモードもOFFに戻す
        if (setlistMode) {
          autoUpdateContentTypeFilters();
          updateManualIndicators();
        }

      frag.appendChild(makeBadge(name, () => {

    $('activeFiltersRow').appendChild(frag);
  };

  // 検索キーワードのAND/NOT/OR判定:スペース区切りでAND、先頭に「-」でNOT、「|」区切りでOR。
  // 加えて単語区切りの" AND "/" and "/" OR "/" or "も同じ意味の演算子として使えるようにする
  // (" and "はスペース区切りと同じ意味なので読み飛ばすだけ、" or "は"|"に変換する)。
  // 例:"A B|C" も "A AND B OR C" も「(AかつB) または C」として判定する(OR優先度が最も低い)。
  const matchesSearchKeyword = (searchText, kw) => {
    const normalizedKw = kw
      .replace(/(^|\s)or(?=\s|$)/gi, '$1|')
      .replace(/(^|\s)and(?=\s|$)/gi, '$1');
    const orGroups = normalizedKw.split('|').map(g => g.trim()).filter(Boolean);

    // マイナス検索(-キーワード)は、OR句のどちらに書かれていても常に全体に効くようにする。
    // 例:「A or B -C」は「(AまたはB) かつ Cを含まない」という意味にしたいが、OR句ごとに独立して
    // 除外判定すると、-Cが書かれていない側の句(A)がマッチした場合にCの除外が効かなくなってしまう。
    // そのため、-トークンは句を問わず全て集めてグローバルな除外条件として先に判定する。
    const globalExcludeTokens = [];
    const positiveGroups = orGroups
      .map(group => {
        const tokens = group.split(/\s+/).filter(Boolean);
        const positiveTokens = [];
        tokens.forEach(tok => {
          if (tok.length > 1 && tok.startsWith('-')) globalExcludeTokens.push(tok.slice(1));
          else positiveTokens.push(tok);
        });
        return positiveTokens;
      })
      .filter(tokens => tokens.length > 0); // マイナス検索のみだった句(プラス条件を持たない句)は除外して扱う

    if (globalExcludeTokens.some(ex => searchText.includes(ex))) return false;
    if (positiveGroups.length === 0) return true; // 全ての句がマイナス検索のみだった場合、除外条件は上で判定済み
    return positiveGroups.some(tokens => tokens.every(tok => searchText.includes(tok)));
  };

  const parseDateQuery = rawKw => {
    let isDateQuery = false;
    let targetMonthDay = null;
    let targetMonthDayRange = null;
    let startDate = null, endDate = null;

    const isValidMD = s => {
      if (!s || s.length !== 4) return false;
      const m = parseInt(s.slice(0, 2), 10), d = parseInt(s.slice(2, 4), 10);
      return m >= 1 && m <= 12 && d >= 1 && d <= 31;
    };

    const rangeMatch = rawKw.match(/^(\d{4,8})?-(\d{4,8})?$/);
    if (rangeMatch && (rangeMatch[1] || rangeMatch[2])) {
      isDateQuery = true;
      const p1 = rangeMatch[1], p2 = rangeMatch[2];

      const p1IsMD = !!(p1 && isValidMD(p1));
      const p2IsMD = !!(p2 && isValidMD(p2));

      if ((p1IsMD || !p1) && (p2IsMD || !p2) && (p1IsMD || p2IsMD)) {
        targetMonthDayRange = [p1IsMD ? p1 : '0101', p2IsMD ? p2 : '1231'];
      } else {
        if (p1) {
          if (p1.length === 4) startDate = p1 + '0101';
          else if (p1.length === 6) startDate = p1 + '01';
          else startDate = p1;
        }
        if (p2) {
          if (p2.length === 4) endDate = p2 + '1231';
          else if (p2.length === 6) {
            const y = parseInt(p2.slice(0, 4), 10);
            const m = parseInt(p2.slice(4, 6), 10);
            const lastDay = new Date(y, m, 0).getDate();
            endDate = p2 + String(lastDay).padStart(2, '0');
          } else endDate = p2;
        }
      }
    } else if (/^\d{4}$/.test(rawKw)) {
      const m = parseInt(rawKw.slice(0, 2), 10);
      const d = parseInt(rawKw.slice(2, 4), 10);
      const isValidMD2 = m >= 1 && m <= 12 && d >= 1 && d <= 31;

      if (isValidMD2) {
        isDateQuery = true;
        targetMonthDay = rawKw;
      } else {
        isDateQuery = true;
        startDate = rawKw + '0101';
        endDate = rawKw + '1231';
      }
    } else if (/^\d{6}$/.test(rawKw)) {
      isDateQuery = true;
      startDate = rawKw + '01';
      const y = parseInt(rawKw.slice(0, 4), 10);
      const m = parseInt(rawKw.slice(4, 6), 10);
      const lastDay = new Date(y, m, 0).getDate();
      endDate = rawKw + String(lastDay).padStart(2, '0');
    } else if (/^\d{8}$/.test(rawKw)) {
      isDateQuery = true;
      startDate = rawKw;
      endDate = rawKw;
    }

    return { isDateQuery, targetMonthDay, targetMonthDayRange, startDate, endDate };
  };

  // rawKwの中から「日付として解釈できる1トークン」を空白区切りで探して抜き出し、日付クエリ(dq)と
  // 残りのキーワード文字列(remainingKw)に分割する。日付トークンが見つからなければdq.isDateQueryは
  // falseのままで、remainingKwには元の文字列全体が入る(＝従来通りの単純なテキスト検索)。
  // 例:"20260101-20260102 -あけまして" → 日付範囲(1/1〜1/2) + 残りキーワード"-あけまして"(NOT検索)
  const extractDateQuery = rawKw => {
    const tokens = rawKw.split(/\s+/).filter(Boolean);
    let dq = { isDateQuery: false, targetMonthDay: null, targetMonthDayRange: null, startDate: null, endDate: null };
    let dateToken = '';
    let dateTokenIndex = -1;
    for (let i = 0; i < tokens.length; i++) {
      const candidate = parseDateQuery(tokens[i]);
      if (candidate.isDateQuery) { dq = candidate; dateToken = tokens[i]; dateTokenIndex = i; break; }
    }
    const remainingKw = (dateTokenIndex === -1 ? tokens : tokens.filter((_, i) => i !== dateTokenIndex)).join(' ').toLowerCase();
    return { dq, dateToken: dateToken.toLowerCase(), remainingKw };
  };

  // セトリ検索モード:setlist.jsonのsongs[].titleをkwで部分一致検索し、該当する公演のsetlistidの集合を返す
  const getMatchedSetlistIds = kw => {
    const result = new Set();
    setlistData.forEach(entry => {
      const hit = (Array.isArray(entry.songs) ? entry.songs : []).some(s => (s.title || '').toLowerCase().includes(kw));
      if (hit) result.add(entry.setlistid);
    });
    return result;
  };

  // セトリ検索モード中のアイテム判定:setlistidを持つデータのみが対象。
  // キーワード未入力時は「setlistidを持つデータすべて」、入力時は該当曲を含む公演のみに絞り込む
  const isSetlistOk = (item, kw, setlistIds) => {
    if (!item.setlistid) return false;
    if (!kw) return true;
    return setlistIds.has(item.setlistid);
  };

  // SETLISTアイコン押下時のポップアップ:setlistidに紐づくsetlist.jsonのデータを整形して表示する
  const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  // songsのtype値と実際の表示文言が異なるものだけここに登録する(それ以外はtype値そのものを表示する)
  const setlistTypeDisplayNames = {
    'allow': '\u64AE\u5F71\u53EF\u80FD',
    'mc': 'MC',
    'encore': '\u30A2\u30F3\u30B3\u30FC\u30EB',
    'cover': '\u30AB\u30D0\u30FC',
    'dt': '\u30C0\u30F3\u30B9\u30C8\u30E9\u30C3\u30AF',
    'medley': '\u30E1\u30C9\u30EC\u30FC'
  };
  const displayNameForSetlistType = t => setlistTypeDisplayNames[t] || t;
  // setlistidは"YYYYMMDDHHMM"(公演の開演日時)形式。データ部と同じ表示形式(年.月.日 [曜]、時:分)に分解する
  const formatSetlistDateTime = setlistid => {
    if (!/^\d{12}$/.test(setlistid || '')) return { dateStr: '', timeStr: '' };
    const y = setlistid.slice(0, 4), m = setlistid.slice(4, 6), d = setlistid.slice(6, 8);
    const hh = setlistid.slice(8, 10), mm = setlistid.slice(10, 12);
    const dateObj = new Date(parseInt(y, 10), parseInt(m, 10) - 1, parseInt(d, 10));
    const dayStr = isNaN(dateObj.getTime()) ? '' : dayNames[dateObj.getDay()];
    const dateStr = `${y}.${m}.${d}` + (dayStr ? ` [${dayStr}]` : '');
    const timeStr = `${hh}:${mm}`;
    return { dateStr, timeStr };
  };
  // type:songの曲名でsongs.jsonを完全一致検索し(前後空白・大小文字は無視)、Youtube等へのlinkを取得する
  const findSongLinkByTitle = title => {
    const norm = t => (t || '').trim().toLowerCase();
    const target = norm(title);
    if (!target) return null;
    const found = songsData.find(s => norm(s.title) === target);
    return found && found.link ? found.link : null;
  };
  const setlistModalOverlay = $('setlistModalOverlay');
  const setlistModalBody = $('setlistModalBody');
  // ポップアップ内はinnerHTMLで再生成するため、再生ボタンのクリックはイベント委譲で拾う
  setlistModalBody.addEventListener('click', e => {
    const btn = e.target.closest('.setlist-song-play-btn[data-link]');
    if (!btn) return;
    e.stopPropagation();
    openSongLink(btn.dataset.link);
  });
  const openSetlistModal = setlistid => {
    const entry = setlistData.find(e => e.setlistid === setlistid);
    if (!entry) {
      setlistModalBody.innerHTML = '<div class="setlist-modal-empty">SETLIST NOT FOUND</div>';
      setlistModalOverlay.classList.add('is-open');
      return;
    }
    try {
      const songsHtml = (Array.isArray(entry.songs) ? entry.songs : [])
        // 文字列だけの要素(""など)や、titleが空のオブジェクトは「曲ではない」として除外する
        .filter(s => s && typeof s === 'object' && String(s.title || '').trim() !== '')
        .slice()
        .sort((a, b) => (a.order || 0) - (b.order || 0))
        .map(s => {
          // typeに関わらずtitle一致だけで再生ボタンの有無を決める
          const link = findSongLinkByTitle(s.title);
          const playBtnHtml = link
            ? `<span class="setlist-song-play-btn" data-link="${escapeHtml(link)}" role="button" aria-label="Play">\u25B6</span>`
            : `<span class="setlist-song-play-btn is-hidden" aria-hidden="true">\u25B6</span>`;
          const typeBadge = s.type && s.type !== 'song' ? `<span class="setlist-song-type">${escapeHtml(displayNameForSetlistType(s.type))}</span>` : '';
          const notesHtml = s.notes ? `<span class="setlist-song-notes">${escapeHtml(s.notes)}</span>` : '';
          const titleText = s.original ? `${escapeHtml(s.title || '')}\uFF08${escapeHtml(s.original)}\uFF09` : escapeHtml(s.title || '');
          return `<li><span class="setlist-song-order">${s.order != null ? s.order : ''}</span>${playBtnHtml}<span class="setlist-song-title">${titleText}</span>${typeBadge}${notesHtml}</li>`;
        })
        .join('');
      setlistModalBody.innerHTML =
        `<div class="setlist-modal-title">${escapeHtml(entry.title || '')}</div>` +
        (() => {
          const memberList = Array.isArray(entry.member) ? entry.member : [];
          const memberCodes = heartOrder.filter(v => memberList.includes(v));
          const heartsHtml = memberCodes.map(code => {
            const info = memberInfoByCode[code];
            return info ? `<span class="setlist-heart">${info.c}</span>` : '';
          }).join('');
          if (!entry.artist && !heartsHtml) return '';
          return `<div class="setlist-modal-artist">${entry.artist ? escapeHtml(entry.artist) : ''}${heartsHtml ? `<span class="setlist-modal-hearts">${heartsHtml}</span>` : ''}</div>`;
        })() +
        (() => {
          const { dateStr, timeStr } = formatSetlistDateTime(entry.setlistid);
          if (!dateStr && !timeStr) return '';
          return `<div class="setlist-modal-datetime">${escapeHtml(dateStr)}${timeStr ? ` ${escapeHtml(timeStr)}` : ''}</div>`;
        })() +
        (entry.venue ? `<div class="setlist-modal-venue">${escapeHtml(entry.venue)}</div>` : '') +
        (songsHtml ? `<ul class="setlist-modal-songlist">${songsHtml}</ul>` : '<div class="setlist-modal-empty">no songs</div>');
    } catch (err) {
      // データ形状が想定外でも、ポップアップ自体は必ず開いてエラー内容が分かるようにする
      console.error('Failed to render setlist modal:', err);
      setlistModalBody.innerHTML = '<div class="setlist-modal-empty">LOAD ERROR</div>';
    }
    setlistModalOverlay.classList.add('is-open');
  };
  const closeSetlistModal = () => setlistModalOverlay.classList.remove('is-open');
  $('setlistModalCloseBtn').onclick = closeSetlistModal;
  setlistModalOverlay.onclick = e => {
    if (e.target === setlistModalOverlay) closeSetlistModal(); // オーバーレイ部分クリックで閉じる(中身のクリックでは閉じない)
  };
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && setlistModalOverlay.classList.contains('is-open')) closeSetlistModal();
  });

  // コンテンツ種類フィルターを除いた条件(年・グループ/メンバー・検索・TODAY・セトリ検索)だけでアイテムがマッチするか判定
  // セトリ検索モード中は、メンバーフィルターの判定元をlogs.json側のgroups/relationsではなく、
  // そのデータのsetlistidに紐づくsetlist.json側のmemberに切り替える。setlistid→member配列は
  // setlistDataが更新されるたびにMap化しておき(setlistIdToMemberMap)、毎回の線形探索(find)を避ける
  let setlistIdToMemberMap = new Map();
  const rebuildSetlistIdToMemberMap = () => {
    setlistIdToMemberMap = new Map(setlistData.filter(e => e && e.setlistid).map(e => [e.setlistid, Array.isArray(e.member) ? e.member : []]));
  };
  const getFilterGroupsForItem = item => {
    if (setlistMode && item.setlistid) {
      return setlistIdToMemberMap.get(item.setlistid) || [];
    }
    // relationsを持つデータは全体のごく一部(実データでは数%程度)のため、それ以外は毎回配列を
    // スプレッド構文でコピーせず、item.groupsをそのまま返す(呼び出し元はincludes/some/everyの
    // 読み取り専用でしか使わないため、参照をそのまま返しても安全)
    if (!item.relations || item.relations.length === 0) return item.groups || [];
    return [...(item.groups || []), ...item.relations];
  };
  // フィルターボタンのダブルクリック/ダブルタップによる「除外」機能。除外されたボタンの値に該当する
  // データは、他のフィルター条件に関わらず常に非表示にする(複数の除外はOR結合:いずれか一つでも
  // 該当すれば非表示)。状態はlocalStorageに保存し、次回訪問時も復元する。
  const EXCLUDED_FILTERS_KEY = 'gl_log_excluded_filters';
  const loadExcludedFilters = () => {
    try {
      const arr = JSON.parse(localStorage.getItem(EXCLUDED_FILTERS_KEY) || '[]');
      return new Set(Array.isArray(arr) ? arr : []);
    } catch {
      return new Set();
    }
  };
  const excludedFilterValues = loadExcludedFilters();
  const saveExcludedFilters = () => localStorage.setItem(EXCLUDED_FILTERS_KEY, JSON.stringify(Array.from(excludedFilterValues)));

  // アイテムが、除外指定されたいずれかのフィルター値(年/月/グループ/メンバー/コンテンツ種類)に
  // 該当するかどうかを判定する。コンテンツ種類はCD→RELEASE等のエイリアスも正規化した上で判定する。
  // precomputedGroupsを渡すと、呼び出し元で既に計算済みのgetFilterGroupsForItem(item)の結果を再利用し、
  // 同じアイテムに対する重複計算(配列生成)を避けられる(渡さなければ従来通りここで計算する)
  const isExcludedByFilter = (item, precomputedGroups) => {
    if (!excludedFilterValues.size) return false;
    const yr = item.date ? item.date.slice(0, 4) : '';
    const mo = item.date ? item.date.slice(4, 6) : '';
    if (excludedFilterValues.has(yr) || excludedFilterValues.has(mo)) return true;
    const itemGroupsAndRelations = precomputedGroups || getFilterGroupsForItem(item);
    // グループ(G2/L2):メタ表記そのもの、または該当グループの個別メンバーコードのいずれかで判定する
    const itemHasMeta = m => {
      if (itemGroupsAndRelations.includes(m)) return true;
      const mValues = cats.find(c => c.meta === m)?.values || [];
      return itemGroupsAndRelations.some(g => mValues.includes(g));
    };
    if (cats.some(c => excludedFilterValues.has(c.meta) && itemHasMeta(c.meta))) return true;
    // メンバー個別:itemGroupsAndRelationsに含まれる値がそのまま除外指定されていれば該当
    if (itemGroupsAndRelations.some(v => excludedFilterValues.has(v))) return true;
    // コンテンツ種類:エイリアスも含めた正規化後の値で判定する(ETCは主要種類に含まれないもの全て)
    const ic = normalizeContType(item.contents || '');
    if (excludedFilterValues.has(ic)) return true;
    if (excludedFilterValues.has('ETC') && !primaryConts.includes(ic)) return true;
    return false;
  };

  const matchesOtherFilters = (item, ctx) => {
    const { cYears, cMonths, sGroups, mGroups, kw, dq, dateToken, setlistIds } = ctx;
    const yr = item.date ? item.date.slice(0, 4) : '';
    const mo = item.date ? item.date.slice(4, 6) : '';
    const itemGroupsAndRelations = getFilterGroupsForItem(item);
    const itemGroups = itemGroupsAndRelations; // STF除外判定もセトリ検索モード中は同じ配列(member)を参照する

    const yOk = cYears.length === 0 || cYears.includes(yr);
    const monthOk = cMonths.length === 0 || cMonths.includes(mo);

    const itemHasMeta = m => {
      if (itemGroupsAndRelations.includes(m)) return true; // groupsまたはrelationsに"G2"等のメタ表記そのものがある場合
      const mValues = cats.find(c => c.meta === m)?.values || [];
      return itemGroupsAndRelations.some(g => mValues.includes(g)); // 個別メンバーコードからメタ所属を推測
    };
    // メンバー同士は通常AND(すべて含む)だが、グループフィルター(G2/L2)も選択されている時はOR(いずれか含む)に切り替える
    const memberOk = sGroups.length === 0 ? true : (mGroups.length > 0
      ? sGroups.some(g => itemGroupsAndRelations.includes(g))
      : sGroups.every(g => itemGroupsAndRelations.includes(g)));
    const metaOk = mGroups.length === 0 ? true : mGroups.every(itemHasMeta);
    // メンバーフィルターのみ選択時(グループフィルター未選択)は、groupsにSTFがある項目を除外する
    const stfExcluded = sGroups.length > 0 && mGroups.length === 0 && itemGroups.includes('STF');
    const gOk = memberOk && metaOk && !stfExcluded;

    let dateOk = true;
    let textOk = true;
    let setlistOk = true;
    if (setlistMode) {
      // セトリ検索モード中は、通常の日付検索・テキスト検索の代わりにsetlistidベースの判定を行う
      setlistOk = isSetlistOk(item, kw, setlistIds);
    } else {
      if (dq.isDateQuery) {
        const itemDateNum = item.date || '';
        let matchesDate = true;
        if (dq.targetMonthDay) {
          const itemMD = itemDateNum.slice(4, 8);
          matchesDate = itemMD === dq.targetMonthDay;
        } else if (dq.targetMonthDayRange) {
          const itemMD = itemDateNum.slice(4, 8);
          const [fromMD, toMD] = dq.targetMonthDayRange;
          matchesDate = fromMD <= toMD
            ? (itemMD >= fromMD && itemMD <= toMD)
            : (itemMD >= fromMD || itemMD <= toMD);
        } else {
          if (dq.startDate && itemDateNum < dq.startDate) matchesDate = false;
          if (dq.endDate && itemDateNum > dq.endDate) matchesDate = false;
        }
        const tagsMatch = !!(item.tags && item.tags.some(t => t.toLowerCase().includes(dateToken)));
        dateOk = matchesDate || tagsMatch;
        // ANNIVERSARYは登録年自体を検索でも見せない(翌年以降のみ、日付検索でも同じ扱いにする)
        if (dateOk && item.contents === 'ANNIVERSARY' && itemDateNum.slice(0, 4) < minRecurrenceYear(item, anniversaryRegisteredYear(item, itemDateNum))) dateOk = false;
      }

      if (kw) {
        const searchText = getSearchText(item);
        textOk = matchesSearchKeyword(searchText, kw);
      }
    }

    const todayOk = isTodayDateOk(item, cYears);

    return yOk && monthOk && gOk && dateOk && textOk && setlistOk && todayOk && !isExcludedByFilter(item, itemGroupsAndRelations);
  };

  // TODAY/←/→ボタン、またはセトリ検索モードでの検索条件変化があった時のみ、コンテンツ種類ボタンを自動on/offする。
  // それ以外(通常検索・年・グループ・メンバーの変更)では、コンテンツ種類ボタンの自動on/offは一切行わない。
  //
  // ・TODAYまたはセトリ検索モードをONにした時、および関連する条件(←/→、検索ワード等)が変化した時:
  //     手動on/offされているものはそのまま保護し、それ以外は現在の絞り込み(今日基準・セトリ検索結果含む)に
  //     該当する/しないに応じて自動on/offする。
  // ・TODAY・セトリ検索モードの両方がOFFの時:
  //     残りのフィルタでの再判定はせず、手動on/offされているもの以外は無条件で全てOFFにする。
  const manuallyTouchedConts = new Set(); // ユーザーが手動でON/OFFしたコンテンツ種類の値(右上ランプの色分け・保護判定用)

  // 月フィルター(1〜12月)は、年フィルターが1つ以上選択されている時だけ表示する。
  // 年フィルターが全て外れた場合は、意味を持たなくなる月フィルターの選択状態もクリアする
  const updateMonthFilterVisibility = () => {
    const monthRow = $('monthChecks');
    const anyYearChecked = Array.from($('yearChecks').querySelectorAll('input[type="checkbox"]')).some(cb => cb.checked);
    monthRow.classList.toggle('is-visible', anyYearChecked);
    if (!anyYearChecked) {
      monthRow.querySelectorAll('input[type="checkbox"]').forEach(cb => { cb.checked = false; });
    }
  };

  const autoUpdateContentTypeFilters = () => {
    const contentCheckboxes = Array.from(checkboxes).filter(cb => allConts.includes(cb.value));

    if (!todayMode && !setlistMode) {
      // TODAY・セトリ検索モードともにOFF:残りのフィルタでの再判定はせず、手動on/off以外は無条件でOFFにする
      contentCheckboxes.forEach(cb => {
        if (excludedFilterValues.has(cb.value)) { cb.checked = false; return; } // 除外中は常にOFF
        if (manuallyTouchedConts.has(cb.value)) return;
        cb.checked = false;
      });
      return;
    }

    const checked = Array.from(checkboxes).filter(cb => cb.checked);
    const cVals = new Set(checked.map(cb => cb.value));
    const cYears = checked.filter(cb => /^\d{4}$/.test(cb.value)).map(cb => cb.value);
    const cMonths = checked.filter(cb => /^\d{2}$/.test(cb.value)).map(cb => cb.value);
    const sGroups = allGroupVals.filter(v => cVals.has(v));
    const mGroups = cats.map(c => c.meta).filter(m => cVals.has(m));
    const rawKw = searchInput.value.trim();
    const fullKw = rawKw.toLowerCase();
    // セトリ検索モード中は日付抽出を行わず、kwはそのまま曲名検索に使う
    const { dq, dateToken, remainingKw } = setlistMode
      ? { dq: null, dateToken: '', remainingKw: fullKw }
      : extractDateQuery(rawKw);
    const setlistIds = setlistMode && fullKw ? getMatchedSetlistIds(fullKw) : null;
    const ctx = { cYears, cMonths, sGroups, mGroups, kw: remainingKw, dq, dateToken, setlistIds };

    const matched = new Set();
    expandTodayBirthdayItems(logs, cYears, cMonths).forEach(item => {
      if (matchesOtherFilters(item, ctx)) matched.add(normalizeContType(item.contents || ''));
    });

    contentCheckboxes.forEach(cb => {
      // 除外指定中のコンテンツ種類は自動on/offの対象から外し、常にOFF(非表示)のままにする
      if (excludedFilterValues.has(cb.value)) {
        cb.checked = false;
        return;
      }
      // 手動ONのものだけ保護する(手動OFFでも、該当するデータがあれば自動ONに戻す)
      const isProtected = manuallyTouchedConts.has(cb.value) && cb.checked;
      if (isProtected) return;

      const shouldBeOn = cb.value === 'ETC'
        ? Array.from(matched).some(c => !primaryConts.includes(c))
        : matched.has(cb.value);
      cb.checked = shouldBeOn;
      manuallyTouchedConts.delete(cb.value);
    });
  };

  const updateDisplay = (syncHash = true, preserveContentExpand = false) => {
    // データ部の再描画では、コンテンツ名アコーディオンの展開状態を通常は全て閉じる。
    // 年/月/日/曜/時の表示切替ボタンからの呼び出しだけは、この後の再描画でも展開状態を保持したいため、
    // preserveContentExpand=true を渡してクリアをスキップする。
    if (!preserveContentExpand) expandedContentKeys.clear();

    const checked = Array.from(checkboxes).filter(cb => cb.checked);
    const cVals = new Set(checked.map(cb => cb.value));
    const cYears = checked.filter(cb => /^\d{4}$/.test(cb.value)).map(cb => cb.value);
    const cMonths = checked.filter(cb => /^\d{2}$/.test(cb.value)).map(cb => cb.value);
    const cConts = checked.filter(cb => allConts.includes(cb.value)).map(cb => cb.value);
    const sGroups = allGroupVals.filter(v => cVals.has(v));
    const mGroups = cats.map(c => c.meta).filter(m => cVals.has(m));
    const rawKw = searchInput.value.trim();
    const fullKw = rawKw.toLowerCase();

    // 日付・年・月日クエリのパース処理(セトリ検索モード中はkwを曲名検索に使うため不要)。
    // rawKwの中に日付として解釈できるトークンがあれば抜き出し、残りは通常のAND/OR/NOTキーワード検索として扱う
    // (例:"20260101-20260102 -あけまして" → 1/1〜1/2の範囲 かつ 「あけまして」を含まない)
    const { dq, dateToken, remainingKw } = setlistMode
      ? { dq: { isDateQuery: false }, dateToken: '', remainingKw: fullKw }
      : extractDateQuery(rawKw);
    const { isDateQuery, targetMonthDay, targetMonthDayRange, startDate, endDate } = dq;
    const kw = remainingKw;
    // セトリ検索モード中、キーワードがあればsetlist.jsonから該当するsetlistidを検索しておく
    const setlistIds = setlistMode && fullKw ? getMatchedSetlistIds(fullKw) : null;

    filtered = expandTodayBirthdayItems(logs, cYears, cMonths).filter(item => {
      const yr = item.date ? item.date.slice(0, 4) : '';
      const mo = item.date ? item.date.slice(4, 6) : '';
      const itemGroupsAndRelations = getFilterGroupsForItem(item);
      const itemGroups = itemGroupsAndRelations; // STF除外判定もセトリ検索モード中は同じ配列(member)を参照する
      const ic = normalizeContType(item.contents || '');
      
      const yOk = cYears.length === 0 || cYears.includes(yr);
      const monthOk = cMonths.length === 0 || cMonths.includes(mo);
      
      const itemHasMeta = m => {
        if (itemGroupsAndRelations.includes(m)) return true;
        const mValues = cats.find(c => c.meta === m)?.values || [];
        return itemGroupsAndRelations.some(g => mValues.includes(g));
      };
      // メンバー同士は通常AND(すべて含む)だが、グループフィルター(G2/L2)も選択されている時はOR(いずれか含む)に切り替える
      const memberOk = sGroups.length === 0 ? true : (mGroups.length > 0
        ? sGroups.some(g => itemGroupsAndRelations.includes(g))
        : sGroups.every(g => itemGroupsAndRelations.includes(g)));
      const metaOk = mGroups.length === 0 ? true : mGroups.every(itemHasMeta);
      // メンバーフィルターのみ選択時(グループフィルター未選択)は、groupsにSTFがある項目を除外する
      const stfExcluded = sGroups.length > 0 && mGroups.length === 0 && itemGroups.includes('STF');
      const gOk = memberOk && metaOk && !stfExcluded;

      const cOk = isContentTypeOk(item, ic, cConts, cYears, todayMode, isDateQuery, fullKw);
      
      let dateOk = true;
      let textOk = true;
      let setlistOk = true;

      if (setlistMode) {
        // セトリ検索モード:通常の日付検索・テキスト検索の代わりにsetlistidベースで判定する
        setlistOk = isSetlistOk(item, kw, setlistIds);
      } else {
        if (isDateQuery) {
          const itemDateNum = item.date || '';
          let matchesDate = true;
          if (targetMonthDay) {
            const itemMD = itemDateNum.slice(4, 8);
            matchesDate = itemMD === targetMonthDay;
          } else if (targetMonthDayRange) {
            const itemMD = itemDateNum.slice(4, 8);
            const [fromMD, toMD] = targetMonthDayRange;
            matchesDate = fromMD <= toMD
              ? (itemMD >= fromMD && itemMD <= toMD)
              : (itemMD >= fromMD || itemMD <= toMD); // 年をまたぐ範囲(例:1201-0131)にも対応
          } else {
            if (startDate && itemDateNum < startDate) matchesDate = false;
            if (endDate && itemDateNum > endDate) matchesDate = false;
          }
          // 日付検索を優先しつつ、tagsに一致するものがあればそちらも結果に含める
          const tagsMatch = !!(item.tags && item.tags.some(t => t.toLowerCase().includes(dateToken)));
          dateOk = matchesDate || tagsMatch;
          // ANNIVERSARYは登録年自体を検索でも見せない(翌年以降のみ、日付検索でも同じ扱いにする)
          if (dateOk && item.contents === 'ANNIVERSARY' && itemDateNum.slice(0, 4) < minRecurrenceYear(item, anniversaryRegisteredYear(item, itemDateNum))) dateOk = false;
        }

        if (kw) {
          const searchText = getSearchText(item);
          textOk = matchesSearchKeyword(searchText, kw);
        }
      }
      
      const todayOk = isTodayDateOk(item, cYears);

      return yOk && monthOk && gOk && cOk && dateOk && textOk && setlistOk && todayOk && !isExcludedByFilter(item, itemGroupsAndRelations);
    });

    // ソート比較のたびに同じ計算をやり直さないよう、各アイテムのソートキーを1回だけ計算してキャッシュする
    // (decorate-sort-undecorate)。sort()の比較回数はO(n log n)で件数が多いほど比較回数計算回数を大きく
    // 上回るため、比較のたびに毎回計算し直すと無駄が大きい。判定内容・並び順自体は変更しない
    const sortKeyCache = new Map();
    const getSortKeys = item => {
      let keys = sortKeyCache.get(item);
      if (!keys) {
        keys = {
          dateKey: sortKeyFor(item),
          groupRank: groupSortRank(item),
          memberRank: memberSortRank(item),
          // 誕生日(BIRTHDAY)は記念日(ANNIVERSARY)より上に表示する
          babRank: item.contents === 'BIRTHDAY' ? 0 : item.contents === 'ANNIVERSARY' ? 1 : 2,
          contentRank: contentSortRank(item)
        };
        sortKeyCache.set(item, keys);
      }
      return keys;
    };
    filtered.sort((a, b) => {
      const ka = getSortKeys(a), kb = getSortKeys(b);
      if (ka.dateKey !== kb.dateKey) return desc ? kb.dateKey.localeCompare(ka.dateKey) : ka.dateKey.localeCompare(kb.dateKey);
      // 日付+時刻が同一の場合のタイブレーク:
      // 1) グループ(G2とL2両方 > G2 > L2 > STF > それ以外)
      if (ka.groupRank !== kb.groupRank) return ka.groupRank - kb.groupRank;
      // 2) メンバー(フィルターボタンの並び順)
      if (ka.memberRank !== kb.memberRank) return ka.memberRank - kb.memberRank;
      // 3) 誕生日(BIRTHDAY)は記念日(ANNIVERSARY)より上に表示する
      if (ka.babRank !== kb.babRank) return ka.babRank - kb.babRank;
      // 4) コンテンツフィルターボタンの並び順
      return ka.contentRank - kb.contentRank;
    });

    $('items').classList.add('is-animating');
    clearTimeout(renderTimer);
    renderTimer = setTimeout(() => {
      $('items').textContent = '';
      rendered = 0;
      defaultText = '> ' + filtered.length;
      $('resultCount').textContent = defaultText;
      renderActiveBadges(checked, fullKw);
      updateAllBadges();
      updateManualIndicators();

      const isZero = filtered.length === 0;
      $('noResult').style.display = isZero ? 'block' : 'none';
      // TODAYモード中は、フィルターの話ではないため「CLEAR ALL FILTERS」ボタンは出さず「NO DATA」のみ表示する
      $('noResultText').textContent = todayMode ? 'NO DATA' : 'NO RESULTS FOUND';
      $('quickResetBtn').style.display = todayMode ? 'none' : 'inline-block';
      // 通常時は0件でソートボタンを隠すが、TODAYモード中は0件でも日付表示として見せ続ける
      $('sortBtn').style.display = (isZero && !todayMode) ? 'none' : 'block';
      $('inlineClearBtn').style.display = (checked.length > 0 || fullKw || todayMode || setlistMode) ? 'inline-block' : 'none';
      
      if (!isZero) renderBatch();
      $('items').classList.remove('is-animating');
      // 0件時もupdateItemsMinHeight内で分岐して処理する(表示位置は変えず、
      // その下の余白を#dayFlickFillでフリック対象にする)
      updateItemsMinHeight();
    }, 120);

    if (syncHash) {
      updating = true;
      const active = checked.map(cb => cb.value);
      if (active.length > 0 || fullKw) window.location.hash = active.join(',');
      else history.replaceState(null, null, window.location.pathname + window.location.search);
      // hashchange(restoreFromHash)は非同期に発火するため、同期的にfalseへ戻すと
      // ガード(if (updating) return;)が効かず、自前のhash更新でrestoreFromHashが
      // 誤って再実行されてしまう(自動ON分までmanuallyTouchedContsに登録され、
      // 以後の自動OFFが効かなくなる原因になっていた)。
      // hashchangeが発火し終えたあとのタイミングまでresetを遅延させる。
      setTimeout(() => { updating = false; }, 0);
    }
  };

  const previewCountFor = (val, isChecked) => {
    const checked = Array.from(checkboxes).filter(c => c.checked);
    const cVals = new Set(checked.map(c => c.value));
    let cY = checked.filter(c => /^\d{4}$/.test(c.value)).map(c => c.value);
    let cM = checked.filter(c => /^\d{2}$/.test(c.value)).map(c => c.value);
    let sG = allGroupVals.filter(v => cVals.has(v));
    let mG = cats.map(c => c.meta).filter(m => cVals.has(m));
    let cC = checked.filter(c => allConts.includes(c.value)).map(c => c.value);
    const rawKw = searchInput.value.trim();
    const fullKw = rawKw.toLowerCase();
    const { dq, dateToken, remainingKw } = setlistMode
      ? { dq: { isDateQuery: false }, dateToken: '', remainingKw: fullKw }
      : extractDateQuery(rawKw);
    const { isDateQuery, targetMonthDay, targetMonthDayRange, startDate, endDate } = dq;
    const kw = remainingKw;
    const setlistIds = setlistMode && fullKw ? getMatchedSetlistIds(fullKw) : null;
