<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<script type="text/javascript">
//<![CDATA[
// ダークモード設定を、CSS読み込み・描画より前に同期的に反映する(初期表示が一瞬ライトモードになる
// チラつき(FOUC)を防止するため)。<body>がまだ存在しないタイミングなので<html>にクラスを付与する。
if (localStorage.getItem('gl_log_theme') === 'dark') {
  document.documentElement.classList.add('dark-mode');
}
//]]>
</script>
<script type="text/javascript">
//<![CDATA[
// 特定の配信元(ホスト名+パス)からアクセスした場合のみ、ブラウザ/中間キャッシュを迂回して
// 常に最新のHTML自体を取得し直す。対象URLは難読化のためソースに直接書かず、ハッシュ比較で判定する。
(function () {
  var simpleHash = function (s) {
    var h = 0;
    for (var i = 0; i < s.length; i++) {
      h = (h * 31 + s.charCodeAt(i)) | 0;
    }
    return h;
  };
  var TARGET_HOST_HASH = -1626720631;
  var TARGET_PATH_HASH = 982197929;
  if (simpleHash(location.hostname) === TARGET_HOST_HASH && simpleHash(location.pathname) === TARGET_PATH_HASH) {
    var params = new URLSearchParams(location.search);
    if (!params.has('_fresh')) {
      params.set('_fresh', Date.now());
      location.replace(location.pathname + '?' + params.toString() + location.hash);
    }
  }
})();
//]]>
</script>

<script type="text/javascript">
//<![CDATA[
// script.jsを読み込む。logs.json等と同じ「ファイル単位の最新コミットSHAを確認し、
// SHA指定のjsDelivr URL(実質永続キャッシュ)で読み込む」方式で、更新の即時反映とキャッシュ効率を両立する。
(() => {
  const REPO = 'piscenake52/gllogs';
  const BRANCH = 'main';
  const FILE = 'script.js';
  const VERSION_KEY = 'gl_script_sha';
  const CHECK_TIME_KEY = 'gl_script_checked_at';
  const CHECK_COOLDOWN_MS = 1 * 60 * 1000; // 1分以内の再チェックはスキップ(同一端末でのAPI消費を抑制)

  const showBootError = () => {
    var el = document.getElementById('loadError');
    if (el) el.style.display = 'block';
    var rc = document.getElementById('resultCount');
    if (rc) rc.textContent = '';
  };

  const loadScriptTag = src => new Promise((resolve, reject) => {
    const tag = document.createElement('script');
    tag.src = src;
    tag.onload = resolve;
    tag.onerror = reject;
    document.body.appendChild(tag);
  });

  const loadBySha = sha => {
    const url = sha
      ? `https://cdn.jsdelivr.net/gh/${REPO}@${sha}/${FILE}`
      // SHA取得に失敗した場合の保険:キャッシュバスト付きでrawから直接取得
      : `https://raw.githubusercontent.com/${REPO}/${BRANCH}/${FILE}?v=${Date.now()}`;
    return loadScriptTag(url);
  };

  const cachedSha = localStorage.getItem(VERSION_KEY);
  const lastCheckedAt = parseInt(localStorage.getItem(CHECK_TIME_KEY) || '0', 10);
  const withinCooldown = cachedSha && (Date.now() - lastCheckedAt < CHECK_COOLDOWN_MS);

  // 直近チェックから間もない場合は、GitHub APIへの問い合わせを省略してキャッシュ済みSHAでそのまま読み込む
  if (withinCooldown) {
    loadBySha(cachedSha).catch(() => {
      console.error('Failed to load cached script.js, falling back to raw.');
      loadBySha(null).catch(showBootError);
    });
  } else {
    fetch(`https://api.github.com/repos/${REPO}/commits?path=${FILE}&sha=${BRANCH}&page=1&per_page=1`, { cache: 'no-store' })
      .then(res => {
        if (!res.ok) throw new Error('GitHub API error');
        return res.json();
      })
      .then(commits => {
        localStorage.setItem(CHECK_TIME_KEY, String(Date.now()));
        const latestSha = commits[0]?.sha;
        if (latestSha) localStorage.setItem(VERSION_KEY, latestSha);
        return loadBySha(latestSha || cachedSha || null);
      })
      .catch(error => {
        console.error('Failed to check script.js version:', error);
        loadBySha(cachedSha || null).catch(showBootError);
      });
  }
})();
//]]>
</script>
</body>
</html>
