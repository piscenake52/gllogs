      if (/^\d{2}$/.test(val)) cM = cM.filter(m => m !== val);
      if (allGroupVals.includes(val)) sG = sG.filter(g => g !== val);
      if (cats.some(c => c.meta === val)) mG = mG.filter(m => m !== val);
      if (allConts.includes(val)) cC = cC.filter(c => c !== val);
    } else {
      if (/^\d{4}$/.test(val) && !cY.includes(val)) cY.push(val);
      if (/^\d{2}$/.test(val) && !cM.includes(val)) cM.push(val);
      if (allGroupVals.includes(val) && !sG.includes(val)) sG.push(val);
      if (cats.some(c => c.meta === val) && !mG.includes(val)) mG.push(val);
      if (allConts.includes(val) && !cC.includes(val)) cC.push(val);
    }

    return expandTodayBirthdayItems(logs, cY, cM).filter(item => {
      const yr = item.date ? item.date.slice(0, 4) : '';
      const mo = item.date ? item.date.slice(4, 6) : '';
      const itemGroupsAndRelations = getFilterGroupsForItem(item);
      const itemGroups = itemGroupsAndRelations; // STF除外判定もセトリ検索モード中は同じ配列(member)を参照する
      const ic = normalizeContType(item.contents || '');

      const itemHasMeta = m => {
        if (itemGroupsAndRelations.includes(m)) return true;
        const mValues = cats.find(c => c.meta === m)?.values || [];
        return itemGroupsAndRelations.some(g => mValues.includes(g));
      };
      // メンバー同士は通常AND(すべて含む)だが、グループフィルター(G2/L2)も選択されている時はOR(いずれか含む)に切り替える
      const memberOk = sG.length === 0 ? true : (mG.length > 0
        ? sG.some(g => itemGroupsAndRelations.includes(g))
        : sG.every(g => itemGroupsAndRelations.includes(g)));
      const metaOk = mG.length === 0 ? true : mG.every(itemHasMeta);
      // メンバーフィルターのみ選択時(グループフィルター未選択)は、groupsにSTFがある項目を除外する
      const stfExcluded = sG.length > 0 && mG.length === 0 && itemGroups.includes('STF');
      const gOk = memberOk && metaOk && !stfExcluded;

      let dateOk = true;
      let kwOk = true;
      let setlistOk = true;

      if (setlistMode) {
        setlistOk = isSetlistOk(item, kw, setlistIds);
      } else {
        if (isDateQuery) {
          const itemDateNum = item.date || '';
          let matchesDate = true;
          if (targetMonthDay) {
            const itemMD = itemDateNum.slice(4, 8);
            matchesDate = itemMD === targetMonthDay;
          } else if (targetMonthDayRange) {
            const itemMD = itemDateNum.slice(4, 8);
            const [fromMD, toMD] = targetMonthDayRange;
            matchesDate = fromMD <= toMD
              ? (itemMD >= fromMD && itemMD <= toMD)
              : (itemMD >= fromMD || itemMD <= toMD);
          } else {
            if (startDate && itemDateNum < startDate) matchesDate = false;
            if (endDate && itemDateNum > endDate) matchesDate = false;
          }
          const tagsMatch = !!(item.tags && item.tags.some(t => t.toLowerCase().includes(dateToken)));
          dateOk = matchesDate || tagsMatch;
          // ANNIVERSARYは登録年自体を検索でも見せない(翌年以降のみ、日付検索でも同じ扱いにする)
          if (dateOk && item.contents === 'ANNIVERSARY' && itemDateNum.slice(0, 4) < minRecurrenceYear(item, anniversaryRegisteredYear(item, itemDateNum))) dateOk = false;
        }

        if (kw) {
          const searchText = getSearchText(item);
          kwOk = matchesSearchKeyword(searchText, kw);
        }
      }

      const todayOk = isTodayDateOk(item, cY);
      const yOk = cY.length === 0 || cY.includes(yr);
      const monthOk = cM.length === 0 || cM.includes(mo);
      const cOk = isContentTypeOk(item, ic, cC, cY, todayMode, isDateQuery, fullKw);

      return yOk &&
             monthOk &&
             gOk &&
             cOk &&
             dateOk && kwOk && setlistOk && todayOk && !isExcludedByFilter(item, itemGroupsAndRelations);
    }).length;
  };

  // BADGEモード:各フィルターボタンに、現在の他条件と連動した件数を常時表示する
  let badgeMode = false;
  const CAP = 9999;
  const updateAllBadges = () => {
    labels.forEach(l => {
      const badge = l.querySelector('.count-badge');
      if (!badge) return;
      const cb = l.querySelector('input');
      if (!badgeMode || !cb || cb.checked) {
        // 選択中のボタンは「外した場合の件数」になり分かりにくいためバッジを表示しない
        badge.style.display = 'none';
        return;
      }
      const cnt = previewCountFor(cb.value, cb.checked);
      badge.textContent = cnt > CAP ? String(CAP) : String(cnt);
      badge.style.display = 'flex';
    });
  };

  // 右上のランプの色を切り替える:コンテンツ種類はmanuallyTouchedContsに含まれていれば手動操作済み、
  // 年/グループ/メンバーは自動on/offの仕組みが無いため、チェック済みであれば常に手動ONとして扱う
  const updateManualIndicators = () => {
    labels.forEach(l => {
      const cb = l.querySelector('input');
      if (!cb) return;
      const isManual = allConts.includes(cb.value) ? manuallyTouchedConts.has(cb.value) : cb.checked;
      l.classList.toggle('is-manual-on', isManual);
    });
  };

  $('badgeToggleBtn').onclick = () => {
    badgeMode = !badgeMode;
    $('badgeToggleBtn').classList.toggle('is-active', badgeMode);
    updateAllBadges();
      updateManualIndicators();
  };

  // ICONボタン:コンテンツ種類フィルターの表示をテキストのみ⇔アイコンのみで切り替える。次回訪問時も記憶する
  const ICON_MODE_KEY = 'gl_log_icon_mode';
  let iconMode = localStorage.getItem(ICON_MODE_KEY) === 'true';

  // ICONモード時のみ、コンテンツ種類ボタンにツールチップ(名前)を表示する
  const updateContentTooltips = () => {
    document.querySelectorAll('#otherChecks label[data-tooltip-name]').forEach(l => {
      if (iconMode) l.title = l.dataset.tooltipName;
      else l.removeAttribute('title');
    });
  };

  document.body.classList.toggle('icon-only-mode', iconMode);
  $('iconToggleBtn').classList.toggle('is-active', iconMode);
  updateContentTooltips();
  $('iconToggleBtn').onclick = () => {
    iconMode = !iconMode;
    document.body.classList.toggle('icon-only-mode', iconMode);
    $('iconToggleBtn').classList.toggle('is-active', iconMode);
    localStorage.setItem(ICON_MODE_KEY, iconMode);
    updateContentTooltips();
    updateDisplay(false);
  };

  // ♪ボタン:検索窓の下にある楽曲紹介バー(PLAYボタン+タイトル/アーティスト)の表示/非表示を切り替える。
  // 次回訪問時も状態を記憶する。表示/非表示はCSSのmax-height/opacityで滑らかにアニメーションする

  // 📍ボタン(MAPモード):ONの間、データ部の日付/時刻表示の右にmap属性へのリンクアイコンを表示する。
  // 次回訪問時も状態を記憶する
  const MAP_MODE_KEY = 'gl_log_map_mode';
  let mapMode = localStorage.getItem(MAP_MODE_KEY) === 'true';
  $('mapToggleBtn').classList.toggle('is-active', mapMode);
  $('mapToggleBtn').onclick = () => {
    mapMode = !mapMode;
    $('mapToggleBtn').classList.toggle('is-active', mapMode);
    localStorage.setItem(MAP_MODE_KEY, mapMode);
    updateDisplay(false);
  };

  // 📋️ボタン(SETLISTアイコン表示モード):セトリ検索モードとは別物の独立したON/OFF。ONの間、データ部の
  // 日付/時刻表示の右(📍の右)にSETLISTアイコンを表示する。基本的な動作は📍(mapMode)と同じ考え方で、
  // setlistidを持たない行でもアイコン要素自体は常に作り、見た目だけ隠して幅を確保する。
  // アイコン押下時の処理(セットリストポップアップを開く)はセトリ検索モード中の表示と共通。
  // 次回訪問時も状態を記憶する
  const SETLIST_ICON_MODE_KEY = 'gl_log_setlist_icon_mode';
  let setlistIconMode = localStorage.getItem(SETLIST_ICON_MODE_KEY) === 'true';
  $('setlistIconToggleBtn').classList.toggle('is-active', setlistIconMode);
  $('setlistIconToggleBtn').onclick = () => {
    // セトリ検索モード中はこのボタンが強制ON表示(色つき)で固定されるため、通常のON/OFF操作は受け付けない
    // (セトリ検索モード中の強制ON状態は setlistIconMode の保存値とは別管理で、ここでは一切変更しない)
    if (setlistMode) return;
    setlistIconMode = !setlistIconMode;
    $('setlistIconToggleBtn').classList.toggle('is-active', setlistIconMode);
    localStorage.setItem(SETLIST_ICON_MODE_KEY, setlistIconMode);
    updateDisplay(false);
  };
  const SONG_MODE_KEY = 'gl_log_song_mode';
  let songMode = localStorage.getItem(SONG_MODE_KEY) === 'true';
  $('songToggleBtn').classList.toggle('is-active', songMode);
  $('songBar').classList.toggle('is-open', songMode);
  $('songToggleBtn').onclick = () => {
    songMode = !songMode;
    $('songToggleBtn').classList.toggle('is-active', songMode);
    $('songBar').classList.toggle('is-open', songMode);
    localStorage.setItem(SONG_MODE_KEY, songMode);
    if (songMode) updateSongTickerScroll(); // 表示直後に幅が確定するよう再計測する
  };

  // 💞ボタン:現在表示中の全行のハートを一括で展開/縮小する(押した時点の集約状態を反転させる)
  $('heartToggleBtn').onclick = () => {
    const nextOpen = !heartModeOn;
    $('items').querySelectorAll('.team-hearts').forEach(hearts => {
      hearts.classList.toggle('is-open', nextOpen);
      const icon = hearts.previousElementSibling;
      if (icon && icon.classList.contains('team-icon')) icon.setAttribute('aria-expanded', String(nextOpen));
    });
    heartModeOn = nextOpen;
    $('heartToggleBtn').classList.toggle('is-active', heartModeOn);
  };

  // 「-」「+」ボタン:データ部(ログ一覧)の文字サイズを5%刻みで拡大縮小する。等倍(100%)を基準に、
  // 縮小は50%、拡大は200%を上下限とし、達した側は色(青)はそのままに押せなくする。
  // 長押しで等倍(100%)にリセットできる。状態はlocalStorageに保存し次回も復元する。
  const TEXT_SIZE_MIN = -50;
  const TEXT_SIZE_MAX = 50;
  const clampTextSize = v => Math.max(TEXT_SIZE_MIN, Math.min(TEXT_SIZE_MAX, v));
  const TEXT_SIZE_KEY = 'gl_log_text_size_percent';
  let textSizePercent = clampTextSize(parseInt(localStorage.getItem(TEXT_SIZE_KEY) || '0', 10) || 0);

  const textSizeBtn = $('textSizeBtn');
  const textSizePanel = $('textSizePanel');
  const textSizeSlider = $('textSizeSlider');
  const textSizePanelPct = $('textSizePanelPct');

  const applyTextSize = () => {
    document.documentElement.style.setProperty('--data-font-scale', String(1 + textSizePercent / 100));
    textSizeBtn.classList.toggle('is-active', textSizePercent !== 0);
    textSizeSlider.value = String(textSizePercent);
    textSizePanelPct.textContent = (100 + textSizePercent) + '%';
    localStorage.setItem(TEXT_SIZE_KEY, String(textSizePercent));
    // 既に展開中のコンテンツ名ボックスは、文字サイズ変更前のpx幅(flexBasis)のまま固定されて
    // しまうため、新しいフォントサイズを反映した幅に再計測して更新する(見切れ防止)。
    // CSS変数の反映を待つため次フレームで計測する。
    requestAnimationFrame(() => {
      document.querySelectorAll('.item-contents.is-content-open').forEach(ct => {
        const targetPx = measureContentOpenWidthPx(ct);
        ct.style.flexBasis = targetPx + 'px';
      });
    });
  };
  applyTextSize();

  const resetTextSize = () => { textSizePercent = 0; applyTextSize(); };

  // パネルの開閉:「A」ボタン直下に、アイコン下からなめらかに伸びる形で開閉する
  const openTextSizePanel = () => {
    textSizePanel.classList.add('is-open');
    textSizeBtn.classList.add('is-open');
    textSizeBtn.setAttribute('aria-expanded', 'true');
  };
  const closeTextSizePanel = () => {
    textSizePanel.classList.remove('is-open');
    textSizeBtn.classList.remove('is-open');
    textSizeBtn.setAttribute('aria-expanded', 'false');
  };
  const toggleTextSizePanel = () => {
    if (textSizePanel.classList.contains('is-open')) closeTextSizePanel();
    else openTextSizePanel();
  };

  // スライダー操作:ドラッグに連動してリアルタイムに反映する
  textSizeSlider.addEventListener('input', () => {
    textSizePercent = clampTextSize(parseInt(textSizeSlider.value, 10) || 0);
    applyTextSize();
  });

  // ＋／－ボタン:押すたびに5%単位で増減する
  [$('textSizeMinusBtn'), $('textSizePlusBtn')].forEach(btn => {
    btn.addEventListener('click', () => {
      textSizePercent = clampTextSize(textSizePercent + parseInt(btn.dataset.step, 10));
      applyTextSize();
    });
  });

  // 「A」ボタン:シングルクリック/タップで即座にパネル開閉、ホールド(600ms)で100%にリセットする
  {
    let pressTimer = null;
    let longPressed = false;
    const start = () => { longPressed = false; pressTimer = setTimeout(() => { longPressed = true; resetTextSize(); }, 600); };
    const cancel = () => clearTimeout(pressTimer);
    textSizeBtn.addEventListener('mousedown', start);
    textSizeBtn.addEventListener('touchstart', start, { passive: true });
    textSizeBtn.addEventListener('mouseup', cancel);
    textSizeBtn.addEventListener('mouseleave', cancel);
    textSizeBtn.addEventListener('touchend', cancel);
    textSizeBtn.addEventListener('touchcancel', cancel);
    textSizeBtn.addEventListener('click', () => { if (longPressed) return; toggleTextSizePanel(); });
  }

  // パネル外タップ/クリックで閉じる
  document.addEventListener('click', e => {
    if (!textSizePanel.classList.contains('is-open')) return;
    if (e.target === textSizeBtn || textSizeBtn.contains(e.target)) return; // ボタン自身のclickは上のハンドラに任せる
    if (!$('textSizeWrap').contains(e.target)) closeTextSizePanel();
  });

  // 年/月/日/曜/時分:項目左端の日付表示を個別にon/offするボタン。状態はlocalStorageに保存し次回も復元する
  const datePartButtons = {
    year: $('showYearBtn'),
    month: $('showMonthBtn'),
    day: $('showDayBtn'),
    weekday: $('showWeekdayBtn'),
    time: $('showTimeBtn')
  };
  Object.keys(datePartButtons).forEach(key => {
    datePartButtons[key].classList.toggle('is-active', dateParts[key]);
    datePartButtons[key].onclick = () => {
      dateParts[key] = !dateParts[key];
      datePartButtons[key].classList.toggle('is-active', dateParts[key]);
      localStorage.setItem(DATE_PARTS_KEY, JSON.stringify(dateParts));
      updateDisplay(false, true);
    };
  });

  // TODAYモード:システム日付(端末のローカル日付)を基準に、todayOffset日ずらしたデータのみに絞り込む
  // 通常クリックでのON/OFFは今回のセッション限りで、localStorageには保存しない。
  // TODAYボタンを長押し(タップホールド)した時だけ「保持」状態をトグルし、保持ON中は次回訪問時の
  // 初期表示も常にTODAYモードONになる(今回のセッション中に通常クリックでOFFにしても、保持状態自体は
  // 維持され、次回訪問時は再びONから始まる)
  const TODAY_MODE_KEY = 'gl_log_today_mode';
  let todayHeld = localStorage.getItem(TODAY_MODE_KEY) === 'true';
  let todayMode = todayHeld; // 保持ONなら初期表示からTODAYモードON
  let todayLongPressed = false; // TODAYボタンの長押しが発火した直後、続くclickイベントで通常のON/OFF切替を行わせないためのフラグ
  let todayOffset = 0; // 0=当日, 負=前日方向, 正=翌日方向
  let preTodaySort = null; // TODAYをONにする直前のソート状態(descの値)を退避
  let searchDateTodayActive = false; // 検索窓への日付入力によってTODAYモードがONにされている状態かどうか
  const getTargetDateStr = offsetDays => {
    const d = new Date();
    d.setDate(d.getDate() + offsetDays);
    // item.dateと直接比較するため、ドット無しの8桁(YYYYMMDD)形式で返す
    return String(d.getFullYear()) + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
  };
  // 年フィルターのチェック状態を取得する(4桁の年チェックボックスのみを対象とする#yearChecks配下)
  const getCheckedYears = () => Array.from($('yearChecks').querySelectorAll('input:checked')).map(cb => cb.value);

  // ソート矢印ボタン(sortBtn)の表示切替:TODAYモード中は矢印の代わりに現在表示中の日付を表示する
  // (押した時の並び替え機能自体は変わらない)。TODAYモードでない時は従来通り矢印を表示する。
  // 年フィルターが1つだけ選択されている場合は、実際の今日の年ではなくその選択年+月日を表示する
  // (年フィルター選択時は選択年の該当月日データが表示されるため、実日付の年をそのまま出すと食い違うため)。
  // 年フィルターが2つ以上選択されている場合は、表示中のデータが複数年にまたがり単一の日付で
  // 言い表せないため、日付表示はせず通常の矢印表示に戻す
  const updateSortBtnLabel = () => {
    if (todayMode) {
      const checkedYears = getCheckedYears();
      if (checkedYears.length === 1) {
        const md = getTargetMonthDayStr(todayOffset);
        $('sortBtn').textContent = checkedYears[0] + '.' + md.slice(0, 2) + '.' + md.slice(2, 4);
      } else if (checkedYears.length > 1) {
        $('sortBtn').textContent = desc ? '\u2193' : '\u2191';
      } else {
        const s = getTargetDateStr(todayOffset);
        $('sortBtn').textContent = s.slice(0, 4) + '.' + s.slice(4, 6) + '.' + s.slice(6, 8);
      }
    } else {
      $('sortBtn').textContent = desc ? '\u2193' : '\u2191';
    }
  };
  const getTargetMonthDayStr = offsetDays => {
    const d = new Date();
    d.setDate(d.getDate() + offsetDays);
    return String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
  };

  // 検索窓の文字列が「年月日8桁(例:20260907)」として完全な実在日付になっているかを判定する。
  // 該当すればその日付のDateオブジェクトを、そうでなければnullを返す
  const getExactSearchDate = rawKw => {
    if (!/^\d{8}$/.test(rawKw)) return null;
    const y = parseInt(rawKw.slice(0, 4), 10);
    const m = parseInt(rawKw.slice(4, 6), 10);
    const d = parseInt(rawKw.slice(6, 8), 10);
    if (m < 1 || m > 12 || d < 1 || d > 31) return null;
    const dt = new Date(y, m - 1, d);
    if (dt.getFullYear() !== y || dt.getMonth() !== m - 1 || dt.getDate() !== d) return null; // 2/31等の実在しない日付を弾く
    return dt;
  };

  // 検索窓に実在する年月日8桁が入力された時、その日付を基準にTODAYモードをONにする
  // (todayOffsetを「今日からその日付までの日数差」に設定し、ボタン色を該当日にあった状態にする)
  const enableTodayFromSearchDate = dt => {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    dt.setHours(0, 0, 0, 0);
    const diffDays = Math.round((dt - today) / 86400000);
    if (!todayMode) {
      todayMode = true;
      preTodaySort = desc;
      // TODAYをONにした時だけソートを自動的に昇順にする(手動でTODAYをONにした時と同じ挙動)
      if (desc) desc = false;
    }
    todayOffset = diffDays;
    searchDateTodayActive = true;
    updateSortBtnLabel();
    updateTodayButtonStyle();
    autoUpdateContentTypeFilters();
    updateManualIndicators();
  };

  // TODAYモードをOFFに戻す共通処理(ON→OFF時の状態リセット本体のみ。呼び出し側の事情に応じて
  // autoUpdateContentTypeFilters()等の後続処理は各呼び出し元で必要に応じて行う)
  const turnOffTodayMode = () => {
    todayMode = false;
    todayOffset = 0;
    searchDateTodayActive = false;
    if (preTodaySort !== null) {
      desc = preTodaySort;
      preTodaySort = null;
    }
    updateSortBtnLabel();
    updateTodayButtonStyle();
  };

  // 検索窓の日付入力によってONにされていたTODAYモードをOFFに戻す
  const disableTodayFromSearchDate = () => {
    if (!searchDateTodayActive) return;
    turnOffTodayMode();
    autoUpdateContentTypeFilters();
    updateManualIndicators();
  };

  // 検索窓の現在の内容を見て、日付ならTODAYモードをON、日付でなくなった(変更・削除された)ならOFFにする
  const syncTodayModeFromSearch = () => {
    const rawKw = searchInput.value.trim();
    const exactDate = getExactSearchDate(rawKw);
    if (exactDate) {
      enableTodayFromSearchDate(exactDate);
    } else {
      disableTodayFromSearchDate();
    }
  };
  // BIRTHDAY/ANNIVERSARYかどうか(この2種類はTODAYモード時、登録年を問わず「同じ月日」であれば
  // 表示対象にする特別扱いをする)
  const isBirthdayAnniversary = item => item.contents === 'BIRTHDAY' || item.contents === 'ANNIVERSARY';

  // BIRTHDAYの年別複製アイテム(expandTodayBirthdayItemsで_birthYearが付与されたもの)のみ対象に、
  // 表示年(item.dateの先頭4桁)と_birthYearの差から年齢を算出し、テキスト中の「誕生日」を
  // 「N歳の誕生日」に置換する(本人の登録元アイテムやANNIVERSARYなどは対象外なのでそのまま返す)。
  const applyBirthdayAgeText = (item, text) => {
    if (item.contents !== 'BIRTHDAY' || !item._birthYear || !text) return text;
    const dispYear = parseInt(String(item.date || '').slice(0, 4), 10);
    const birthYear = parseInt(item._birthYear, 10);
    if (!Number.isFinite(dispYear) || !Number.isFinite(birthYear)) return text;
    const age = dispYear - birthYear;
    if (age < 0 || !text.includes('誕生日')) return text;
    return text.replace('誕生日', `${age}歳の誕生日`);
  };

  // BIRTHDAY/ANNIVERSARY(及びそのエイリアスのDEBUT/FORMATION)はフィルターボタンを持たないため、
  // 通常のコンテンツ種類フィルターの対象から外し、代わりに専用の表示条件を設ける:
  // 「誕生日」「記念日」でのキーワード検索、日付そのものの検索、年/年月フィルター、TODAYモードの
  // いずれかに該当する場合のみ表示する(それ以外の通常閲覧では一覧に出てこない)
  const isBirthdayLikeType = ic => ic === 'BIRTHDAY' || ic === 'ANNIVERSARY';
  const birthdayKeywordMatch = (item, kw) => {
    if (!kw) return false;
    if (item.contents === 'BIRTHDAY' && kw.includes('\u8a95\u751f\u65e5')) return true;
    if (item.contents === 'ANNIVERSARY' && kw.includes('\u8a18\u5ff5\u65e5')) return true;
    return false;
  };
  // コンテンツ種類の判定そのものを行うヘルパー。BIRTHDAY/ANNIVERSARY(DEBUT/FORMATIONのエイリアス含む)は
  // フィルターボタンを持たないため、通常のコンテンツ種類フィルター(cConts)の対象から完全に外し、
  // 代わりに「年/年月フィルター・TODAYモード・日付検索・専用キーワード」のいずれかでのみ表示する。
  // ただし、他のコンテンツ種類フィルターをユーザーが手動で選択している間は(その種類だけに絞り込みたい
  // 意図のため)BIRTHDAY/ANNIVERSARYは表示しない。TODAYモード中にシステムが自動でON/OFFしただけの
  // コンテンツ種類フィルターは、ここでは「選択されている」扱いにしない(手動選択と区別するため
  // manuallyTouchedContsを参照する)
  const isContentTypeOk = (item, ic, cConts, cYears, todayMode, isDateQuery, kw) => {
    if (isBirthdayLikeType(ic)) {
      const hasManualContentFilter = cConts.some(c => manuallyTouchedConts.has(c));
      if (hasManualContentFilter) return false;
      return cYears.length > 0 || todayMode || isDateQuery || birthdayKeywordMatch(item, kw);
    }
    return cConts.length === 0 || (cConts.includes('ETC') && !primaryConts.includes(ic)) || cConts.includes(ic);
  };

  // TODAYモード時の日付一致判定。年フィルターがONの場合は「その年の該当月日」で一致させる(年の絞り込み自体はyOk側で行う)
  const isTodayDateOk = (item, cYears) => {
    if (!todayMode) return true;
    if (cYears && cYears.length > 0) {
      const itemDateNum = item.date || '';
      return itemDateNum.slice(4, 8) === getTargetMonthDayStr(todayOffset);
    }
    return item.date === getTargetDateStr(todayOffset);
  };

  // ANNIVERSARYは登録年自体を「記念日」としては数えず、翌年以降から毎年恒例の対象とする
  // (例:date:20190329登録なら2019年では出さず、2020年以降で表示する)。BIRTHDAYは登録年からそのまま対象
  const minRecurrenceYear = (item, registeredYear) =>
    item.contents === 'ANNIVERSARY' ? String(parseInt(registeredYear, 10) + 1) : registeredYear;

  // BIRTHDAYのみ対象に、複製した年別アイテムに元の登録年(=生年)を _birthYear として付与する。
  // 表示時(buildRowText側)でこの値と複製先の表示年を比較し、「年齢」を計算するためのもの。
  // ANNIVERSARYは年齢表示の対象外だが、代わりに元の登録年を _registeredYear として付与する。
  // (TODAYモードでの日付検索等でitem.dateが表示年に書き換えられた後も、「登録年自体は表示しない」
  //  判定(下のanniversaryRegisteredYear/各所のminRecurrenceYearチェック)で本来の登録年を参照するため)
  const birthdayAgeProps = (item, registeredYear) =>
    item.contents === 'BIRTHDAY' ? { _birthYear: registeredYear } : { _registeredYear: registeredYear };

  // ANNIVERSARYの「登録年自体は表示しない」判定に使う登録年を取得する。
  // 展開済み(expandTodayBirthdayItemsで_registeredYearが付与された)アイテムはその値を、
  // 未展開(元データそのまま。item.dateがまだ登録日そのもの)ならitem.dateの年をそのまま使う
  const anniversaryRegisteredYear = (item, itemDateNum) =>
    item._registeredYear || (itemDateNum ? itemDateNum.slice(0, 4) : '');

  // BIRTHDAY/ANNIVERSARYを「表示すべき年」ごとに複製したアイテムへ展開する。年フィルターが無ければ
  // 何もしない(高速パス)。以下2つのケースで展開する:
  // - TODAYモード中:選択年フィルターがあれば、登録年(ANNIVERSARYは翌年)以降かつ月日がTODAY基準日と
  //   一致するものを、選択された各年に複製する(例:19770317登録で、今日が0317、年フィルターに2027と
  //   2025が選択済みなら20270317と20250317の2件を生成する)。年フィルターが無ければ、登録日以降で
  //   あれば「今日(offset適用後)」の年月日で1件だけ生成する
  // - TODAYモードOFFでも年フィルターが選択されている場合:2010年以前の古い年はボタンが無く選択できない
  //   ため、年をまたいだ「毎年恒例」の月日一致とみなし、登録年(ANNIVERSARYは翌年)以降かつ選択されて
  //   いる各年に複製する(月フィルターが併用されていれば、登録月がそれに一致するものだけを対象にする)
  // BIRTHDAY/ANNIVERSARY以外、および年フィルターも無くTODAYモードもOFFの場合は元のアイテムをそのまま返す
  const expandTodayBirthdayItems = (items, cYears, cMonths) => {
    if (!todayMode && (!cYears || cYears.length === 0)) return items;
    const targetMonthDay = todayMode ? getTargetMonthDayStr(todayOffset) : null;
    const targetDateNum = todayMode ? getTargetDateStr(todayOffset) : null;
    const result = [];
    items.forEach(item => {
      if (!isBirthdayAnniversary(item)) { result.push(item); return; }
      const itemDateNum = item.date || '';
      if (!itemDateNum) return;
      const registeredYear = itemDateNum.slice(0, 4);
      const minYear = minRecurrenceYear(item, registeredYear);
      const monthDay = itemDateNum.slice(4, 8); // "MMDD"
      const registeredMonth = itemDateNum.slice(4, 6); // "MM"

      if (todayMode) {
        if (monthDay !== targetMonthDay) return; // 月日不一致は対象外
        if (cYears && cYears.length > 0) {
          cYears.forEach(y => {
            if (y < minYear) return; // 登録年(ANNIVERSARYは翌年)より前の年フィルターは対象外
            result.push(Object.assign({}, item, { date: `${y}${monthDay}` }, birthdayAgeProps(item, registeredYear)));
          });
        } else if (itemDateNum <= targetDateNum && targetDateNum.slice(0, 4) >= minYear) {
          result.push(Object.assign({}, item, { date: getTargetDateStr(todayOffset) }, birthdayAgeProps(item, registeredYear)));
        }
      } else {
        // ANNIVERSARYは「年フィルターだけ(+月フィルター)」の毎年恒例展開の対象外とする(年および月日まで一致した場合のみ表示したいため、
        // TODAYモード(上のif側)や完全一致の日付検索経由でのみ展開させる)。BIRTHDAYはこれまで通り年フィルターだけでも展開する
        if (item.contents === 'ANNIVERSARY') return;
        // TODAYモードOFFでも、年フィルター(+月フィルター)の組み合わせで毎年恒例の月日一致とみなして展開する
        if (cMonths && cMonths.length > 0 && !cMonths.includes(registeredMonth)) return; // 月フィルターと不一致なら対象外
        cYears.forEach(y => {
          if (y < minYear) return; // 登録年(ANNIVERSARYは翌年)より前の年フィルターは対象外
          result.push(Object.assign({}, item, { date: `${y}${monthDay}` }, birthdayAgeProps(item, registeredYear)));
        });
      }
    });
    return result;
  };

  const updateTodayButtonStyle = () => {
    const btn = $('todayToggleBtn');
    btn.classList.toggle('is-active', todayMode && todayOffset === 0);
    btn.classList.toggle('is-offset-prev', todayMode && todayOffset < 0);
    btn.classList.toggle('is-offset-next', todayMode && todayOffset > 0);
    // 年フィルターが選択されている間は、前後日移動(offset)の色より黄色を優先する。年フィルターが外れたら通常の色に戻る
    btn.classList.toggle('is-year-filtered', todayMode && !!$('yearChecks').querySelector('input:checked'));
    // 検索窓の日付入力でTODAYモードがONになっている間は、日付検索の絞り込み(検索文字列そのままの
    // 固定日付)と前後日移動が両立せずヒット件数が0になりやすいため、前後日ボタン自体を隠す
    $('prevDayBtn').classList.toggle('is-visible', todayMode && !searchDateTodayActive);
    $('nextDayBtn').classList.toggle('is-visible', todayMode && !searchDateTodayActive);
    if (todayOffset === 0) {
      $('prevDayBtn').classList.remove('is-pressed');
      $('nextDayBtn').classList.remove('is-pressed');
    }
  };

  // 保存されていたON状態を復元する場合、手動でONにした時と同じ挙動(ソートを自動的に昇順にする)を適用する
  if (todayMode) {
    preTodaySort = desc;
    if (desc) desc = false;
  }
  updateTodayButtonStyle();
  updateSortBtnLabel();

  // 保持(hold)状態の見た目(青枠)を反映する。保持ON中は次回訪問時もTODAYモードがONから始まる
  const applyTodayHeldStyle = () => {
    $('todayToggleBtn').classList.toggle('is-held', todayHeld);
  };
  applyTodayHeldStyle();

  // 長押し(タップホールド)で保持状態そのものをトグルする(保持ON中に再度長押しすると保持OFFに戻る)。
  // 今回のセッション中の通常クリックによるON/OFF(todayMode)には影響しない
  const toggleTodayHeld = () => {
    todayHeld = !todayHeld;
    localStorage.setItem(TODAY_MODE_KEY, todayHeld);
    applyTodayHeldStyle();
  };

  $('todayToggleBtn').onclick = () => {
    if (todayLongPressed) { todayLongPressed = false; return; } // 長押し発火直後のclickは無視する
    // セトリ検索モード中のTODAYは通常時と別管理の独立したON/OFFのため、ここではセトリ検索モードには一切触れない
    if (!todayMode) {
      // OFF -> ON(当日)。ON にする直前のソート状態を覚えておく
      todayMode = true;
      todayOffset = 0;
      preTodaySort = desc;
      // TODAYをONにした時だけソートを自動的に昇順にする
      if (desc) desc = false;
      updateSortBtnLabel();
      updateTodayButtonStyle();
    } else {
      // ON(当日 or 前後日)状態からの押下は、常にOFFにする
      turnOffTodayMode();
    }
    // 通常クリックでのON/OFFは今回のセッション限り。保持(localStorage)はここでは書き換えない
    autoUpdateContentTypeFilters();
    updateManualIndicators();
    updateDisplay(true);
  };

  // 長押し(600ms)検出:「A」ボタン(文字サイズ)と同じ方式で、押しっぱなしを判定する
  {
    let pressTimer = null;
    const btn = $('todayToggleBtn');
    const start = () => { todayLongPressed = false; pressTimer = setTimeout(() => { todayLongPressed = true; toggleTodayHeld(); }, 600); };
    const cancel = () => clearTimeout(pressTimer);
    btn.addEventListener('mousedown', start);
    btn.addEventListener('touchstart', start, { passive: true });
    btn.addEventListener('mouseup', cancel);
    btn.addEventListener('mouseleave', cancel);
    btn.addEventListener('touchend', cancel);
    btn.addEventListener('touchcancel', cancel);
  }

  // ================= TODAYモード:日付切替の共通アニメーション =================
  // ←/→ボタン押下・データ部のフリックのどちらでも同じスライドイン/アウト演出を使う。
  // 翌日方向(delta>0)は左へ、前日方向(delta<0)は右へスライドアウトする向きで統一する。
  const itemsEl = $('items');
  // フリックでのスライド演出は、データ行(#items)だけでなくNO DATA表示(#noResult)も
  // 一緒に動かす必要があるため、両者を包む#daySlideAreaに対してtransformを適用する
  const slideAreaEl = $('daySlideArea');
  // NO DATA表示時、表示位置を変えずにその下の余白だけをフリック可能にするための透明な当たり判定
  const flickFillEl = $('dayFlickFill');
  const DAY_SLIDE_MS = 150;      // スライドイン/アウトの所要時間(体感速度優先でやや短めに調整)
  const DAY_SWAP_WAIT_MS = 130;  // データ切替(updateDisplay内部の120msフェード)を画面外で待つ時間(120msに10msの安全マージンのみ持たせる)
  let daySlideAnimating = false; // 演出の多重発火防止(演出中は新たな操作を受け付けない)

  // TODAYモード中は、表示件数が少なくデータ部(#items)の実高さが画面より低い場合でも、
  // 画面(ビューポート)の下端までフリック可能な領域として扱えるよう min-height を伸ばす。
  // 0件(NO DATA)時は、#itemsや#noResultのmin-heightを伸ばすとNO RESULTS FOUND時より
  // 後続のupdated>/フッターが下に押し下げられてしまうため、それらは伸ばさず、
  // #dayFlickFillを表示位置は変えずにその下の余白へ重ねることでフリック対象にする。
  // TODAYモードOFF時はすべて元に戻す(通常表示で不要な余白ができないようにする)。
  const updateItemsMinHeight = () => {
    const noResultEl = $('noResult');
    if (!todayMode) {
      itemsEl.style.minHeight = '';
      flickFillEl.style.display = 'none';
      return;
    }
    if (noResultEl.style.display === 'block') {
      itemsEl.style.minHeight = '';
      // #dayFlickFillはposition:fixedでドキュメントの流れから外れているため、
      // ここでtop/heightを設定してもupdated>やフッターの位置には影響しない
      const bottom = noResultEl.getBoundingClientRect().bottom;
      const extra = window.innerHeight - bottom;
      if (extra > 0) {
        flickFillEl.style.top = bottom + 'px';
        flickFillEl.style.height = extra + 'px';
        flickFillEl.style.display = 'block';
      } else {
        flickFillEl.style.display = 'none';
      }
      return;
    }
    flickFillEl.style.display = 'none';
    const top = itemsEl.getBoundingClientRect().top;
    const extra = window.innerHeight - top;
    itemsEl.style.minHeight = extra > 0 ? extra + 'px' : '';
  };
  window.addEventListener('resize', () => { if (todayMode) updateItemsMinHeight(); });
  window.addEventListener('orientationchange', () => { if (todayMode) setTimeout(updateItemsMinHeight, 200); });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', () => { if (todayMode) updateItemsMinHeight(); });
  }

  const setItemsTransform = (dx, withTransition) => {
    slideAreaEl.style.transition = withTransition ? `transform ${DAY_SLIDE_MS}ms ease-out` : 'none';
    slideAreaEl.style.transform = dx === 0 ? '' : `translateX(${dx}px)`;
  };
  const resetItemsTransform = () => {
    slideAreaEl.style.transition = '';
    slideAreaEl.style.transform = '';
  };

  // 実際の日付切替処理本体(todayOffset更新・ボタン見た目・フィルター再計算・再描画)
  const performDayChange = delta => {
    todayOffset += delta;
    if (delta < 0) {
      $('prevDayBtn').classList.add('is-pressed');
      $('nextDayBtn').classList.remove('is-pressed');
    } else {
      $('nextDayBtn').classList.add('is-pressed');
      $('prevDayBtn').classList.remove('is-pressed');
    }
    updateTodayButtonStyle();
    updateSortBtnLabel();
    autoUpdateContentTypeFilters();
    updateManualIndicators();
    updateDisplay(true);
  };

  // スライドアウト→(画面外で)日付切替→スライドインを行う。フリック中の場合は現在位置(既にtranslateX(dx)済み)
  // から続けてスライドアウトさせるため、呼び出し前のslideAreaElの位置はそのまま利用する
  const playDaySlideChange = delta => {
    // 検索窓の日付入力でTODAYモードがONの間は、前後日ボタンと同じ理由でフリックによる日送りも無効化する
    if (!todayMode || searchDateTodayActive || daySlideAnimating) return;
    daySlideAnimating = true;
    const width = slideAreaEl.getBoundingClientRect().width || slideAreaEl.offsetWidth || 300;
    const exitX = delta > 0 ? -width : width; // 翌日=左へ、前日=右へ

    setItemsTransform(exitX, true); // 現在の内容(データ行+NO DATA表示)を画面外へスライドアウト
    const onExitEnd = ev => {
      if (ev.target !== slideAreaEl || ev.propertyName !== 'transform') return;
      slideAreaEl.removeEventListener('transitionend', onExitEnd);

      setItemsTransform(-exitX, false); // 反対側の画面外へ瞬時に配置(この時点ではまだ見えない)
      performDayChange(delta);

      // updateDisplay内部のフェード切替(約120ms)が画面外で完了するのを少し待ってからスライドインする
      setTimeout(() => {
        requestAnimationFrame(() => setItemsTransform(0, true));
      }, DAY_SWAP_WAIT_MS);

      const onEnterEnd = ev2 => {
        if (ev2.target !== slideAreaEl || ev2.propertyName !== 'transform') return;
        slideAreaEl.removeEventListener('transitionend', onEnterEnd);
        resetItemsTransform();
        daySlideAnimating = false;
      };
      slideAreaEl.addEventListener('transitionend', onEnterEnd);
    };
    slideAreaEl.addEventListener('transitionend', onExitEnd);
  };

  $('prevDayBtn').onclick = () => playDaySlideChange(-1);
  $('nextDayBtn').onclick = () => playDaySlideChange(1);

  // ================= TODAYモード:データ部でのフリック操作 =================
  // データ部+NO DATA表示をまとめた#daySlideArea、および画面下部の更新時刻表示(#updateTime)・
  // ヘルプ(?)/設定(⚙)ボタン行(#footerBtnRow)を「フリック開始領域」として扱う。
  // ボタン自体のタップ(短時間・移動量小)は従来どおりclickが発火するため、
  // ?/⚙ボタンのタップ動作とフリック操作は干渉しない。
  // ※これらの領域自体は見た目上は動かさず、フリックで動くのは常に#daySlideArea(データ部+NO DATA表示)側。
  // (#itemsだけに登録すると、0件でNO DATA表示中は#items自体の高さが無くなりタッチを拾えないため、
  //  #noResultも含む親要素の#daySlideAreaを対象にしている)
  // タイトルの独自横スクロール(.item-titleのoverflow-x:auto)より、しきい値を超えたフリックを優先する。
  (() => {
    if (!isTouch) return; // タッチ非対応環境(PCのマウス操作等)では登録しない
    const AXIS_LOCK_PX = 10;       // この移動量で横/縦どちらの操作かをロックする
    const SWIPE_DIST_PX = 70;      // 確定に必要な最小移動距離(px)
    const SWIPE_VELOCITY = 0.35;   // 確定に必要な最小速度(px/ms)。距離が足りなくても素早いフリックなら確定させる
    // フリック開始を受け付ける領域。#daySlideArea以外は見た目上動かないが、
    // ここで指を動かし始めても#daySlideArea側がスライドする
    const flickZones = [slideAreaEl, flickFillEl, $('updateTime'), $('footerBtnRow')].filter(Boolean);

    let startX = 0, startY = 0, startTime = 0;
    let dragDx = 0;
    let axisLock = null; // null=未判定, 'h'=横方向確定, 'v'=縦方向確定(以降は素通しでスクロールに任せる)
    let touchOnScrollableTitle = false; // タイトルリンク(.item-title)が横スクロール可能な長さで、かつそこから触れ始めた場合true

    const onTouchStart = e => {
      // 検索窓の日付入力でTODAYモードがONの間は日送り自体が無効なので、ドラッグの見た目追従も始めない
      if (!todayMode || searchDateTodayActive || daySlideAnimating || e.touches.length !== 1) { axisLock = null; return; }
      // データ行のタイトルリンクが長文で横スクロール可能な場合、そこをホールドしている間は
      // 日付フリックと競合しないよう、この後のtouchmoveで一切介入せずネイティブの横スクロールに任せる
      const titleEl = e.target.closest ? e.target.closest('.item-title') : null;
      touchOnScrollableTitle = !!(titleEl && titleEl.scrollWidth > titleEl.clientWidth + 1);
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      startTime = Date.now();
      dragDx = 0;
      axisLock = null;
    };

    const onTouchMove = e => {
      if (!todayMode || searchDateTodayActive || daySlideAnimating || e.touches.length !== 1 || axisLock === 'v' || touchOnScrollableTitle) return;
      const dx = e.touches[0].clientX - startX;
      const dy = e.touches[0].clientY - startY;

      if (axisLock === null) {
        if (Math.abs(dx) < AXIS_LOCK_PX && Math.abs(dy) < AXIS_LOCK_PX) return; // まだどちらの操作か判定できない
        axisLock = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
        if (axisLock === 'v') return; // 縦スクロールと判定:以降は何もせずブラウザ標準の縦スクロールに任せる
      }

      // 横方向優位と判定:ページの縦スクロールや.item-title自身の横スクロール、
      // ?/⚙ボタンのタップ判定より、この後の確定処理を優先させる
      e.preventDefault();
      dragDx = dx;
      setItemsTransform(dx, false); // 見た目が動くのは常に#daySlideArea側
    };

    const finishSwipe = () => {
      touchOnScrollableTitle = false;
      if (axisLock !== 'h') { axisLock = null; return; }
      const elapsed = Math.max(1, Date.now() - startTime);
      const velocity = Math.abs(dragDx) / elapsed;
      const confirmed = Math.abs(dragDx) >= SWIPE_DIST_PX || velocity >= SWIPE_VELOCITY;
      axisLock = null;

      if (!confirmed) {
        setItemsTransform(0, true); // しきい値未満:指を離した位置から元の位置へなめらかに戻す
        return;
      }
      // 右から左にフリック(dragDx<0)=翌日(delta:+1)、左から右にフリック(dragDx>0)=前日(delta:-1)
      // 現在位置(既にtranslateX(dragDx)済み)からそのままスライドアウトを続ける
      playDaySlideChange(dragDx < 0 ? 1 : -1);
    };

    const onTouchCancel = () => {
      touchOnScrollableTitle = false;
      if (axisLock === 'h' && !daySlideAnimating) setItemsTransform(0, true);
      axisLock = null;
    };

    flickZones.forEach(el => {
      el.addEventListener('touchstart', onTouchStart, { passive: true });
      el.addEventListener('touchmove', onTouchMove, { passive: false });
      el.addEventListener('touchend', finishSwipe);
      el.addEventListener('touchcancel', onTouchCancel);
    });
  })();

  // ================= 操作要素の無い場所の長押しでTODAYモードをON/OFF =================
  // ボタン・リンク・チェックボックス・アクティブフィルターバッジ・モーダル等の「操作要素」、および
  // データ行(.item。タイトルリンクやハート等のタップ操作、フリックと競合するため除外)以外の場所を、
  // 一定距離以上動かさずに約600ms押し続けると、TODAYボタンと同じ処理でTODAYモードをトグルする。
  // データ部(#items)自体の背景(データ行の無い余白・TODAYモードでの画面下までの拡張領域を含む)は
  // 対象に含める。フリックは「動かす」操作、長押しは「動かさない」操作のため、同じ領域でも競合しない。
  (() => {
    const INTERACTIVE_SELECTOR = 'button, a, input, label, [role="button"], [role="dialog"], .filter-badge, .popup-overlay, .setlist-modal-overlay, .item';
    const MOVE_CANCEL_PX = 10; // この距離以上動いたら長押しをキャンセルする(スクロール・フリック操作との誤動作防止)
    const HOLD_MS = 600;

    let timer = null, startX = 0, startY = 0, holding = false;

    const showRipple = (x, y) => {
      const dot = document.createElement('div');
      dot.className = 'longpress-ripple';
      dot.style.left = x + 'px';
      dot.style.top = y + 'px';
      document.body.appendChild(dot);
      dot.addEventListener('animationend', () => dot.remove());
    };

    const clearHold = () => {
      clearTimeout(timer);
      timer = null;
      holding = false;
    };

    const startHold = (x, y, target) => {
      if (target.closest(INTERACTIVE_SELECTOR)) return; // 操作要素の上では発火させない
      startX = x;
      startY = y;
      holding = true;
      timer = setTimeout(() => {
        if (!holding) return;
        holding = false;
        showRipple(x, y);
        $('todayToggleBtn').click();
      }, HOLD_MS);
    };

    const moveHold = (x, y) => {
      if (!holding) return;
      if (Math.abs(x - startX) > MOVE_CANCEL_PX || Math.abs(y - startY) > MOVE_CANCEL_PX) clearHold();
    };

    document.addEventListener('touchstart', e => {
      if (e.touches.length !== 1) { clearHold(); return; }
      startHold(e.touches[0].clientX, e.touches[0].clientY, e.target);
    }, { passive: true });
    document.addEventListener('touchmove', e => {
      if (e.touches.length !== 1) return;
      moveHold(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });
    document.addEventListener('touchend', clearHold);
    document.addEventListener('touchcancel', clearHold);

    // PC(マウス操作)でも同様に、左ボタン押しっぱなしで長押し扱いにする
    document.addEventListener('mousedown', e => {
      if (e.button !== 0) return;
      startHold(e.clientX, e.clientY, e.target);
    });
    document.addEventListener('mousemove', e => moveHold(e.clientX, e.clientY));
    document.addEventListener('mouseup', clearHold);
    document.addEventListener('mouseleave', clearHold);
  })();

  // SETLISTボタン:セトリ検索モードのON/OFF。検索窓の文字列はモード切替時もクリアしない
  $('setlistToggleBtn').onclick = () => {
    setlistMode = !setlistMode;
    $('setlistToggleBtn').classList.toggle('is-active', setlistMode);
    searchSuggestions.classList.remove('is-open'); // モード切替時は検索候補ポップアップを一旦閉じる
    updateSearchPlaceholder();
    // 上部の📋️ボタン(setlistIconMode)は、セトリ検索モード中は強制ONの色つき表示で固定し、クリックも
    // 受け付けない(setlistIconModeの保存値そのものは変更しない、別管理)。セトリ検索モードを抜けたら
    // 保存されているsetlistIconModeの値に応じた通常表示に戻す
    $('setlistIconToggleBtn').classList.toggle('is-active', setlistMode || setlistIconMode);
    if (setlistMode) {
      // セトリ検索モードへ突入:直前のTODAY状態をまるごと保存した上で、TODAYモードは一旦OFFにする
      // (セトリ検索モード中のTODAYはここから独立して別管理になる)
      setlistTodaySavedState = { todayMode, todayOffset, desc, preTodaySort };
      if (todayMode) turnOffTodayMode();
      // 直前の除外状態をまるごと保存した上で、LIVE/EVENT以外のコンテンツ種類をダブルクリックと同じ
      // 除外状態にする(年/グループ等、コンテンツ種類以外の既存の除外指定はそのまま維持する)
      setlistExcludedSavedState = new Set(excludedFilterValues);
      const checkboxArr = Array.from(checkboxes);
      setlistExcludedConts().forEach(v => {
        if (excludedFilterValues.has(v)) return; // 既に除外済みならそのまま(重複追加しない)
        excludedFilterValues.add(v);
        manuallyTouchedConts.delete(v); // 除外指定は手動ON保護より優先させる
        const cb = checkboxArr.find(c => c.value === v);
        if (cb && cb.checked) {
          cb.checked = false;
          cb.dispatchEvent(new Event('change'));
        }
      });
      applyExcludedStyles();
    } else if (setlistTodaySavedState) {
      // セトリ検索モードを終了:突入直前のTODAY状態(ON/OFF・前後日オフセット・ソート順)へ完全復元する
      todayMode = setlistTodaySavedState.todayMode;
      todayOffset = setlistTodaySavedState.todayOffset;
      desc = setlistTodaySavedState.desc;
      preTodaySort = setlistTodaySavedState.preTodaySort;
      setlistTodaySavedState = null;
      updateSortBtnLabel();
      updateTodayButtonStyle();
      // 突入直前の除外状態(コンテンツ種類含む)へ完全復元する
      if (setlistExcludedSavedState) {
        excludedFilterValues.clear();
        setlistExcludedSavedState.forEach(v => excludedFilterValues.add(v));
        setlistExcludedSavedState = null;
        applyExcludedStyles();
      }
    }
    autoUpdateContentTypeFilters();
    updateManualIndicators();
    updateDisplay(true);
  };

  // 除外中のラベルに薄い色のスタイル(is-excluded)を適用/解除する。除外は通常のチェックON状態とは
  // 排他的に扱うため、is-excludedが付く時点でそのcheckboxは常にfalseになっている想定。
  const applyExcludedStyles = () => {
    labels.forEach(l => {
      const cb = l.querySelector('input');
      if (!cb) return;
      l.classList.toggle('is-excluded', excludedFilterValues.has(cb.value));
    });
  };

  // 除外状態をトグルする。除外にする場合、選択中(checked)だったら解除し既存のchangeロジックも発火させる
  const toggleExcludedForLabel = cb => {
    const val = cb.value;
    if (excludedFilterValues.has(val)) {
      excludedFilterValues.delete(val);
    } else {
      excludedFilterValues.add(val);
      manuallyTouchedConts.delete(val); // 除外指定は手動ON保護より優先させる
      if (cb.checked) {
        cb.checked = false;
        cb.dispatchEvent(new Event('change'));
      }
    }
    saveExcludedFilters();
    applyExcludedStyles();
    if (allConts.includes(val) || /^\d{4}$/.test(val) || /^\d{2}$/.test(val)) autoUpdateContentTypeFilters();
    updateManualIndicators();
    updateDisplay(true);
  };

  // ホバーによる件数プレビュー用のデバウンスタイマー。マウスが複数のボタンを素早く通過しただけで
  // 都度previewCountFor(ログ全件のフィルタ処理)が走らないよう、一定時間ホバーが継続した時だけ計算する
  let hoverPreviewTimer = null;
  const bindCheckboxAndLabelEvents = () => {
    if (!isTouch) {
      labels.forEach(l => {
        const cb = l.querySelector('input');
        if (!cb) return;
        const val = cb.value;

        l.onmouseenter = () => {
          if (hoverPreviewTimer) clearTimeout(hoverPreviewTimer);
          hoverPreviewTimer = setTimeout(() => {
            const cnt = previewCountFor(val, cb.checked);
            const rc = $('resultCount');
            rc.textContent = '';
            rc.append('[ ');
            // メンバーはハート、グループ(G2/L2)は四角、コンテンツ種類は絵文字シンボルを、名前の左に
            // 同じ幅・同じ間隔(preview-icon)で添える。名前側もアイコン文字を含まない純粋なテキストにする
            const memberInfo = memberInfoByCode[val];
            let name;
            if (memberInfo) {
              const heart = document.createElement('span');
              heart.className = 'preview-icon';
              heart.textContent = memberInfo.c;
              rc.appendChild(heart);
              name = memberInfo.n;
            } else if (val === 'G2' || val === 'L2') {
              const sq = document.createElement('span');
              sq.className = 'preview-icon preview-icon-square team-' + val.toLowerCase();
              rc.appendChild(sq);
              name = l.querySelector('.label-text').textContent.trim();
            } else if (symbols[val] !== undefined) {
              const icon = document.createElement('span');
              icon.className = 'preview-icon';
              icon.textContent = symbols[val];
              rc.appendChild(icon);
              name = displayNameFor(val);
            } else {
              name = l.querySelector('.label-text').textContent.trim(); // 年・月フィルターなどアイコンが無いもの
            }
            rc.append(name + ' ] PREVIEW > ' + cnt);
          }, 150);
        };

        l.onmouseleave = () => {
          if (hoverPreviewTimer) clearTimeout(hoverPreviewTimer);
          $('resultCount').textContent = defaultText;
        };
      });
    }

    labels.forEach(l => l.onkeydown = e => {
      if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        const cb = l.querySelector('input');
        if (cb) {
          if (excludedFilterValues.has(cb.value)) return; // 除外中はキーボード操作でのON/OFFも無効化する
          cb.checked = !cb.checked;
          if (allConts.includes(cb.value)) manuallyTouchedConts.add(cb.value);
          updateManualIndicators();
          updateMonthFilterVisibility(); // 年フィルターの選択状態が変わるので月フィルターの表示/非表示も再評価
          updateTodayButtonStyle(); // 年フィルターの選択状態が変わるのでTODAYボタンの色を再評価
          updateSortBtnLabel(); // 年フィルターの選択状態が変わるので、TODAYモード中の日付表示も再評価
          updateDisplay(true);
          window.scrollTo({ top: 0, behavior: 'instant' });
        }
      }
    });

    // フィルターボタンのダブルクリック/ダブルタップ:そのボタンの値を「除外」指定に切り替える(再度で解除)。
    // ネイティブのlabelクリック挙動(クリックのたびにチェックボックスをトグル)を常にpreventDefaultで止め、
    // シングル/ダブルの判定を自前のタイマーで行う(マウス・タッチどちらも'click'イベントで統一的に扱えるため)。
    // シングルクリックの反映を(ダブルクリックか判定できるまで)待たせると、押すたびに体感速度が悪化するため、
    // クリックのたびに即座にトグルし、一定時間内に2回目のクリックが来た場合だけ後から除外トグルで補正する。
    // (2回連続でトグルした結果は必ずクリック前の状態に戻るため、そこから除外トグルすれば、最終的な状態は
    // 「反映を遅らせてダブルクリックか確定してから1回だけ判定する」場合と常に一致する)
    const DBLCLICK_THRESHOLD_MS = 300;
    labels.forEach(l => {
      const cb = l.querySelector('input');
      if (!cb) return;
      let clickTimer = null;
      l.onclick = e => {
        e.preventDefault();
        if (clickTimer) {
          // 2回目のクリック(ダブルクリック確定):1回目のクリックで即座に反映済みのチェック状態を、
          // 除外トグルで補正する
          clearTimeout(clickTimer);
          clickTimer = null;
          toggleExcludedForLabel(cb);
          return;
        }
        // 1回目のクリック:ダブルクリックかどうかに関わらず、シングルクリックの動作を即座に反映する
        if (!excludedFilterValues.has(cb.value)) { // 除外中はシングルクリックでのON/OFFも無効化する
          cb.checked = !cb.checked;
          cb.dispatchEvent(new Event('change')); // 既存のcb.onchangeロジック(manuallyTouchedConts等)を発火させる
        }
        clickTimer = setTimeout(() => { clickTimer = null; }, DBLCLICK_THRESHOLD_MS);
      };
    });

    checkboxes.forEach(cb => cb.onchange = () => {
      if (allConts.includes(cb.value)) {
        manuallyTouchedConts.add(cb.value);
      }
      // TODAYモード中に(年フィルターで表示された)月フィルターが押された場合、TODAYモードと月フィルターの
      // 組み合わせには意味が無いため、TODAYモード自体を解除する(押されたその月フィルターは選択されたままにする)
      if (/^\d{2}$/.test(cb.value) && todayMode) {
        todayMode = false;
        todayOffset = 0;
        searchDateTodayActive = false; // 検索窓連動フラグもリセットする
        if (preTodaySort !== null) {
          desc = preTodaySort;
          preTodaySort = null;
        }
        updateSortBtnLabel();
      }
      updateManualIndicators();
      updateMonthFilterVisibility(); // 年フィルターの選択状態が変わるので月フィルターの表示/非表示も再評価
      updateTodayButtonStyle(); // 年フィルターの選択状態が変わるのでTODAYボタンの色を再評価
      updateSortBtnLabel(); // 年フィルターの選択状態が変わるので、TODAYモード中の日付表示も再評価
      // TODAY+年フィルター(TODAYボタンが黄色の状態)は「その年の同じ月日」を意味するため、年フィルターの
      // ON/OFFに応じて該当するコンテンツフィルターを自動で切り替える(年を外せば通常TODAYのコンテンツに戻る)。
      // 月フィルターでTODAYモードを解除した場合も、コンテンツフィルターを通常状態に戻すため再計算する
      if (/^\d{4}$/.test(cb.value) || /^\d{2}$/.test(cb.value)) autoUpdateContentTypeFilters();
      updateDisplay(true);
      window.scrollTo({ top: 0, behavior: 'instant' });
    });

    updateAllBadges();
      updateManualIndicators();
      applyExcludedStyles(); // ラベル再生成(年フィルター等)後も除外中の見た目(薄い色)を再適用する
  };
  bindCheckboxAndLabelEvents();

  // データロード後、実データに含まれる年(4桁)をすべて年フィルターとして動的に生成する(上限なし)
  const refreshYearChecks = () => {
    const yearsSet = new Set();
    logs.forEach(item => {
      const y = item.date ? String(item.date).slice(0, 4) : '';
      if (/^\d{4}$/.test(y)) yearsSet.add(y);
    });
    // 2010年以前はボタンとしては表示しない(データ自体は検索や日付クエリで引き続き閲覧可能)
    const years = Array.from(yearsSet).filter(y => parseInt(y, 10) > 2010).sort((a, b) => b.localeCompare(a));

    $('yearChecks').innerHTML = '';
    years.forEach(y => $('yearChecks').appendChild(createLabel(y)));

    // 年チェックボックスを再生成したので、checkboxes/labelsを再取得してイベントも再登録する
    checkboxes = document.querySelectorAll('.checks input[type="checkbox"]');
    labels = document.querySelectorAll('.checks label:has(input)');
    bindCheckboxAndLabelEvents();
  };

  const restoreFromHash = () => {
    if (updating) return;
    const active = window.location.hash.replace('#', '').split(',').filter(Boolean);
    // 除外指定中の値は、URLで明示的にONと指定されていても常にOFFのままにする(除外との矛盾を防止)
    checkboxes.forEach(cb => cb.checked = active.includes(cb.value) && !excludedFilterValues.has(cb.value));
    // URLで明示的にONになっているコンテンツ種類は手動操作扱いにして保護する。OFFのものは自動on/offの対象に戻す
    manuallyTouchedConts.clear();
    checkboxes.forEach(cb => {
      if (allConts.includes(cb.value) && cb.checked) manuallyTouchedConts.add(cb.value);
    });
    updateSearchClearState();
    applyExcludedStyles();
    updateMonthFilterVisibility(); // URL復元時も、年フィルターの状態に応じて月フィルターの表示/非表示を合わせる
    updateTodayButtonStyle(); // URL復元時も、年フィルターの状態に応じてTODAYボタンの色を合わせる
    updateSortBtnLabel(); // URL復元時も、年フィルターの状態に応じてTODAYモード中の日付表示を合わせる
    updateDisplay(false);
  };

  window.onhashchange = restoreFromHash;

  const resetAll = e => {
    if (e) e.preventDefault();
    checkboxes.forEach(cb => cb.checked = false);
    manuallyTouchedConts.clear();
    if (setlistMode) {
      // セトリ検索モード中のCLEARは、除外指定を「セトリモードの初期表示状態」(LIVE/EVENT以外を除外)に
      // 戻すだけにする。セトリモード突入前の除外状態(setlistExcludedSavedState)はここでは変更しない
      // (復元はセトリボタンでモードを抜けた時のみ行う)。一時的な状態のためlocalStorageへの保存も行わない。
      excludedFilterValues.clear();
      setlistExcludedConts().forEach(v => excludedFilterValues.add(v));
    } else {
      // CLEARで除外指定(ダブルクリック/ダブルタップで設定したもの)もあわせてリセットする
      excludedFilterValues.clear();
      saveExcludedFilters();
    }
    applyExcludedStyles();
    updateMonthFilterVisibility(); // 年フィルターも全解除されるため、月フィルター行も非表示に戻す
    searchInput.value = '';
    updateSearchClearState();
    document.querySelectorAll('.checks-row-years, .checks-row-other, .checks-row-months').forEach(con => con.scrollLeft = 0);
    // TODAY(セトリ検索モード中は独立管理のローカルなTODAY)は、モードに関わらず単純にOFFへ戻す。
    // セトリ検索モード中でも、セトリモード突入前の状態への復元はここでは行わない(復元はセトリボタンで
    // モードを抜けた時のみ行う。CLEARは「セトリモードの初期表示状態」に戻すだけ)
    if (todayMode) turnOffTodayMode();
    // CLEARでハートモードもOFFにする(再描画される行が展開済みの状態で作られないようにする)
    heartModeOn = false;
    $('heartToggleBtn').classList.remove('is-active');
    // CLEARでコンテンツ名アコーディオンも全行分OFFにする(同上。updateDisplay側でも既定でクリアされるが明示しておく)
    expandedContentKeys.clear();
    // セトリ検索モードはCLEARでは終了しない。抜けるのはセトリボタン(setlistToggleBtn)押下時のみ。
    window.scrollTo({ top: 0, behavior: 'instant' });
    updateDisplay(true);
  };

  $('resetLink').onclick = e => {
    resetAll(e);
    forceReloadLogs(); // タイトルクリック時は直近チェック時刻やSHA比較を無視し、常に最新のlogs.jsonを取得し直す
    forceReloadSongs(); // songs.json(♪の楽曲データ)も同様に強制的に取得し直す
    forceReloadSetlist(); // setlist.json(セトリ検索用データ)も同様に強制的に取得し直す
  };
  $('quickResetBtn').onclick = resetAll;
  $('inlineClearBtn').onclick = resetAll;

  fetch('/feeds/posts/default?alt=json&max-results=1')
    .then(res => res.json())
    .then(data => {
      const entry = data.feed.entry;
      if (entry && entry.length > 0) {
        const updatedStr = entry[0].updated.$t;
        const dateObj = new Date(updatedStr);
        const y = dateObj.getFullYear();
        const m = String(dateObj.getMonth() + 1).padStart(2, '0');
        const d = String(dateObj.getDate()).padStart(2, '0');
        $('updateTime').textContent = `updated > ${y}.${m}.${d}`;
      }
    })
    .catch(err => {
      console.error('Failed to load blogger feed:', err);
    });

  // logs.json取得:GitHub上の最新コミットSHAを確認し、変更があった場合のみ
  // コミット固定のjsDelivr URL(長期キャッシュ可能)から取得しなおす。
  // 変更がなければlocalStorageのキャッシュをそのまま使い、通信を省略する。
  const REPO = 'piscenake52/gllogs';
  const BRANCH = 'main';
  const FILE = 'logs.json';
  const VERSION_KEY = 'gl_log_sha';
  const DATA_KEY = 'gl_log_data';
  const CHECK_TIME_KEY = 'gl_log_checked_at';
  const CHECK_COOLDOWN_MS = 1 * 60 * 1000; // 5分以内の再チェックはスキップ(同一端末でのAPI消費を抑制)

  const applyLogs = data => {
    // 日付、時刻、コンテンツ種類、タイトル、URLがすべて一致する重複データを排除
    const seen = new Set();
    logs = data.filter(item => {
      const identifier = `${item.date || ''}_${item.time || ''}_${item.contents || ''}_${item.title || ''}_${item.url || ''}`;
      if (seen.has(identifier)) return false;
      seen.add(identifier);
      return true;
    });

    refreshYearChecks();
    // ページ読込時にTODAYモードがON状態で復元されている場合、実データを踏まえてコンテンツ種類フィルターを再計算する
    if (todayMode) {
      autoUpdateContentTypeFilters();
      updateManualIndicators();
    }
    window.location.hash ? restoreFromHash() : updateDisplay(true);
  };

  const loadFromCacheIfAny = () => {
    const cached = localStorage.getItem(DATA_KEY);
    if (!cached) return false;
    try {
      applyLogs(JSON.parse(cached));
      return true;
    } catch (e) {
      // 壊れたキャッシュは無視して素通り(新規取得に進む)
      return false;
    }
  };

  const fetchFreshData = sha => {
    const url = sha
      ? `https://cdn.jsdelivr.net/gh/${REPO}@${sha}/${FILE}`
      // SHA取得に失敗した場合の保険:キャッシュバスト付きでrawから直接取得
      : `https://raw.githubusercontent.com/${REPO}/${BRANCH}/${FILE}?v=${Date.now()}`;

    return fetch(url)
      .then(res => {
        if (!res.ok) throw new Error('Network response was not ok');
        return res.json();
      })
      .then(data => {
        applyLogs(data);
        localStorage.setItem(DATA_KEY, JSON.stringify(data));
        if (sha) localStorage.setItem(VERSION_KEY, sha);
      });
  };

  // まずキャッシュがあれば即表示(体感速度アップ)
  const hadCache = loadFromCacheIfAny();

  const showLoadError = () => {
    $('resultCount').textContent = '';
    $('sortBtn').style.display = 'none';
    $('inlineClearBtn').style.display = 'none';
    $('noResult').style.display = 'none';
    $('loadError').style.display = 'block';
  };

  $('retryBtn').onclick = () => {
    $('loadError').style.display = 'none';
    $('resultCount').textContent = 'LOADING...';
    checkForUpdates();
  };

  // 最新コミットSHAを確認し、更新があれば取り直す(初回読み込み・再試行ボタンの両方から呼ばれる)
  const checkForUpdates = () => {
    fetch(`https://api.github.com/repos/${REPO}/commits?path=${FILE}&sha=${BRANCH}&page=1&per_page=1`, { cache: 'no-store' })
      .then(res => {
        if (!res.ok) throw new Error('GitHub API error');
        return res.json();
      })
      .then(commits => {
        localStorage.setItem(CHECK_TIME_KEY, String(Date.now()));
        const latestSha = commits[0]?.sha;
        const cachedSha = localStorage.getItem(VERSION_KEY);
        if (latestSha && latestSha !== cachedSha) {
          return fetchFreshData(latestSha);
        }
        // 変更なし:キャッシュを表示済みでなければ念のため取得
        if (!logs.length) return fetchFreshData(latestSha);
      })
      .catch(error => {
        console.error('Failed to check logs.json version:', error);
        // API失敗時のフォールバック:キャッシュがなければ直接取得を試みる
        if (!logs.length) {
          fetchFreshData(null).catch(err2 => {
            console.error('Failed to load logs.json:', err2);
            showLoadError();
          });
        }
      });
  };

  // 直近チェックから一定時間以内なら、GitHub APIへの問い合わせ自体をスキップする
  const lastCheckedAt = parseInt(localStorage.getItem(CHECK_TIME_KEY) || '0', 10);
  const withinCooldown = hadCache && (Date.now() - lastCheckedAt < CHECK_COOLDOWN_MS);

  // トップのタイトルリンク(GL log)クリック時に呼ばれる:直近チェック時刻のクールダウンや
  // SHA比較によるスキップを行わず、常に最新コミットのlogs.jsonを取得し直す
  const forceReloadLogs = () => {
    fetch(`https://api.github.com/repos/${REPO}/commits?path=${FILE}&sha=${BRANCH}&page=1&per_page=1`, { cache: 'no-store' })
      .then(res => {
        if (!res.ok) throw new Error('GitHub API error');
        return res.json();
      })
      .then(commits => {
        localStorage.setItem(CHECK_TIME_KEY, String(Date.now()));
        return fetchFreshData(commits[0]?.sha);
      })
      .catch(error => {
        console.error('Failed to force-reload logs.json:', error);
        fetchFreshData(null).catch(err2 => {
          console.error('Failed to load logs.json:', err2);
          showLoadError();
        });
      });
  };

  // 特定の配信元からのアクセス時は、直近チェック時刻やSHA比較によるスキップを行わず常に最新のlogs.jsonを取得し直す
  // (対象URLは難読化のためソースに直接書かず、head内のスクリプトと同じハッシュ比較で判定する)
  if (isForcedFreshSource()) {
    forceReloadLogs();
  } else if (!withinCooldown) {
    checkForUpdates();
  }

  // ================= 楽曲紹介バー(♪) =================
  // songs.json(artist/title/link)取得:logs.jsonと同じ方式(GitHub上の最新コミットSHAを確認し、
  // 変更があった場合のみコミット固定のjsDelivr URLから取得しなおす。変更がなければキャッシュを使う)。
  // 画面が表示される(=データ取得が走る)たびに、その中から1曲をランダムに抽出して表示する。
  const SONG_FILE = 'songs.json';
  const SONG_VERSION_KEY = 'gl_song_sha';
  const SONG_DATA_KEY = 'gl_song_data';
  const SONG_CHECK_TIME_KEY = 'gl_song_checked_at';

  let currentSong = null;

  // テロップ:表示エリアに収まりきらない場合のみ、テキストを複製してループスクロールさせる
  const updateSongTickerScroll = () => {
    const viewport = $('songTickerViewport');
    const textEl = $('songTickerText');
    if (!viewport || !textEl) return;
    const label = textEl.dataset.label || '';
    viewport.classList.remove('is-scrolling');
    textEl.style.animationDuration = '';
    textEl.textContent = label;
    if (!label) return;
    // 表示中(is-open)でなければ幅が0のため正しく測れない。表示中のみ判定する
    if (!$('songBar').classList.contains('is-open')) return;
    requestAnimationFrame(() => {
      if (textEl.scrollWidth <= viewport.clientWidth) return; // 収まっていればスクロール不要
      textEl.textContent = '';
      const first = document.createElement('span');
      first.textContent = label;
      const gap = document.createElement('span');
      gap.textContent = '\u3000\u3000\u3000';
      const second = document.createElement('span');
      second.textContent = label;
      textEl.append(first, gap, second);
      const singleWidth = first.getBoundingClientRect().width + gap.getBoundingClientRect().width;
      const duration = Math.max(6, singleWidth / 40); // 速度:約40px/秒、最短6秒
      textEl.style.animationDuration = duration + 's';
      viewport.classList.add('is-scrolling');
    });
  };

  // PC/モバイル問わず、PLAYボタンはリンク先を新しいタブで開くだけ(元のタブへのフォーカス復帰は行わない)
  const openSongLink = link => {
    if (!link) return;
    window.open(link, '_blank');
  };

  $('songPlayBtn').onclick = () => {
    if (!currentSong || !currentSong.link) return;
    openSongLink(currentSong.link);
  };

  const applySong = song => {
    currentSong = song || null;
    const textEl = $('songTickerText');
    textEl.dataset.label = currentSong ? `${currentSong.title || ''} / ${currentSong.artist || ''}` : '';
    updateSongTickerScroll();
  };

  const applySongs = data => {
    if (!Array.isArray(data)) return;
    songsData = data; // SETLISTポップアップの曲名照合用に全件保持しておく
    if (data.length === 0) return;
    applySong(data[Math.floor(Math.random() * data.length)]);
  };

  const loadSongsFromCacheIfAny = () => {
    const cached = localStorage.getItem(SONG_DATA_KEY);
    if (!cached) return false;
    try {
      applySongs(JSON.parse(cached));
      return true;
    } catch (e) {
      return false; // 壊れたキャッシュは無視して素通り(新規取得に進む)
    }
  };

  const fetchFreshSongs = sha => {
    const url = sha
      ? `https://cdn.jsdelivr.net/gh/${REPO}@${sha}/${SONG_FILE}`
      : `https://raw.githubusercontent.com/${REPO}/${BRANCH}/${SONG_FILE}?v=${Date.now()}`;
    return fetch(url)
      .then(res => {
        if (!res.ok) throw new Error('Network response was not ok');
        return res.json();
      })
      .then(data => {
        applySongs(data);
        localStorage.setItem(SONG_DATA_KEY, JSON.stringify(data));
        if (sha) localStorage.setItem(SONG_VERSION_KEY, sha);
      });
  };

  const hadSongCache = loadSongsFromCacheIfAny();

  const checkForSongUpdates = () => {
    fetch(`https://api.github.com/repos/${REPO}/commits?path=${SONG_FILE}&sha=${BRANCH}&page=1&per_page=1`, { cache: 'no-store' })
      .then(res => {
        if (!res.ok) throw new Error('GitHub API error');
        return res.json();
      })
      .then(commits => {
        localStorage.setItem(SONG_CHECK_TIME_KEY, String(Date.now()));
        const latestSha = commits[0]?.sha;
        const cachedSha = localStorage.getItem(SONG_VERSION_KEY);
        if (latestSha && latestSha !== cachedSha) {
          return fetchFreshSongs(latestSha);
        }
        if (!currentSong) return fetchFreshSongs(latestSha);
      })
      .catch(error => {
        console.error('Failed to check songs.json version:', error);
        if (!currentSong) {
          fetchFreshSongs(null).catch(err2 => {
            console.error('Failed to load songs.json:', err2);
          });
        }
      });
  };

  const lastSongCheckedAt = parseInt(localStorage.getItem(SONG_CHECK_TIME_KEY) || '0', 10);
  const withinSongCooldown = hadSongCache && (Date.now() - lastSongCheckedAt < CHECK_COOLDOWN_MS);

  // トップのタイトルリンク(GL log)クリック時に呼ばれる:直近チェック時刻のクールダウンやSHA比較による
  // スキップを行わず、常に最新コミットのsongs.jsonを取得し直す(logs側のforceReloadLogsと同じ考え方)
  const forceReloadSongs = () => {
    fetch(`https://api.github.com/repos/${REPO}/commits?path=${SONG_FILE}&sha=${BRANCH}&page=1&per_page=1`, { cache: 'no-store' })
      .then(res => {
        if (!res.ok) throw new Error('GitHub API error');
        return res.json();
      })
      .then(commits => {
        localStorage.setItem(SONG_CHECK_TIME_KEY, String(Date.now()));
        return fetchFreshSongs(commits[0]?.sha);
      })
      .catch(error => {
        console.error('Failed to force-reload songs.json:', error);
        fetchFreshSongs(null).catch(err2 => {
          console.error('Failed to load songs.json:', err2);
        });
      });
  };

  // 特定の配信元からのアクセス時は、logs.json同様にsongs.jsonも常に取得し直す
  if (isForcedFreshSource()) {
    forceReloadSongs();
  } else if (!withinSongCooldown) {
    checkForSongUpdates();
  }

  // ================= セトリ検索モード(SETLIST) =================
  // setlist.json(公演ごとのセットリスト)取得:logs.json/songs.jsonと同じ方式
  const SETLIST_FILE = 'setlist.json';
  const SETLIST_VERSION_KEY = 'gl_setlist_sha';
  const SETLIST_DATA_KEY = 'gl_setlist_data';
  const SETLIST_CHECK_TIME_KEY = 'gl_setlist_checked_at';

  const applySetlistData = data => {
    setlistData = Array.isArray(data) ? data : [];
    rebuildSetlistIdToMemberMap();
    // 既にセトリ検索モード中に読み込みが完了した場合は、結果を反映するため再描画する
    if (setlistMode) {
      autoUpdateContentTypeFilters();
      updateManualIndicators();
      updateDisplay(true);
    }
  };

  const loadSetlistFromCacheIfAny = () => {
    const cached = localStorage.getItem(SETLIST_DATA_KEY);
    if (!cached) return false;
    try {
      applySetlistData(JSON.parse(cached));
      return true;
    } catch (e) {
      return false; // 壊れたキャッシュは無視して素通り(新規取得に進む)
    }
  };

  const fetchFreshSetlist = sha => {
    const url = sha
      ? `https://cdn.jsdelivr.net/gh/${REPO}@${sha}/${SETLIST_FILE}`
      : `https://raw.githubusercontent.com/${REPO}/${BRANCH}/${SETLIST_FILE}?v=${Date.now()}`;
    return fetch(url)
      .then(res => {
        if (!res.ok) throw new Error('Network response was not ok');
        return res.json();
      })
      .then(data => {
        applySetlistData(data);
        localStorage.setItem(SETLIST_DATA_KEY, JSON.stringify(data));
        if (sha) localStorage.setItem(SETLIST_VERSION_KEY, sha);
      });
  };

  const hadSetlistCache = loadSetlistFromCacheIfAny();

  const checkForSetlistUpdates = () => {
    fetch(`https://api.github.com/repos/${REPO}/commits?path=${SETLIST_FILE}&sha=${BRANCH}&page=1&per_page=1`, { cache: 'no-store' })
      .then(res => {
        if (!res.ok) throw new Error('GitHub API error');
        return res.json();
      })
      .then(commits => {
        localStorage.setItem(SETLIST_CHECK_TIME_KEY, String(Date.now()));
        const latestSha = commits[0]?.sha;
        const cachedSha = localStorage.getItem(SETLIST_VERSION_KEY);
        if (latestSha && latestSha !== cachedSha) {
          return fetchFreshSetlist(latestSha);
        }
        if (!setlistData.length) return fetchFreshSetlist(latestSha);
      })
      .catch(error => {
        console.error('Failed to check setlist.json version:', error);
        if (!setlistData.length) {
          fetchFreshSetlist(null).catch(err2 => {
            console.error('Failed to load setlist.json:', err2);
          });
        }
      });
  };

  const lastSetlistCheckedAt = parseInt(localStorage.getItem(SETLIST_CHECK_TIME_KEY) || '0', 10);
  const withinSetlistCooldown = hadSetlistCache && (Date.now() - lastSetlistCheckedAt < CHECK_COOLDOWN_MS);

  // トップのタイトルリンク(GL log)クリック時に呼ばれる:logs.json/songs.json同様にsetlist.jsonも常に取得し直す
  const forceReloadSetlist = () => {
    fetch(`https://api.github.com/repos/${REPO}/commits?path=${SETLIST_FILE}&sha=${BRANCH}&page=1&per_page=1`, { cache: 'no-store' })
      .then(res => {
        if (!res.ok) throw new Error('GitHub API error');
        return res.json();
      })
      .then(commits => {
        localStorage.setItem(SETLIST_CHECK_TIME_KEY, String(Date.now()));
        return fetchFreshSetlist(commits[0]?.sha);
      })
      .catch(error => {
        console.error('Failed to force-reload setlist.json:', error);
        fetchFreshSetlist(null).catch(err2 => {
          console.error('Failed to load setlist.json:', err2);
        });
      });
  };

  // 特定の配信元からのアクセス時は、logs.json/songs.json同様にsetlist.jsonも常に取得し直す
  if (isForcedFreshSource()) {
    forceReloadSetlist();
  } else if (!withinSetlistCooldown) {
    checkForSetlistUpdates();
  }
})();

</script>
